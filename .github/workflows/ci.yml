name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Nightly full Apex run on main: the safety net for pull requests that skipped Apex tests.
  # 07:15 UTC is 03:15 New York time in summer, 02:15 in winter (docs/ci-setup.md).
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

concurrency:
  # A new push cancels the older run of the same pull request, or of main. The nightly and
  # by-hand full runs have their own group and are never cancelled by a merge.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  static:
    name: LWC Jest and Code Analyzer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: LWC Jest
        run: npm run test:unit
      - name: LWC Jest, as if the package had its namespace
        # Every component's tests, with every schema import named shoresh__...: a component
        # that spells a field name as text fails here (docs/adr/0009-namespace-safe-names.md).
        run: npm run test:unit:namespaced
      - name: No field or object names written as text
        # scripts/namespace-safety.js: any one fails the check (docs/adr/0009-namespace-safe-names.md).
        run: npm run check:namespace
      - name: Install Salesforce CLI and Code Analyzer
        run: |
          npm install --global @salesforce/cli@2.154.4
          sf plugins install code-analyzer@5.16.0
      - name: Salesforce Code Analyzer
        # Recommended rules; fails on moderate (3) or worse.
        run: sf code-analyzer run --workspace force-app --severity-threshold 3 --output-file code-analyzer.html
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: code-analyzer-report
          path: code-analyzer.html
          if-no-files-found: ignore

  pr-category:
    name: Which org checks this change needs
    runs-on: ubuntu-24.04
    if: github.event_name != 'push'
    outputs:
      category: ${{ steps.decide.outputs.category }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Decide from the changed files
        # docs: no org check needed; screen: deploy only; full: deploy and every Apex test.
        # scripts/ci-pr-category.js says full whenever in doubt. Nightly and by-hand runs: full.
        id: decide
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            node scripts/ci-pr-category.js "$BASE_REF" | tee -a "$GITHUB_OUTPUT"
          else
            echo "category=full" | tee -a "$GITHUB_OUTPUT"
            echo "reason=$GITHUB_EVENT_NAME run: the full Apex suite on $GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"
          fi

  scratch-org:
    name: Scratch org deploy and Apex tests
    runs-on: ubuntu-24.04
    needs: pr-category
    # Pushes to main run only the quick checks; main's full Apex run is the nightly one.
    if: github.event_name != 'push'
    # Every pull request deploys to the one test org (scripts/renew-test-org.sh makes it).
    # Greg's rule: exactly two orgs, the Dev Hub and this test org; CI never creates one.
    # One run at a time, so two pull requests never deploy over each other. The others wait
    # in line, first come first served: queue: max keeps up to 100 waiting. Without it GitHub
    # keeps only one waiting and cancels it when another arrives (docs/ci-setup.md).
    # A docs-only pull request never touches the org, so it gets a group of its own and doesn't
    # wait in that line; the check still reports, and passes.
    concurrency:
      group: ${{ needs.pr-category.outputs.category == 'docs' && format('no-test-org-{0}', github.run_id) || 'shared-test-org' }}
      cancel-in-progress: false
      queue: max
    env:
      SFDX_AUTH_URL_CI: ${{ secrets.SFDX_AUTH_URL_CI }}
      CATEGORY: ${{ needs.pr-category.outputs.category }}
      REASON: ${{ needs.pr-category.outputs.reason }}
    steps:
      - name: What this change needs
        run: |
          case "$CATEGORY" in
            docs)   what="No org check needed: nothing deployed, no Apex tests." ;;
            screen) what="Deploy to the test org, no Apex tests." ;;
            *)      what="Deploy to the test org and run every Apex test." ;;
          esac
          echo "Category: ${CATEGORY:-full}. $what"
          echo "Why: $REASON"
          {
            echo "### Category: ${CATEGORY:-full}"
            echo "$what"
            echo
            echo "Why: $REASON"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        if: env.CATEGORY != 'docs'
      - name: Check the shared test org secret is set
        if: env.CATEGORY != 'docs'
        run: |
          if [ -z "$SFDX_AUTH_URL_CI" ]; then
            echo "::error::The SFDX_AUTH_URL_CI secret is not set. Run scripts/renew-test-org.sh (see docs/ci-setup.md)."
            exit 1
          fi
      - uses: actions/setup-node@v7
        if: env.CATEGORY != 'docs'
        with:
          node-version: 22
      - name: Install Salesforce CLI
        if: env.CATEGORY != 'docs'
        run: npm install --global @salesforce/cli@2.154.4
      - name: Log in to the shared test org
        if: env.CATEGORY != 'docs'
        run: |
          if ! echo "$SFDX_AUTH_URL_CI" | sf org login sfdx-url --sfdx-url-stdin - --alias ci --set-default; then
            echo "::error::Could not log in to the shared test org. It has probably expired (they last 30 days). Run scripts/renew-test-org.sh (see docs/ci-setup.md), then re-run this check."
            exit 1
          fi
      - name: Deploy
        if: env.CATEGORY != 'docs'
        run: |
          if [ -z "$(find force-app -type f ! -name .gitkeep)" ]; then
            echo "::notice::No metadata in force-app yet; nothing to deploy."
          else
            # The shared org is also deployed to by hand, so its change tracking reports
            # conflicts; the repository is always what should end up in the org.
            sf project deploy start --source-dir force-app --ignore-conflicts --test-level NoTestRun --wait 30
          fi
      - name: Apex tests
        # Skipped only for docs and screen-only pull requests; anything unrecognised runs them.
        if: env.CATEGORY != 'docs' && env.CATEGORY != 'screen'
        # One class at a time, run directly: queued runs (RunLocalTests) count against the test
        # org's daily allowance of 500 queued test classes, which CI and sessions share, and a
        # busy day used it up (2026-10-16). See docs/ci-setup.md.
        run: node scripts/run-apex-tests.mjs
