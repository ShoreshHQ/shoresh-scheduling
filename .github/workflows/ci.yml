name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: LWC Jest and Code Analyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: LWC Jest
        run: npm run test:unit
      - name: Install Salesforce CLI and Code Analyzer
        run: |
          npm install --global @salesforce/cli@2.154.4
          sf plugins install code-analyzer@5.16.0
      - name: Salesforce Code Analyzer
        # Recommended rules; fails on moderate (3) or worse.
        run: sf code-analyzer run --workspace force-app --severity-threshold 3 --output-file code-analyzer.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-analyzer-report
          path: code-analyzer.html
          if-no-files-found: ignore

  scratch-org:
    name: Scratch org deploy and Apex tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Every pull request deploys to the same shared test org (scripts/renew-ci-org.sh makes
    # it), instead of creating a new org each run, so CI does not use up the Dev Hub's daily
    # allowance. One run at a time, so two pull requests never deploy over each other.
    concurrency:
      group: shared-test-org
      cancel-in-progress: false
    env:
      SFDX_AUTH_URL_CI: ${{ secrets.SFDX_AUTH_URL_CI }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the shared test org secret is set
        run: |
          if [ -z "$SFDX_AUTH_URL_CI" ]; then
            echo "::error::The SFDX_AUTH_URL_CI secret is not set. Run scripts/renew-ci-org.sh (see docs/ci-setup.md)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli@2.154.4
      - name: Log in to the shared test org
        run: |
          if ! echo "$SFDX_AUTH_URL_CI" | sf org login sfdx-url --sfdx-url-stdin - --alias ci --set-default; then
            echo "::error::Could not log in to the shared test org. It has probably expired (they last 30 days). Run scripts/renew-ci-org.sh (see docs/ci-setup.md), then re-run this check."
            exit 1
          fi
      - name: Deploy
        run: |
          if [ -z "$(find force-app -type f ! -name .gitkeep)" ]; then
            echo "::notice::No metadata in force-app yet; nothing to deploy."
          else
            sf project deploy start --source-dir force-app --wait 30
          fi
      - name: Apex tests
        run: |
          if ! grep -rqli '@istest' force-app --include='*.cls'; then
            echo "::notice::No Apex test classes yet."
          else
            sf apex run test --test-level RunLocalTests --code-coverage --result-format human --wait 30
          fi
