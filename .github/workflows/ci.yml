name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: LWC Jest and Code Analyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: LWC Jest
        run: npm run test:unit
      - name: Install Salesforce CLI and Code Analyzer
        run: |
          npm install --global @salesforce/cli
          sf plugins install code-analyzer@5.16.0
      - name: Salesforce Code Analyzer
        # Fails on moderate (3) or worse: the same engines AppExchange security review uses.
        run: sf code-analyzer run --workspace force-app --severity-threshold 3 --output-file code-analyzer.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-analyzer-report
          path: code-analyzer.html
          if-no-files-found: ignore

  scratch-org:
    name: Scratch org deploy and Apex tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      SFDX_AUTH_URL_DEVHUB: ${{ secrets.SFDX_AUTH_URL_DEVHUB }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the Dev Hub secret is set
        run: |
          if [ -z "$SFDX_AUTH_URL_DEVHUB" ]; then
            echo "::error::The SFDX_AUTH_URL_DEVHUB secret is not set. See docs/ci-setup.md."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli
      - name: Log in to the Dev Hub
        run: |
          echo "$SFDX_AUTH_URL_DEVHUB" > devhub.auth
          sf org login sfdx-url --sfdx-url-file devhub.auth --alias devhub --set-default-dev-hub
          rm devhub.auth
      - name: Create a scratch org for this pull request
        run: |
          sf org create scratch --definition-file config/project-scratch-def.json \
            --alias ci --set-default --duration-days 1 --wait 15
      - name: Deploy
        run: |
          if [ -z "$(find force-app -type f ! -name .gitkeep)" ]; then
            echo "::notice::No metadata in force-app yet; nothing to deploy."
          else
            sf project deploy start --source-dir force-app --wait 30
          fi
      - name: Apex tests
        run: |
          if ! grep -rqli '@istest' force-app --include=*.cls; then
            echo "::notice::No Apex test classes yet."
          else
            sf apex run test --test-level RunLocalTests --code-coverage --result-format human --wait 30
          fi
      - name: Delete the scratch org
        if: always()
        run: sf org delete scratch --target-org ci --no-prompt || true
