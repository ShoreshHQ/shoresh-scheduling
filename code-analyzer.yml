# Salesforce Code Analyzer settings (picked up from the folder it runs in; CI runs it at the
# repository root).
ignores:
  files:
    # Third-party libraries shipped as static resources (SheetJS, minified) are not our code.
    # Their versions and licences are recorded in docs/adr and NOTICE.
    - "**/staticresources/**"

# Narrow suppressions for the AppExchange security-review rules (docs/ci-setup.md). Each entry is one
# file or folder, one rule, and a limit, so a new hit of the same rule elsewhere still fails CI. Paths
# are relative to the scanned folder (CI runs with --workspace force-app).
suppressions:
  # Key__c / QuestionKey__c / PublishKey__c are duplicate-check lookup keys built from visible values (names, dates),
  # not secrets, so ProtectSensitiveData does not apply.
  "main/default/objects/CampLabel__c/fields/Key__c.field-meta.xml":
    - rule_selector: "pmd:ProtectSensitiveData"
      max_suppressed_violations: 1
      reason: "Lookup key made from the label's own words, not a secret."
  "main/default/objects/ImportAnswer__c/fields/Key__c.field-meta.xml":
    - rule_selector: "pmd:ProtectSensitiveData"
      max_suppressed_violations: 1
      reason: "Lookup key for a saved import answer, not a secret."
  "main/default/objects/ImportAnswer__c/fields/QuestionKey__c.field-meta.xml":
    - rule_selector: "pmd:ProtectSensitiveData"
      max_suppressed_violations: 1
      reason: "Names which import question was answered, not a secret."
  "main/default/objects/LearnedEvent__c/fields/QuestionKey__c.field-meta.xml":
    - rule_selector: "pmd:ProtectSensitiveData"
      max_suppressed_violations: 1
      reason: "Names which import question a learned event is about, not a secret."
  "main/default/objects/LocationType__c/fields/Key__c.field-meta.xml":
    - rule_selector: "pmd:ProtectSensitiveData"
      max_suppressed_violations: 1
      reason: "Lookup key made from the location type's name, not a secret."
  "main/default/objects/Schedule__c/fields/PublishKey__c.field-meta.xml":
    - rule_selector: "pmd:ProtectSensitiveData"
      max_suppressed_violations: 1
      reason: "Program and week, so a week has one published schedule; not a secret."
  "main/default/objects/Week__c/fields/Key__c.field-meta.xml":
    - rule_selector: "pmd:ProtectSensitiveData"
      max_suppressed_violations: 1
      reason: "Season and start date, used to stop duplicate weeks, not a secret."
  "main/default/objects/PlanPart__c/fields/Key__c.field-meta.xml":
    - rule_selector: "pmd:ProtectSensitiveData"
      max_suppressed_violations: 1
      reason: "Special day or event and part number, so a plan has each part once; not a secret."
  "main/default/objects/SpecialDate__c/fields/Key__c.field-meta.xml":
    - rule_selector: "pmd:ProtectSensitiveData"
      max_suppressed_violations: 1
      reason: "Week, weekday and what is placed, so a week day holds one special day; not a secret."
  "main/default/objects/SpecialDay__c/fields/Key__c.field-meta.xml":
    - rule_selector: "pmd:ProtectSensitiveData"
      max_suppressed_violations: 1
      reason: "Season and name, used to stop duplicate special days, not a secret."
  "main/default/objects/SpecialEvent__c/fields/Key__c.field-meta.xml":
    - rule_selector: "pmd:ProtectSensitiveData"
      max_suppressed_violations: 1
      reason: "Season and name, used to stop duplicate special events, not a secret."
  "main/default/objects/ElectiveSet__c/fields/Key__c.field-meta.xml":
    - rule_selector: "pmd:ProtectSensitiveData"
      max_suppressed_violations: 1
      reason: "Season and name, used to stop duplicate elective sets, not a secret."
  "main/default/objects/Offering__c/fields/Key__c.field-meta.xml":
    - rule_selector: "pmd:ProtectSensitiveData"
      max_suppressed_violations: 1
      reason: "Elective set and activity, so an activity is offered once in a set; not a secret."
  "main/default/objects/Camper__c/fields/Key__c.field-meta.xml":
    - rule_selector: "pmd:ProtectSensitiveData"
      max_suppressed_violations: 1
      reason: "Season and camper number (else a hash of the name), to stop duplicate campers; not a secret."
  "main/default/objects/Preference__c/fields/Key__c.field-meta.xml":
    - rule_selector: "pmd:ProtectSensitiveData"
      max_suppressed_violations: 1
      reason: "Run and camper, so a camper has one set of choices per run; not a secret."
  "main/default/objects/Assignment__c/fields/Key__c.field-meta.xml":
    - rule_selector: "pmd:ProtectSensitiveData"
      max_suppressed_violations: 1
      reason: "Run, camper, date and time block, so a camper has one seat at a time; not a secret."
  # Design rule, not security: the engine's inputs go to the screen as one answer (one request when
  # a week opens); splitting them would add a round trip for nothing.
  "main/default/classes/GeneratedInputs.cls":
    - rule_selector: "pmd:TooManyFields"
      max_suppressed_violations: 1
      reason: "One answer carrying everything the engine and screen need for a week."
  # Design rule, not security: SetupMatch.Ask.versionKept is a property ({ get; set; }) because
  # Salesforce fills only properties of a class a screen sends (scripts/apex-aura-inputs.js); PMD
  # counts its setter as a method taking a Boolean.
  "main/default/classes/SetupMatch.cls":
    - rule_selector: "pmd:AvoidBooleanMethodParameters"
      max_suppressed_violations: 1
      reason: "The setter of a Boolean property the screen sends (Ask.versionKept)."
  # The same for SpecialScheduleImport.Imported.replaceEdited: the director's yes to replacing time
  # blocks or stations they changed (ADR 0014 choice 17).
  "main/default/classes/SpecialScheduleImport.cls":
    - rule_selector: "pmd:AvoidBooleanMethodParameters"
      max_suppressed_violations: 1
      reason: "The setter of a Boolean property the screen sends (Imported.replaceEdited)."
  # The living dot field animates with requestAnimationFrame, the browser's clock for drawing, which
  # pauses itself in a hidden tab (ADR 0015 choice 13); not a timer. Inline disables are refused,
  # so eslint.config.js turns the rule off for this one file too.
  "main/default/lwc/shoreshDotField/shoreshDotField.js":
    - rule_selector: "eslint:@lwc/lwc/no-async-operation"
      max_suppressed_violations: 1
      reason: "requestAnimationFrame for the dot field's frames, one call."
  # Roots' motion (ADR 0020) animates with requestAnimationFrame too, and counts hover intent's short
  # waits on those frames rather than with timers: one file, its two calls (ask for a frame, call one
  # off).
  "main/default/lwc/shoreshMotion/shoreshMotion.js":
    - rule_selector: "eslint:@lwc/lwc/no-async-operation"
      max_suppressed_violations: 2
      reason: "requestAnimationFrame and cancelAnimationFrame for the motion engine's frames."
  # Jest tests fake real browser keyboard and mouse events, which are bubbling and composed in a
  # browser; components themselves never fire composed events.
  "main/default/lwc/shoreshAsk/__tests__":
    - rule_selector: "pmd:AvoidLwcBubblesComposedTrue"
      max_suppressed_violations: 1
      reason: "Test fakes a real browser keydown, which is composed."
  "main/default/lwc/shoreshManualBuild/__tests__":
    - rule_selector: "pmd:AvoidLwcBubblesComposedTrue"
      max_suppressed_violations: 6
      reason: "Tests fake real browser keydown and dblclick events, which are composed."
  "main/default/lwc/shoreshScheduleGrid/__tests__/shoreshScheduleGrid.test.js":
    - rule_selector: "pmd:AvoidLwcBubblesComposedTrue"
      max_suppressed_violations: 6
      reason: "Test fakes real browser focusin, pointerover and keydown events, which are composed."
  "main/default/lwc/shoreshWeekEditor/__tests__/shoreshWeekEditor.test.js":
    - rule_selector: "pmd:AvoidLwcBubblesComposedTrue"
      max_suppressed_violations: 1
      reason: "Test fakes a real browser keydown, which is composed."
  "main/default/lwc/shoreshWeekEditor/__tests__/seams.test.js":
    - rule_selector: "pmd:AvoidLwcBubblesComposedTrue"
      max_suppressed_violations: 1
      reason: "Test fakes a real browser keydown, which is composed."
  # The desktop's Q3 test prints the repeat-distribution table straight to the test output on purpose
  # (owner ruling Q3: the figure must survive a captured run); a test, never shipped.
  "main/default/lwc/shoreshElectiveEngine/__tests__/ported.test.js":
    - rule_selector: "eslint:@lwc/lwc-platform/no-process-env"
      max_suppressed_violations: 1
      reason: "Test prints the repeat-distribution table to its output (desktop ruling Q3)."
  "main/default/lwc/shoreshWeekEditor/__tests__/copyPaste.test.js":
    - rule_selector: "pmd:AvoidLwcBubblesComposedTrue"
      max_suppressed_violations: 1
      reason: "Test fakes a real browser Cmd/Ctrl keydown, which is composed."
  # The API's records (repo ADR 0024): their fields are the plain-English names an outside system
  # and a Flow see (camper_name, first_choice), so they don't follow Apex's camelCase (API-1.5).
  "main/default/classes/IncomingCamper.cls":
    - rule_selector: "pmd:FieldNamingConventions"
      max_suppressed_violations: 5
      reason: "Record fields are the API's plain-English names (API-1.5)."
  "main/default/classes/IncomingCamperGroup.cls":
    - rule_selector: "pmd:FieldNamingConventions"
      max_suppressed_violations: 3
      reason: "Record fields are the API's plain-English names (API-1.5)."
  "main/default/classes/IncomingCamperElectiveChoice.cls":
    - rule_selector: "pmd:FieldNamingConventions"
      max_suppressed_violations: 9
      reason: "Record fields are the API's plain-English names (API-1.5)."
  # A Flow action's answer in a managed package must be global for a camp's Flows to use it.
  "main/default/classes/IncomingResult.cls":
    - rule_selector: "pmd:AvoidGlobalModifier"
      max_suppressed_violations: 1
      reason: "The Flow actions' answer: global so a camp's Flows can read it."
  "main/default/classes/IncomingDivision.cls":
    - rule_selector: "pmd:FieldNamingConventions"
      max_suppressed_violations: 2
      reason: "Record fields are the API's plain-English names (API-1.5)."
  "main/default/classes/IncomingGroup.cls":
    - rule_selector: "pmd:FieldNamingConventions"
      max_suppressed_violations: 2
      reason: "Record fields are the API's plain-English names (API-1.5)."
  "main/default/classes/IncomingActivity.cls":
    - rule_selector: "pmd:FieldNamingConventions"
      max_suppressed_violations: 2
      reason: "Record fields are the API's plain-English names (API-1.5)."
  # What goes out (repo ADR 0024): a Flow's send fields are plain-English names too (to_system, as_csv).
  "main/default/classes/OutgoingGroupSchedule.cls":
    - rule_selector: "pmd:FieldNamingConventions"
      max_suppressed_violations: 2
      reason: "Flow send fields are the API's plain-English names (API-1.5)."
  "main/default/classes/OutgoingActivitySchedule.cls":
    - rule_selector: "pmd:FieldNamingConventions"
      max_suppressed_violations: 2
      reason: "Flow send fields are the API's plain-English names (API-1.5)."
  "main/default/classes/OutgoingElectiveOfferings.cls":
    - rule_selector: "pmd:FieldNamingConventions"
      max_suppressed_violations: 2
      reason: "Flow send fields are the API's plain-English names (API-1.5)."
  "main/default/classes/OutgoingElectiveSeats.cls":
    - rule_selector: "pmd:FieldNamingConventions"
      max_suppressed_violations: 2
      reason: "Flow send fields are the API's plain-English names (API-1.5)."
  # A Flow action's answer in a managed package must be global for a camp's Flows to use it.
  "main/default/classes/OutgoingResult.cls":
    - rule_selector: "pmd:AvoidGlobalModifier"
      max_suppressed_violations: 1
      reason: "The send actions' answer: global so a camp's Flows can read it."
