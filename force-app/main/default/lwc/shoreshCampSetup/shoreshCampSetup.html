<template>
  <div class="app">
    <template lwc:if={isLoading}>
      <lightning-spinner
        alternative-text="Opening your camp"
      ></lightning-spinner>
    </template>

    <template lwc:if={error}>
      <div
        class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium"
        role="alert"
        data-id="error"
      >
        {error}
      </div>
    </template>

    <!-- First visit: no camp yet -->
    <template lwc:if={isNoCamp}>
      <div class="piece welcome">
        <h2 class="slds-text-heading_medium slds-m-bottom_small">
          Welcome to Shoresh
        </h2>
        <p class="slds-m-bottom_small">Start by naming your camp.</p>
        <div class="slds-grid slds-grid_vertical-align-end slds-gutters_small">
          <div class="slds-col">
            <lightning-input
              data-id="camp-name"
              label="Camp name"
              value={newCamp.Name}
              required
              onchange={handleNewCampName}
            ></lightning-input>
          </div>
          <div class="slds-col slds-grow-none">
            <lightning-button
              variant="brand"
              label="Create camp"
              onclick={handleCreateCamp}
              disabled={busy}
            ></lightning-button>
          </div>
        </div>
      </div>
    </template>

    <template lwc:if={hasCamp}>
      <!-- The workbench: the menu, then the frame (the screen). docs/design/manual-build.html;
           ADR 0015. The camp and season sit in the menu's camp row (step 3b, choice 12). -->
      <div class="layout">
        <div class="menu-col">
          <c-shoresh-menu
            sections={menu}
            current={currentScreen}
            camp-name={campName}
            season-name={seasonName}
            controls
            setup-changed={menuSetupChanged}
            setup-busy={menuSetupBusy}
            onnavigate={handleNavigate}
            onupdatetomatch={handleMenuUpdateToMatch}
          >
            <div slot="camp" class="camp-head" data-id="camp-head">
              <!-- The camp: its name, or a picker that reads as its name while there are
                   several. -->
              <div class="camp-line">
                <template lwc:if={hasSeveralCamps}>
                  <div class="head-pick shoresh-row">
                    <lightning-combobox
                      class="shoresh-cell shoresh-name camp-pick"
                      data-id="camp-picker"
                      label={labels.camp}
                      variant="label-hidden"
                      value={campId}
                      options={campOptions}
                      onchange={handleCampChange}
                    ></lightning-combobox>
                  </div>
                </template>
                <template lwc:else>
                  <span class="camp-name" title={campName} data-id="camp-name"
                    >{campName}</span
                  >
                </template>
              </div>
              <!-- The season: a picker that reads as its name, its pencil, and the small menu
                   with New season and Copy this season. -->
              <div class="camp-line">
                <template lwc:if={hasSeasons}>
                  <div class="head-pick shoresh-row">
                    <lightning-combobox
                      class="shoresh-cell season-pick"
                      data-id="season-picker"
                      label={labels.season}
                      variant="label-hidden"
                      value={seasonId}
                      options={seasonOptions}
                      onchange={handleSeasonChange}
                    ></lightning-combobox>
                  </div>
                  <template lwc:if={setup}>
                    <button
                      type="button"
                      class="shoresh-item shoresh-item_icon shoresh-item_tool season-edit"
                      data-id="edit-season"
                      aria-label={labels.editSeason}
                      title={labels.editSeason}
                      aria-expanded={seasonOpenText}
                      onclick={handleToggleSeason}
                    >
                      <svg
                        class="shoresh-glyph"
                        viewBox="0 0 16 16"
                        aria-hidden="true"
                      >
                        <path
                          d="M10.5 3.5l2 2L6 12l-2.5.5L4 10z M9 5l2 2"
                        ></path>
                      </svg>
                    </button>
                  </template>
                </template>
                <template lwc:else>
                  <span class="head-pick"></span>
                </template>
                <c-shoresh-rail-pop
                  class="season-menu"
                  data-id="season-menu"
                  label=""
                  alternative-text={labels.seasonActions}
                  menu
                  align="right"
                  onselect={handleSeasonMenu}
                >
                  <button
                    type="button"
                    role="menuitem"
                    class="shoresh-pop-row"
                    data-value="new"
                    data-id="new-season"
                    disabled={busy}
                  >
                    {labels.newSeason}
                  </button>
                  <template lwc:if={setup}>
                    <button
                      type="button"
                      role="menuitem"
                      class="shoresh-pop-row"
                      data-value="copy"
                      data-id="copy-season"
                      disabled={busy}
                    >
                      {labels.copySeason}
                    </button>
                  </template>
                </c-shoresh-rail-pop>
              </div>
              <template lwc:if={showSeasonForm}>
                <section
                  class="season-form"
                  data-id="season-form"
                  aria-label={labels.seasonDetails}
                >
                  <div class="season-field">
                    <lightning-input
                      data-form="season"
                      data-field="name"
                      label={labels.seasonName}
                      value={seasonForm.Name}
                      required
                      onchange={handleSeasonField}
                      onfocusout={handleSeasonLeave}
                      onkeydown={handleSeasonKey}
                    ></lightning-input>
                    <template lwc:if={seasonNameError}>
                      <div
                        class="slds-form-element__help slds-text-color_error"
                        role="alert"
                        data-error="season-name"
                      >
                        {seasonNameError}
                      </div>
                    </template>
                  </div>
                  <div class="season-field">
                    <lightning-input
                      data-form="season"
                      data-field="start"
                      class="shoresh-date"
                      type="date"
                      label="First day"
                      value={seasonStart}
                      required
                      onchange={handleSeasonField}
                      onfocusout={handleSeasonLeave}
                      onkeydown={handleSeasonKey}
                    ></lightning-input>
                    <template lwc:if={seasonStartError}>
                      <div
                        class="slds-form-element__help slds-text-color_error"
                        role="alert"
                        data-error="season-start"
                      >
                        {seasonStartError}
                      </div>
                    </template>
                  </div>
                  <div class="season-field">
                    <lightning-input
                      data-form="season"
                      data-field="end"
                      class="shoresh-date"
                      type="date"
                      label="Last day"
                      value={seasonEnd}
                      required
                      onchange={handleSeasonField}
                      onfocusout={handleSeasonLeave}
                      onkeydown={handleSeasonKey}
                    ></lightning-input>
                    <template lwc:if={seasonEndError}>
                      <div
                        class="slds-form-element__help slds-text-color_error"
                        role="alert"
                        data-error="season-end"
                      >
                        {seasonEndError}
                      </div>
                    </template>
                  </div>
                  <template lwc:if={copiedFromName}>
                    <p class="season-note" data-id="copied-from">
                      {labels.copiedFrom}
                    </p>
                  </template>
                  <div class="season-end">
                    <lightning-button
                      variant="destructive-text"
                      label={labels.deleteSeason}
                      onclick={handleDeleteSeason}
                      disabled={busy}
                    ></lightning-button>
                    <c-shoresh-saved-mark
                      data-id="season-saved"
                    ></c-shoresh-saved-mark>
                  </div>
                </section>
              </template>
            </div>
          </c-shoresh-menu>
        </div>
        <div class="piece frame">
          <div class={bodyClass}>
            <!-- New season -->
            <template lwc:if={isNewSeason}>
              <h2
                class="slds-text-heading_medium slds-m-bottom_small"
                tabindex="-1"
                data-id="new-season-title"
              >
                {labels.newSeasonTitle}
              </h2>
              <div class="slds-grid slds-wrap slds-gutters_small">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                  <lightning-input
                    data-form="new-season"
                    data-field="name"
                    label={labels.seasonName}
                    value={newSeason.Name}
                    required
                    onchange={handleNewSeasonField}
                  ></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-3">
                  <lightning-input
                    data-form="new-season"
                    data-field="start"
                    class="shoresh-date"
                    type="date"
                    label="First day"
                    value={newSeasonStart}
                    required
                    onchange={handleNewSeasonField}
                  ></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-3">
                  <lightning-input
                    data-form="new-season"
                    data-field="end"
                    class="shoresh-date"
                    type="date"
                    label="Last day"
                    value={newSeasonEnd}
                    required
                    onchange={handleNewSeasonField}
                  ></lightning-input>
                </div>
              </div>
              <div class="slds-m-top_small">
                <template lwc:if={hasSeasons}>
                  <lightning-button
                    label="Cancel"
                    onclick={handleCancelNewSeason}
                  ></lightning-button>
                </template>
                <lightning-button
                  class="slds-m-left_x-small"
                  data-id="create-season"
                  variant="brand"
                  label={labels.createSeason}
                  onclick={handleCreateSeason}
                  disabled={busy}
                ></lightning-button>
              </div>
            </template>

            <!-- Copy -->
            <template lwc:if={isCopy}>
              <c-shoresh-copy-season
                season={setup.season}
                terms={terms}
                oncopied={handleCopied}
                oncancel={handleCancelCopy}
              ></c-shoresh-copy-season>
            </template>

            <template lwc:if={hasScreenProblems}>
              <div
                class="problems slds-box slds-theme_warning slds-m-bottom_large"
                data-id="problems"
              >
                <h3 class="slds-text-heading_small slds-m-bottom_x-small">
                  {labels.problems}
                </h3>
                <ul class="slds-list_dotted">
                  <template for:each={screenProblems} for:item="problem">
                    <li key={problem.key}>
                      <strong>{problem.name}</strong>: {problem.why}
                      <template for:each={problem.actions} for:item="action">
                        <lightning-button
                          key={action.key}
                          class="slds-m-left_x-small"
                          variant="base"
                          label={action.label}
                          data-problem={problem.key}
                          data-action={action.key}
                          data-id="problem-action"
                          onclick={handleProblemAction}
                          disabled={busy}
                        ></lightning-button>
                      </template>
                    </li>
                  </template>
                </ul>
              </div>
            </template>

            <!-- Camp words -->
            <div class={shown.campWords} data-screen="campWords">
              <template for:each={campKeys} for:item="key">
                <c-shoresh-camp-labels
                  key={key}
                  camp-id={campId}
                  camp-name={campName}
                  onsaved={handleLabelsSaved}
                  onfailed={handleLabelsFailed}
                ></c-shoresh-camp-labels>
              </template>
              <template lwc:if={next.campWords}>
                <div class="setup-list">
                  <div class="next">
                    <lightning-button
                      variant="brand"
                      label={next.campWords.label}
                      data-id="next"
                      data-next={next.campWords.key}
                      onclick={handleNext}
                    ></lightning-button>
                  </div>
                </div>
              </template>
            </div>

            <template lwc:if={setup}>
              <!-- Roots -->
              <div class={shown.roots} data-screen="roots">
                <c-shoresh-roots
                  setup={setup}
                  terms={terms}
                  problems={problems}
                  onnavigate={handleNavigate}
                  onundoimport={handleUndoImport}
                  onimported={handleImported}
                ></c-shoresh-roots>
              </div>

              <!-- Weeks -->
              <div class={shown.weeks} data-screen="weeks">
                <!-- The rail (steps 2a/2b's grammar): how many, then Saved and the list's
                     own actions; the screen's name is read out (the menu shows it). -->
                <div class="setup-rail" data-id="setup-rail">
                  <h2 class="slds-assistive-text" tabindex="-1" data-heading>
                    {labels.screens.weeks}
                  </h2>
                  <span class="rail-count" data-id="count"
                    ><b class="shoresh-num">{counts.weeks.count}</b
                    >{counts.weeks.noun}</span
                  >
                  <span class="rail-spacer"></span>
                  <c-shoresh-saved-mark
                    class="rail-saved"
                    data-id="rail-saved"
                    silent
                  ></c-shoresh-saved-mark>
                </div>
                <div class="shoresh-hairline" role="presentation"></div>
                <div class="setup-list list_narrow">
                  <template lwc:if={hasNoWeeks}>
                    <lightning-button
                      class="fill-weeks"
                      data-id="fill-weeks"
                      label={labels.fillWeeks}
                      icon-name="utility:date_input"
                      onclick={handleFillWeeks}
                      disabled={busy}
                    ></lightning-button>
                  </template>
                  <c-shoresh-editable-table
                    data-id="weeks"
                    title={labels.screens.weeks}
                    show-columns
                    object-api-name={objects.Week}
                    columns={weekColumns}
                    rows={setup.weeks}
                    add-label={labels.addWeek}
                    empty-message={labels.noWeeks}
                    new-row-defaults={weekDefaults}
                    overlap-label={labels.overlapsWeek}
                    busy={busy}
                    onsave={handleSaveRecords}
                    ondelete={handleDeleteRecord}
                  ></c-shoresh-editable-table>
                  <template lwc:if={next.weeks}>
                    <div class="next">
                      <lightning-button
                        variant="brand"
                        label={next.weeks.label}
                        data-id="next"
                        data-next={next.weeks.key}
                        onclick={handleNext}
                      ></lightning-button>
                    </div>
                  </template>
                </div>
              </div>

              <!-- Programs: the shared setup table (programs.png, wiki decision 56) -->
              <div class={shown.programs} data-screen="programs">
                <div class="setup-rail" data-id="setup-rail">
                  <h2 class="slds-assistive-text" tabindex="-1" data-heading>
                    {labels.screens.programs}
                  </h2>
                  <span class="rail-count" data-id="count"
                    ><b class="shoresh-num">{counts.programs.count}</b
                    >{counts.programs.noun}</span
                  >
                  <span class="rail-spacer"></span>
                  <c-shoresh-saved-mark
                    class="rail-saved"
                    data-id="rail-saved"
                    silent
                  ></c-shoresh-saved-mark>
                  <span class="shoresh-rail-line" role="presentation"></span>
                  <c-shoresh-list-import
                    class="rail-import"
                    data-id="programs-list-import"
                    variant="rail"
                    screen-key="programs"
                    setup={setup}
                    terms={terms}
                    onimported={handleImported}
                    onlistopen={handleListOpen}
                  ></c-shoresh-list-import>
                </div>
                <div class="shoresh-hairline" role="presentation"></div>
                <div class="setup-list list_narrow">
                  <c-shoresh-editable-table
                    data-id="programs"
                    title={labels.screens.programs}
                    show-columns
                    object-api-name={objects.Program}
                    flag-same-names
                    columns={programColumns}
                    rows={programRecords}
                    add-label={labels.addProgram}
                    empty-message={labels.noPrograms}
                    new-row-defaults={programDefaults}
                    busy={busy}
                    onsave={handleSaveRecords}
                    ondelete={handleDeleteRecord}
                  ></c-shoresh-editable-table>
                  <template lwc:if={next.programs}>
                    <div class="next">
                      <lightning-button
                        variant="brand"
                        label={next.programs.label}
                        data-id="next"
                        data-next={next.programs.key}
                        onclick={handleNext}
                      ></lightning-button>
                    </div>
                  </template>
                </div>
              </div>

              <!-- Divisions -->
              <div class={shown.divisions} data-screen="divisions">
                <!-- The rail (steps 2a/2b's grammar): how many, then Saved and the list's
                     own actions; the screen's name is read out (the menu shows it). -->
                <div class="setup-rail" data-id="setup-rail">
                  <h2 class="slds-assistive-text" tabindex="-1" data-heading>
                    {labels.screens.divisions}
                  </h2>
                  <span class="rail-count" data-id="count"
                    ><b class="shoresh-num">{counts.divisions.count}</b
                    >{counts.divisions.noun}</span
                  >
                  <span class="rail-spacer"></span>
                  <c-shoresh-saved-mark
                    class="rail-saved"
                    data-id="rail-saved"
                    silent
                  ></c-shoresh-saved-mark>
                  <span class="shoresh-rail-line" role="presentation"></span>
                  <c-shoresh-list-import
                    class="rail-import"
                    data-id="divisions-list-import"
                    variant="rail"
                    screen-key="divisions"
                    setup={setup}
                    terms={terms}
                    onimported={handleImported}
                    onlistopen={handleListOpen}
                  ></c-shoresh-list-import>
                </div>
                <div class="shoresh-hairline" role="presentation"></div>
                <div class="setup-list list_narrow">
                  <template for:each={programs} for:item="item">
                    <c-shoresh-program
                      key={item.key}
                      before-week-off={beforeWeekOff}
                      show="divisions"
                      sectioned={hasSeveralPrograms}
                      entry={item.entry}
                      terms={terms}
                      busy={busy}
                      onsave={handleSaveRecords}
                      ondelete={handleDeleteRecord}
                      onnavigate={handleNavigate}
                    ></c-shoresh-program>
                  </template>
                  <template lwc:if={hasNoPrograms}>
                    <c-shoresh-empty-state
                      title={labels.noPrograms}
                    ></c-shoresh-empty-state>
                  </template>
                  <template lwc:if={next.divisions}>
                    <div class="next">
                      <lightning-button
                        variant="brand"
                        label={next.divisions.label}
                        data-id="next"
                        data-next={next.divisions.key}
                        onclick={handleNext}
                      ></lightning-button>
                    </div>
                  </template>
                </div>
              </div>

              <!-- Groups, with the weeks each runs in -->
              <div class={shown.groups} data-screen="groups">
                <!-- The rail (steps 2a/2b's grammar): how many, then Saved and the list's
                     own actions; the screen's name is read out (the menu shows it). -->
                <div class="setup-rail" data-id="setup-rail">
                  <h2 class="slds-assistive-text" tabindex="-1" data-heading>
                    {labels.screens.groups}
                  </h2>
                  <span class="rail-count" data-id="count"
                    ><b class="shoresh-num">{counts.groups.count}</b
                    >{counts.groups.noun}</span
                  >
                  <span class="rail-spacer"></span>
                  <c-shoresh-saved-mark
                    class="rail-saved"
                    data-id="rail-saved"
                    silent
                  ></c-shoresh-saved-mark>
                  <span class="shoresh-rail-line" role="presentation"></span>
                  <c-shoresh-list-import
                    class="rail-import"
                    data-id="groups-list-import"
                    variant="rail"
                    screen-key="groups"
                    setup={setup}
                    terms={terms}
                    onimported={handleImported}
                    onlistopen={handleListOpen}
                  ></c-shoresh-list-import>
                </div>
                <div class="shoresh-hairline" role="presentation"></div>
                <div class="setup-list list_narrow">
                  <template for:each={programs} for:item="item">
                    <c-shoresh-program
                      key={item.key}
                      before-week-off={beforeWeekOff}
                      show="groups"
                      sectioned={hasSeveralPrograms}
                      entry={item.entry}
                      terms={terms}
                      activities={setup.activities}
                      weeks={setup.weeks}
                      week-exceptions={setup.weekExceptions}
                      week-words={weekWords}
                      busy={busy}
                      guesses={guessesByRecord}
                      onsave={handleSaveRecords}
                      ondelete={handleDeleteRecord}
                      onnavigate={handleNavigate}
                      onconfirmguess={handleConfirmGuess}
                    ></c-shoresh-program>
                  </template>
                  <template lwc:if={hasNoPrograms}>
                    <c-shoresh-empty-state
                      title={labels.noPrograms}
                    ></c-shoresh-empty-state>
                  </template>
                  <template lwc:if={next.groups}>
                    <div class="next">
                      <lightning-button
                        variant="brand"
                        label={next.groups.label}
                        data-id="next"
                        data-next={next.groups.key}
                        onclick={handleNext}
                      ></lightning-button>
                    </div>
                  </template>
                </div>
              </div>

              <!-- Time blocks -->
              <div class={shown.timeBlocks} data-screen="timeBlocks">
                <!-- The rail (steps 2a/2b's grammar): how many, then Saved and the list's
                     own actions; the screen's name is read out (the menu shows it). -->
                <div class="setup-rail" data-id="setup-rail">
                  <h2 class="slds-assistive-text" tabindex="-1" data-heading>
                    {labels.screens.timeBlocks}
                  </h2>
                  <span class="rail-count" data-id="count"
                    ><b class="shoresh-num">{counts.timeBlocks.count}</b
                    >{counts.timeBlocks.noun}</span
                  >
                  <span class="rail-spacer"></span>
                  <c-shoresh-saved-mark
                    class="rail-saved"
                    data-id="rail-saved"
                    silent
                  ></c-shoresh-saved-mark>
                  <span class="shoresh-rail-line" role="presentation"></span>
                  <c-shoresh-list-import
                    class="rail-import"
                    data-id="timeBlocks-list-import"
                    variant="rail"
                    screen-key="timeBlocks"
                    setup={setup}
                    terms={terms}
                    onimported={handleImported}
                    onlistopen={handleListOpen}
                  ></c-shoresh-list-import>
                </div>
                <div class="shoresh-hairline" role="presentation"></div>
                <div class="setup-list list_narrow">
                  <template for:each={programs} for:item="item">
                    <c-shoresh-program
                      key={item.key}
                      before-week-off={beforeWeekOff}
                      show="timeBlocks"
                      sectioned={hasSeveralPrograms}
                      entry={item.entry}
                      terms={terms}
                      busy={busy}
                      onsave={handleSaveRecords}
                      ondelete={handleDeleteRecord}
                      onnavigate={handleNavigate}
                    ></c-shoresh-program>
                  </template>
                  <template lwc:if={hasNoPrograms}>
                    <c-shoresh-empty-state
                      title={labels.noPrograms}
                    ></c-shoresh-empty-state>
                  </template>
                  <template lwc:if={next.timeBlocks}>
                    <div class="next">
                      <lightning-button
                        variant="brand"
                        label={next.timeBlocks.label}
                        data-id="next"
                        data-next={next.timeBlocks.key}
                        onclick={handleNext}
                      ></lightning-button>
                    </div>
                  </template>
                </div>
              </div>

              <!-- Locations, with the weeks each is open in: one section per type -->
              <div class={shown.locations} data-screen="locations">
                <div class="setup-rail" data-id="setup-rail">
                  <h2 class="slds-assistive-text" tabindex="-1" data-heading>
                    {labels.screens.locations}
                  </h2>
                  <span class="rail-count" data-id="count"
                    ><b class="shoresh-num">{counts.locations.count}</b
                    >{counts.locations.noun}</span
                  >
                  <!-- Which types show: all, or one (the old "Show" list, as rail items). -->
                  <template lwc:if={hasLocationTypes}>
                    <div
                      class="rail-centre"
                      role="group"
                      aria-label={labels.showTypes}
                      data-id="location-filter"
                    >
                      <template for:each={locationFilterItems} for:item="item">
                        <button
                          key={item.value}
                          type="button"
                          class={item.className}
                          aria-pressed={item.pressed}
                          data-value={item.value}
                          onclick={handleLocationFilter}
                        >
                          {item.label}
                        </button>
                      </template>
                    </div>
                  </template>
                  <span class="rail-spacer"></span>
                  <c-shoresh-saved-mark
                    class="rail-saved"
                    data-id="rail-saved"
                    silent
                  ></c-shoresh-saved-mark>
                  <span class="shoresh-rail-line" role="presentation"></span>
                  <c-shoresh-list-import
                    class="rail-import"
                    data-id="locations-list-import"
                    variant="rail"
                    screen-key="locations"
                    setup={setup}
                    terms={terms}
                    onimported={handleImported}
                    onlistopen={handleListOpen}
                  ></c-shoresh-list-import>
                </div>
                <div class="shoresh-hairline" role="presentation"></div>
                <div class="setup-list">
                  <template for:each={locationSections} for:item="section">
                    <c-shoresh-editable-table
                      key={section.key}
                      data-id="locations"
                      data-type={section.value}
                      heading={section.heading}
                      show-columns={section.first}
                      filter-field={locationTypeField}
                      filter-value={section.value}
                      title={section.title}
                      object-api-name={objects.Location}
                      flag-same-names
                      columns={locationColumns}
                      rows={setup.locations}
                      add-label={labels.addLocation}
                      empty-message={labels.noLocations}
                      new-row-defaults={locationDefaults}
                      weeks={setup.weeks}
                      week-exceptions={setup.weekExceptions}
                      weeks-heading={labels.weeksColumn}
                      week-words={locationWeekWords}
                      before-week-off={beforeWeekOff}
                      week-phrase="is open in"
                      merge-label={labels.sameLocation}
                      busy={busy}
                      guesses={guessesByRecord}
                      onconfirmguess={handleConfirmGuess}
                      onsave={handleSaveRecords}
                      ondelete={handleDeleteRecord}
                      onmerge={handleSameLocation}
                    ></c-shoresh-editable-table>
                  </template>
                  <template lwc:if={sameLocation}>
                    <c-shoresh-same-location
                      places={sameLocation}
                      terms={terms}
                      title={labels.sameLocation}
                      busy={merging}
                      error={sameLocationError}
                      onmerge={handleMergeLocations}
                      onclose={handleCloseSameLocation}
                    ></c-shoresh-same-location>
                  </template>
                  <!-- The camp's own types, the sections above: named, added and deleted here. -->
                  <c-shoresh-editable-table
                    class="types"
                    data-id="location-types"
                    heading={labels.locationTypes}
                    title={labels.locationTypes}
                    object-api-name={objects.LocationType}
                    flag-same-names
                    columns={locationTypeColumns}
                    rows={setup.locationTypes}
                    add-label={labels.addLocationType}
                    empty-message={labels.noLocationTypes}
                    new-row-defaults={locationTypeDefaults}
                    busy={busy}
                    onsave={handleSaveRecords}
                    ondelete={handleDeleteRecord}
                  ></c-shoresh-editable-table>
                  <template lwc:if={next.locations}>
                    <div class="next">
                      <lightning-button
                        variant="brand"
                        label={next.locations.label}
                        data-id="next"
                        data-next={next.locations.key}
                        onclick={handleNext}
                      ></lightning-button>
                    </div>
                  </template>
                </div>
              </div>

              <!-- Activities (docs/design/setup/activities.html): the list, and one activity's
                   details in a zone beside it, opened from its row's chevron. -->
              <div class={shown.activities} data-screen="activities">
                <div class="setup-rail" data-id="setup-rail">
                  <h2 class="slds-assistive-text" tabindex="-1" data-heading>
                    {labels.screens.activities}
                  </h2>
                  <span class="rail-count" data-id="count"
                    ><b class="shoresh-num">{counts.activities.count}</b
                    >{counts.activities.noun}</span
                  >
                  <span class="rail-spacer"></span>
                  <c-shoresh-saved-mark
                    class="rail-saved"
                    data-id="rail-saved"
                    silent
                  ></c-shoresh-saved-mark>
                  <span class="shoresh-rail-line" role="presentation"></span>
                  <c-shoresh-list-import
                    class="rail-import"
                    data-id="activities-list-import"
                    variant="rail"
                    screen-key="activities"
                    setup={setup}
                    terms={terms}
                    onimported={handleImported}
                    onlistopen={handleListOpen}
                  ></c-shoresh-list-import>
                </div>
                <div class="shoresh-hairline" role="presentation"></div>
                <div class="setup-split">
                  <div class="setup-list setup-main">
                    <!-- One section per priority, High then Low (activitySections). -->
                    <template for:each={activitySections} for:item="section">
                      <c-shoresh-editable-table
                        key={section.key}
                        data-id="activities"
                        data-priority={section.value}
                        heading={section.heading}
                        show-columns={section.first}
                        row-filter={section.rowFilter}
                        title={section.title}
                        object-api-name={objects.Activity}
                        flag-same-names
                        columns={activityColumns}
                        rows={setup.activities}
                        add-label={labels.addActivity}
                        empty-message={labels.noActivities}
                        new-row-defaults={section.defaults}
                        weeks={setup.weeks}
                        week-exceptions={setup.weekExceptions}
                        weeks-heading={labels.weeksColumn}
                        week-words={weekWords}
                        before-week-off={beforeWeekOff}
                        week-phrase="runs in"
                        weeks-max="12"
                        busy={busy}
                        details-label="Details"
                        details-open-for={activityDetailsFor}
                        guesses={guessesByRecord}
                        onconfirmguess={handleConfirmGuess}
                        onsave={handleSaveRecords}
                        ondelete={handleDeleteRecord}
                        ondetails={handleOpenActivityDetails}
                      ></c-shoresh-editable-table>
                    </template>
                    <template lwc:if={next.activities}>
                      <div class="next">
                        <lightning-button
                          variant="brand"
                          label={next.activities.label}
                          data-id="next"
                          data-next={next.activities.key}
                          onclick={handleNext}
                        ></lightning-button>
                      </div>
                    </template>
                  </div>
                  <c-shoresh-activity-details
                    class="setup-side"
                    setup={setup}
                    terms={terms}
                    busy={busy}
                    onsave={handleSaveActivityDetails}
                    onclose={handleCloseActivityDetails}
                  ></c-shoresh-activity-details>
                </div>
              </div>

              <!-- Fixed activities (docs/design/setup/fixed.html): the whole camp's, per program -->
              <div class={shown.fixedActivities} data-screen="fixedActivities">
                <div class="setup-rail" data-id="setup-rail">
                  <h2 class="slds-assistive-text" tabindex="-1" data-heading>
                    {labels.screens.fixedActivities}
                  </h2>
                  <span class="rail-count" data-id="count"
                    ><b class="shoresh-num">{counts.fixedActivities.count}</b
                    >{counts.fixedActivities.noun}</span
                  >
                  <span class="rail-spacer"></span>
                  <c-shoresh-saved-mark
                    class="rail-saved"
                    data-id="rail-saved"
                    silent
                  ></c-shoresh-saved-mark>
                  <span class="shoresh-rail-line" role="presentation"></span>
                  <c-shoresh-list-import
                    class="rail-import"
                    data-id="fixedActivities-list-import"
                    variant="rail"
                    screen-key="fixedActivities"
                    setup={setup}
                    terms={terms}
                    onimported={handleImported}
                    onlistopen={handleListOpen}
                  ></c-shoresh-list-import>
                </div>
                <div class="shoresh-hairline" role="presentation"></div>
                <div class="setup-list">
                  <template for:each={programs} for:item="item">
                    <c-shoresh-program
                      key={item.key}
                      before-week-off={beforeWeekOff}
                      data-id="fixed-activities"
                      show="fixedActivities"
                      sectioned={hasSeveralPrograms}
                      entry={item.entry}
                      terms={terms}
                      locations={setup.locations}
                      weeks={setup.weeks}
                      week-exceptions={setup.weekExceptions}
                      week-words={weekWords}
                      busy={busy}
                      onsave={handleSaveRecords}
                      ondelete={handleDeleteRecord}
                      onnavigate={handleNavigate}
                    ></c-shoresh-program>
                  </template>
                  <template lwc:if={hasNoPrograms}>
                    <c-shoresh-empty-state
                      title={labels.noPrograms}
                    ></c-shoresh-empty-state>
                  </template>
                  <template lwc:if={next.fixedActivities}>
                    <div class="next">
                      <lightning-button
                        variant="brand"
                        label={next.fixedActivities.label}
                        data-id="next"
                        data-next={next.fixedActivities.key}
                        onclick={handleNext}
                      ></lightning-button>
                    </div>
                  </template>
                </div>
              </div>

              <!-- Recurring activities (docs/design/setup/fixed.html): a section per division -->
              <div
                class={shown.recurringActivities}
                data-screen="recurringActivities"
              >
                <div class="setup-rail" data-id="setup-rail">
                  <h2 class="slds-assistive-text" tabindex="-1" data-heading>
                    {labels.screens.recurringActivities}
                  </h2>
                  <span class="rail-count" data-id="count"
                    ><b class="shoresh-num"
                      >{counts.recurringActivities.count}</b
                    >{counts.recurringActivities.noun}</span
                  >
                  <span class="rail-spacer"></span>
                  <c-shoresh-saved-mark
                    class="rail-saved"
                    data-id="rail-saved"
                    silent
                  ></c-shoresh-saved-mark>
                  <span class="shoresh-rail-line" role="presentation"></span>
                  <c-shoresh-list-import
                    class="rail-import"
                    data-id="recurringActivities-list-import"
                    variant="rail"
                    screen-key="recurringActivities"
                    setup={setup}
                    terms={terms}
                    onimported={handleImported}
                    onlistopen={handleListOpen}
                  ></c-shoresh-list-import>
                </div>
                <div class="shoresh-hairline" role="presentation"></div>
                <div class="setup-list">
                  <template for:each={programs} for:item="item">
                    <c-shoresh-program
                      key={item.key}
                      before-week-off={beforeWeekOff}
                      data-id="recurring-activities"
                      show="recurringActivities"
                      sectioned={hasSeveralPrograms}
                      entry={item.entry}
                      terms={terms}
                      locations={setup.locations}
                      weeks={setup.weeks}
                      week-exceptions={setup.weekExceptions}
                      week-words={weekWords}
                      busy={busy}
                      onsave={handleSaveRecords}
                      ondelete={handleDeleteRecord}
                      onnavigate={handleNavigate}
                    ></c-shoresh-program>
                  </template>
                  <template lwc:if={hasNoPrograms}>
                    <c-shoresh-empty-state
                      title={labels.noPrograms}
                    ></c-shoresh-empty-state>
                  </template>
                  <template lwc:if={next.recurringActivities}>
                    <div class="next">
                      <lightning-button
                        variant="brand"
                        label={next.recurringActivities.label}
                        data-id="next"
                        data-next={next.recurringActivities.key}
                        onclick={handleNext}
                      ></lightning-button>
                    </div>
                  </template>
                </div>
              </div>

              <!-- Special events (design-research special-r1 special-events.html, decision 47; desktop
                   SpecialEventsScreen.jsx): special days and events in one list, two sections,
                   and one item's details beside it, opened from its row's chevron. -->
              <div class={shown.specialEvents} data-screen="specialEvents">
                <!-- The schedule inside one item (ADR 0014 choice 14), in the list's place; the list
                     stays as it was underneath, so going back finds it. -->
                <template lwc:if={specialScheduleFor}>
                  <c-shoresh-special-schedule
                    item-id={specialScheduleFor}
                    terms={terms}
                    setup={setup}
                    onclose={handleCloseSpecialSchedule}
                    onchanged={handleSpecialScheduleChanged}
                    data-id="special-schedule"
                  ></c-shoresh-special-schedule>
                </template>
                <div class={specialListClass} data-id="special-list">
                  <div class="setup-rail" data-id="setup-rail">
                    <h2 class="slds-assistive-text" tabindex="-1" data-heading>
                      {labels.screens.specialEvents}
                    </h2>
                    <span class="rail-count" data-id="count"
                      ><b class="shoresh-num">{specialCounts.days}</b
                      >{specialCounts.daysNoun}</span
                    >
                    <span class="rail-count" data-id="count-events"
                      ><b class="shoresh-num">{specialCounts.events}</b
                      >{specialCounts.eventsNoun}</span
                    >
                    <span class="rail-spacer"></span>
                    <c-shoresh-saved-mark
                      class="rail-saved"
                      data-id="rail-saved"
                      silent
                    ></c-shoresh-saved-mark>
                  </div>
                  <div class="shoresh-hairline" role="presentation"></div>
                  <div class="setup-split">
                    <div class="setup-list setup-main">
                      <c-shoresh-editable-table
                        data-id="special-days"
                        heading={labels.specialDays}
                        show-columns
                        title={labels.specialDays}
                        object-api-name={objects.SpecialDay}
                        flag-same-names
                        columns={specialDayColumns}
                        rows={special.specialDays}
                        add-label={labels.addSpecialDay}
                        empty-message={labels.noSpecialDays}
                        new-row-defaults={specialDayDefaults}
                        busy={busy}
                        details-label="Details"
                        details-open-for={specialDetailsFor}
                        onsave={handleSaveRecords}
                        ondelete={handleDeleteRecord}
                        ondetails={handleOpenSpecialDetails}
                      ></c-shoresh-editable-table>
                      <!-- What a special day just added started from (desktop's note after its
                           time blocks are copied); always on the page, so it is read out. -->
                      <p
                        class="seeded-note"
                        role="status"
                        data-id="seeded-note"
                      >
                        {seededNote}
                      </p>
                      <c-shoresh-editable-table
                        data-id="special-events"
                        heading={labels.specialEvents}
                        title={labels.specialEvents}
                        object-api-name={objects.SpecialEvent}
                        flag-same-names
                        columns={specialEventColumns}
                        rows={special.specialEvents}
                        add-label={labels.addSpecialEvent}
                        empty-message={labels.noSpecialEvents}
                        new-row-defaults={specialEventDefaults}
                        busy={busy}
                        details-label="Details"
                        details-open-for={specialDetailsFor}
                        onsave={handleSaveRecords}
                        ondelete={handleDeleteRecord}
                        ondetails={handleOpenSpecialDetails}
                      ></c-shoresh-editable-table>
                    </div>
                    <c-shoresh-special-details
                      class="setup-side"
                      setup={setup}
                      terms={terms}
                      week-words={weekWords}
                      onclose={handleCloseSpecialDetails}
                      onopenschedule={handleOpenSpecialSchedule}
                      onplaced={handleSeasonChanged}
                    ></c-shoresh-special-details>
                  </div>
                </div>
              </div>

              <!-- Electives (design-research electives-r1 setup-a, decision 53; desktop
                   ElectivesScreen.jsx and ElectiveSetDetail.jsx; repo ADR 0018 slice E4): a
                   section per elective set with a row per offering, the sets themselves named,
                   added and deleted below them, and one offering's linked choices beside the
                   list, opened from its row's chevron. The menu lists it as coming until slice
                   E11; the page's address opens it (?c__preview=electives). -->
              <div class={shown.electives} data-screen="electives">
                <div class="setup-rail" data-id="setup-rail">
                  <h2 class="slds-assistive-text" tabindex="-1" data-heading>
                    {labels.screens.electives}
                  </h2>
                  <span class="rail-count" data-id="count"
                    ><b class="shoresh-num">{electiveCount.count}</b
                    >{electiveCount.noun}</span
                  >
                  <span class="rail-spacer"></span>
                  <c-shoresh-saved-mark
                    class="rail-saved"
                    data-id="rail-saved"
                    silent
                  ></c-shoresh-saved-mark>
                  <span class="shoresh-rail-line" role="presentation"></span>
                  <c-shoresh-list-import
                    class="rail-import"
                    data-id="electives-list-import"
                    variant="rail"
                    screen-key="electives"
                    setup={setup}
                    terms={terms}
                    onimported={handleImported}
                    onlistopen={handleListOpen}
                    onbringinchoices={handleBringInChoices}
                  ></c-shoresh-list-import>
                </div>
                <div class="shoresh-hairline" role="presentation"></div>
                <div class="setup-split">
                  <div class="setup-list setup-main">
                    <template for:each={electiveSections} for:item="section">
                      <c-shoresh-editable-table
                        key={section.key}
                        data-id="offerings"
                        data-set={section.setId}
                        heading={section.heading}
                        heading-count={section.count}
                        show-columns={section.first}
                        filter-field={offeringSetField}
                        filter-value={section.setId}
                        title={section.title}
                        object-api-name={objects.Offering}
                        columns={section.columns}
                        rows={electives.offerings}
                        add-label={section.addLabel}
                        empty-message={labels.noOfferings}
                        new-row-defaults={section.defaults}
                        name-for={offeringName}
                        row-classes={offeringRowClasses}
                        end-actions={offeringActions}
                        guesses={offeringMarks}
                        busy={busy}
                        details-label="Details"
                        details-open-for={electiveDetailsFor}
                        onsave={handleSaveRecords}
                        ondelete={handleDeleteRecord}
                        ondetails={handleOpenElectiveDetails}
                      ></c-shoresh-editable-table>
                    </template>
                    <!-- The sets, the sections above: named, added and deleted here. -->
                    <c-shoresh-editable-table
                      class="types"
                      data-id="elective-sets"
                      heading={labels.electiveSets}
                      title={labels.electiveSets}
                      object-api-name={objects.ElectiveSet}
                      flag-same-names
                      columns={electiveSetColumns}
                      rows={electives.sets}
                      add-label={labels.addElectiveSet}
                      empty-message={labels.noElectiveSets}
                      new-row-defaults={electiveSetDefaults}
                      busy={busy}
                      onsave={handleSaveRecords}
                      ondelete={handleDeleteRecord}
                    ></c-shoresh-editable-table>
                  </div>
                  <c-shoresh-elective-details
                    class="setup-side"
                    setup={setup}
                    terms={terms}
                    onclose={handleCloseElectiveDetails}
                    onsave={handleSaveLinkedChoice}
                    ondelete={handleDeleteRecord}
                  ></c-shoresh-elective-details>
                </div>
              </div>

              <!-- Generated Schedule: a program's week built by Shoresh -->
              <div
                class={shown.generatedSchedule}
                data-screen="generatedSchedule"
              >
                <!-- The menu shows which screen this is: its name is read out, not shown
                     (decision 36: no title on the rail). -->
                <h2 class="slds-assistive-text" tabindex="-1" data-heading>
                  {labels.screens.generatedSchedule}
                </h2>
                <c-shoresh-generated-schedule
                  setup={setup}
                  terms={terms}
                  onnavigate={handleNavigate}
                  onseasonchanged={handleSeasonChanged}
                  onsetupstate={handleSetupState}
                  onsetupfocus={handleSetupFocus}
                  data-setup-state="generatedSchedule"
                ></c-shoresh-generated-schedule>
              </div>

              <!-- Manual Build: a program's week built by hand -->
              <div class={shown.manualBuild} data-screen="manualBuild">
                <!-- The menu shows which screen this is: its name is read out, not shown
                     (decision 36: no title on the rail). -->
                <h2 class="slds-assistive-text" tabindex="-1" data-heading>
                  {labels.screens.manualBuild}
                </h2>
                <c-shoresh-manual-build
                  setup={setup}
                  terms={terms}
                  onnavigate={handleNavigate}
                  onseasonchanged={handleSeasonChanged}
                  onsetupstate={handleSetupState}
                  onsetupfocus={handleSetupFocus}
                  data-setup-state="manualBuild"
                ></c-shoresh-manual-build>
              </div>

              <!-- Elective seats (electives slice E7): coming in the menu until electives are
                   finished (decision 44); opened from the page's address (repo ADR 0018). -->
              <div class={shown.electiveSeats} data-screen="electiveSeats">
                <template lwc:if={showsElectiveSeats}>
                  <c-shoresh-elective-seats
                    setup={setup}
                    terms={terms}
                    onnavigate={handleNavigate}
                  ></c-shoresh-elective-seats>
                </template>
              </div>

              <!-- The schedule page: versions of a program's week, in three views -->
              <div class={shown.schedules} data-screen="schedules">
                <h2
                  class="slds-text-heading_medium slds-m-bottom_small"
                  tabindex="-1"
                  data-heading
                >
                  {labels.screens.schedules}
                </h2>
                <c-shoresh-schedules
                  setup={setup}
                  terms={terms}
                ></c-shoresh-schedules>
              </div>

              <!-- Bring in choices (electives slice E6): not in the menu until electives are
                   finished (decision 44); opened from the page's address (ADR 0017). -->
              <div class={shown.bringInChoices} data-screen="bringInChoices">
                <template lwc:if={showsBringInChoices}>
                  <c-shoresh-choices-import
                    setup={setup}
                    terms={terms}
                    onseasonchanged={handleSeasonChanged}
                  ></c-shoresh-choices-import>
                </template>
              </div>

              <!-- Import last year, opened from Roots -->
              <div class={shown.import} data-screen="import">
                <c-shoresh-import
                  setup={setup}
                  terms={terms}
                  onimported={handleImported}
                  onclose={handleImportClosed}
                ></c-shoresh-import>
              </div>
            </template>
          </div>
        </div>
      </div>
    </template>
    <template lwc:if={ask}>
      <c-shoresh-ask
        heading={ask.heading}
        lines={ask.lines}
        confirm-label={ask.confirmLabel}
        onanswer={handleAnswer}
      ></c-shoresh-ask>
    </template>
  </div>
</template>
