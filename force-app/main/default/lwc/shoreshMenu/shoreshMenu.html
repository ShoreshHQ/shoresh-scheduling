<template>
  <nav class="slds-nav-vertical slds-nav-vertical_compact" aria-label="Shoresh">
    <template for:each={view} for:item="section">
      <div key={section.key} class="slds-nav-vertical__section">
        <template lwc:if={section.title}>
          <h2 class="slds-nav-vertical__title">{section.title}</h2>
        </template>
        <ul>
          <template for:each={section.items} for:item="item">
            <li key={item.key} class={item.className}>
              <template lwc:if={item.disabled}>
                <a
                  href="#"
                  class="slds-nav-vertical__action slds-text-color_weak"
                  aria-disabled="true"
                  data-coming={item.coming}
                  data-item={item.key}
                  onclick={handleDisabledClick}
                  ><span class="menu-label">{item.label}</span
                  ><template lwc:if={item.coming}
                    ><span
                      class="slds-badge slds-col_bump-left"
                      aria-hidden="true"
                      >Coming</span
                    ></template
                  ><span class="slds-assistive-text" data-reason={item.key}
                    >{item.reason}</span
                  ></a
                >
              </template>
              <template lwc:else>
                <a
                  href="#"
                  class="slds-nav-vertical__action"
                  aria-current={item.ariaCurrent}
                  data-screen={item.key}
                  data-item={item.key}
                  onclick={handleClick}
                  ><span class="menu-label">{item.label}</span
                  ><template lwc:if={item.mark}
                    ><span
                      class={item.markClass}
                      title={item.mark.label}
                      aria-hidden="true"
                      data-mark={item.mark.kind}
                      ><template lwc:if={item.markIsDone}
                        ><svg
                          viewBox="0 0 16 16"
                          width="12"
                          height="12"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          focusable="false"
                        >
                          <path d="M3 8.5 6.5 12 13 4.5"></path></svg></template
                      ><template lwc:else>{item.mark.symbol}</template></span
                    ><span class="slds-assistive-text"
                      >{item.mark.label}</span
                    ></template
                  ></a
                >
              </template>
            </li>
          </template>
        </ul>
      </div>
    </template>
  </nav>
</template>
