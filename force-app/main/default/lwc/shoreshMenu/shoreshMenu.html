<template>
  <nav class="menu" aria-label="Shoresh">
    <template lwc:if={controls}>
      <!-- The page's own camp and season controls (step 3b): its pickers read as the camp
           row's words; the season's actions and details sit with them. -->
      <div class="camp-controls" data-id="camp">
        <slot name="camp"></slot>
      </div>
      <div class="shoresh-hairline bleed" role="presentation"></div>
    </template>
    <template lwc:elseif={campName}>
      <div class="camp" data-id="camp">
        <span class="camp-name" title={campName}>{campName}</span>
        <template lwc:if={seasonName}>
          <span class="season shoresh-num" data-id="season">{seasonName}</span>
        </template>
      </div>
      <div class="shoresh-hairline bleed" role="presentation"></div>
    </template>
    <template for:each={view} for:item="section">
      <div key={section.key} class={section.sectionClass}>
        <template lwc:if={section.door}>
          <!-- A title that is a doorway (Schedules, wiki decision 61): a real button, in the
               title's look; the screen it opens is shown as the menu's other screens are. -->
          <h2 class="section-title section-title_door">
            <button
              type="button"
              class={section.doorClass}
              aria-current={section.doorCurrent}
              aria-disabled={section.doorDisabled}
              data-door={section.door.key}
              onclick={handleDoorClick}
            >
              <span class="door-label">{section.title}</span
              ><template lwc:if={section.door.reason}
                ><span
                  class="slds-assistive-text"
                  data-reason={section.door.key}
                  >{section.door.reason}</span
                ></template
              >
            </button>
          </h2>
        </template>
        <template lwc:elseif={section.title}>
          <h2 class="section-title">{section.title}</h2>
        </template>
        <ul>
          <template for:each={section.items} for:item="item">
            <li key={item.key} class={item.className}>
              <template lwc:if={item.disabled}>
                <a
                  href="#"
                  class="menu-action menu-action_disabled"
                  aria-disabled="true"
                  data-coming={item.coming}
                  data-item={item.key}
                  onclick={handleDisabledClick}
                  ><span class="menu-label">{item.label}</span
                  ><template lwc:if={item.coming}
                    ><span class="slds-badge menu-coming" aria-hidden="true"
                      >Coming</span
                    ></template
                  ><span class="slds-assistive-text" data-reason={item.key}
                    >{item.reason}</span
                  ></a
                >
              </template>
              <template lwc:else>
                <a
                  href="#"
                  class={item.actionClass}
                  aria-current={item.ariaCurrent}
                  data-screen={item.key}
                  data-item={item.key}
                  onclick={handleClick}
                  ><template lwc:if={item.isRoots}
                    ><svg
                      class="menu-icon"
                      viewBox="0 0 16 16"
                      width="16"
                      height="16"
                      aria-hidden="true"
                      focusable="false"
                    >
                      <path d="M8 14V7"></path>
                      <path d="M8 9C8 6 6 4.5 3 4.5c0 3 2 4.5 5 4.5Z"></path>
                      <path
                        d="M8 7.5c0-2.5 1.7-4 4.5-4 0 2.5-1.7 4-4.5 4Z"
                      ></path></svg></template
                  ><span class="menu-label">{item.label}</span
                  ><template lwc:if={item.mark}
                    ><span
                      class={item.markClass}
                      title={item.mark.label}
                      aria-hidden="true"
                      data-mark={item.mark.kind}
                      ><template lwc:if={item.markIsDone}
                        ><svg
                          viewBox="0 0 16 16"
                          width="12"
                          height="12"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          focusable="false"
                        >
                          <path d="M3 8.5 6.5 12 13 4.5"></path></svg></template
                      ><template lwc:else>{item.mark.symbol}</template></span
                    ><span class="slds-assistive-text"
                      >{item.mark.label}</span
                    ></template
                  ></a
                >
              </template>
            </li>
          </template>
        </ul>
      </div>
    </template>
    <template lwc:if={setupChanged}>
      <div class="foot" data-id="setup-notice">
        <div class="shoresh-hairline bleed" role="presentation"></div>
        <p class="notice-what">
          <span class="notice-dot" aria-hidden="true"></span>Setup changed
        </p>
        <button
          type="button"
          class="notice-go shoresh-raised"
          disabled={setupBusy}
          data-id="menu-update-to-match"
          onclick={handleUpdateToMatch}
        >
          Update to match setup
        </button>
      </div>
    </template>
  </nav>
</template>
