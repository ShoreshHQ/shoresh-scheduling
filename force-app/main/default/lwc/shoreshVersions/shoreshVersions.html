<template>
  <div class="versions" onkeydown={handleKeydown}>
    <!-- A plain button, so aria-expanded is on the button itself (as the desktop's). -->
    <button
      type="button"
      class="slds-button slds-button_neutral"
      aria-expanded={expanded}
      onclick={handleToggle}
      data-id="versions-button"
    >
      {title}
      <lightning-icon
        class="chevron"
        icon-name={buttonIcon}
        size="xx-small"
      ></lightning-icon>
    </button>
    <template lwc:if={isOpen}>
      <div class="panel" data-id="versions-panel">
        <div class="panel-head">
          <div class="panel-title">{title}</div>
        </div>
        <div class="panel-list">
          <template lwc:if={isEmpty}>
            <div class="empty">None yet</div>
          </template>
          <template for:each={rows} for:item="row">
            <div key={row.id} class="version" data-version={row.id}>
              <template lwc:if={row.renaming}>
                <div class="rename">
                  <input
                    class="slds-input"
                    value={renameValue}
                    maxlength="80"
                    aria-label="New name"
                    oninput={handleRenameInput}
                    onkeydown={handleRenameKey}
                    data-id="rename-input"
                  />
                  <lightning-button
                    variant="brand"
                    label="Save"
                    disabled={renameDisabled}
                    onclick={handleSaveRename}
                    data-id="rename-save"
                  ></lightning-button>
                </div>
              </template>
              <template lwc:else>
                <div class="version-text">
                  <div class="version-name">{row.name}</div>
                  <div class="version-meta">
                    {row.meta}
                    <template lwc:if={row.showSaved}>
                      <lightning-formatted-date-time
                        value={row.savedAt}
                        month="short"
                        day="numeric"
                        hour="numeric"
                        minute="2-digit"
                        data-id="saved-at"
                      ></lightning-formatted-date-time>
                    </template>
                  </div>
                </div>
                <template lwc:if={row.onScreen}>
                  <span class="on-screen">on screen now</span>
                </template>
                <button
                  type="button"
                  class="link link_quiet"
                  data-id={row.id}
                  data-action="rename"
                  aria-label={row.renameName}
                  onclick={handleStartRename}
                >
                  rename
                </button>
                <template lwc:if={row.deletable}>
                  <button
                    type="button"
                    class={row.deleteClass}
                    data-id={row.id}
                    data-action="delete"
                    aria-label={row.deleteName}
                    disabled={busy}
                    onclick={handleDelete}
                    onblur={handleDeleteBlur}
                  >
                    {row.deleteLabel}
                  </button>
                </template>
                <button
                  type="button"
                  class="link"
                  data-id={row.id}
                  data-action="open"
                  aria-label={row.actionName}
                  disabled={actionDisabled}
                  onclick={handleOpen}
                >
                  {actionLabel}
                </button>
              </template>
            </div>
          </template>
        </div>
        <template lwc:if={canSave}>
          <div class="panel-foot" data-id="save-version">
            <input
              class="slds-input"
              value={saveName}
              maxlength="80"
              placeholder={savePlaceholder}
              aria-label={savePlaceholder}
              oninput={handleSaveInput}
              onkeydown={handleSaveKey}
              data-id="save-name"
            />
            <lightning-button
              variant="brand"
              label={saveLabel}
              disabled={saveDisabled}
              onclick={handleSave}
              data-id="save-button"
            ></lightning-button>
          </div>
        </template>
      </div>
    </template>
    <!-- Only where the page has no live region of its own to say it through (announceWith). -->
    <template lwc:if={ownRegion}>
      <div class="slds-assistive-text" aria-live="polite" data-id="announce">
        {announcement}
      </div>
    </template>
  </div>
</template>
