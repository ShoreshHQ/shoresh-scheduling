<template>
  <section class="slds-m-top_large">
    <div
      class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small"
    >
      <h2 class="slds-text-heading_medium">{labels.title}</h2>
      <c-shoresh-saved-mark class="slds-m-left_small"></c-shoresh-saved-mark>
    </div>
    <template lwc:if={hasActivities}>
      <div class="slds-grid slds-wrap slds-gutters_small">
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
          <lightning-combobox
            data-id="activity-picker"
            label={labels.activity}
            value={activityId}
            options={activityOptions}
            onchange={handleActivityChange}
          ></lightning-combobox>
        </div>
      </div>

      <h3 class="slds-text-heading_small slds-m-top_medium">
        {labels.whoCanDoIt}
      </h3>
      <lightning-dual-listbox
        data-id="who-can-do-it"
        label={labels.whoCanDoIt}
        variant="label-hidden"
        source-label={labels.available}
        selected-label={chosenLabel}
        options={targetOptions}
        value={whoCanDoIt}
        onchange={handleWhoChange}
        onfocusout={handleWhoLeave}
      ></lightning-dual-listbox>
      <template lwc:if={whoError}>
        <div
          class="slds-form-element__help slds-text-color_error"
          role="alert"
          data-error="who"
        >
          {whoError}
        </div>
      </template>

      <h3
        class="slds-text-heading_small slds-m-top_medium slds-m-bottom_x-small"
      >
        {labels.moreRules}
      </h3>
      <lightning-input
        type="checkbox"
        data-field="sameDivision"
        label={labels.sameDivision}
        checked={sameDivision}
        onchange={handleRule}
      ></lightning-input>
      <template lwc:if={sameDivisionError}>
        <div
          class="slds-form-element__help slds-text-color_error"
          role="alert"
          data-error="sameDivision"
        >
          {sameDivisionError}
        </div>
      </template>
      <fieldset class="slds-form-element slds-m-top_x-small" data-id="early">
        <legend class="slds-form-element__legend slds-form-element__label">
          {labels.early}
        </legend>
        <div class="slds-grid slds-wrap slds-gutters_small">
          <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
            <lightning-input
              type="number"
              data-field="earlyCount"
              label={labels.earlyCount}
              value={earlyCount}
              min="1"
              step="1"
              onchange={handleRule}
              onfocusout={handleRuleLeave}
            ></lightning-input>
            <template lwc:if={earlyCountError}>
              <div
                class="slds-form-element__help slds-text-color_error"
                role="alert"
                data-error="earlyCount"
              >
                {earlyCountError}
              </div>
            </template>
          </div>
          <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
            <lightning-combobox
              data-field="earlyDay"
              label={labels.earlyDay}
              value={earlyDay}
              options={dayOptions}
              onchange={handleRule}
            ></lightning-combobox>
            <template lwc:if={earlyDayError}>
              <div
                class="slds-form-element__help slds-text-color_error"
                role="alert"
                data-error="earlyDay"
              >
                {earlyDayError}
              </div>
            </template>
          </div>
        </div>
      </fieldset>
      <lightning-textarea
        class="slds-m-top_x-small"
        data-field="notes"
        label={labels.notes}
        value={notes}
        onchange={handleRule}
        onfocusout={handleRuleLeave}
      ></lightning-textarea>
      <template lwc:if={notesError}>
        <div
          class="slds-form-element__help slds-text-color_error"
          role="alert"
          data-error="notes"
        >
          {notesError}
        </div>
      </template>
    </template>
    <template lwc:else>
      <c-shoresh-empty-state title={labels.empty}></c-shoresh-empty-state>
    </template>
  </section>
</template>
