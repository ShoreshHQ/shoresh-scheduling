<template>
  <template lwc:if={activity}>
    <!-- The details zone beside the Activities table (docs/design/setup/activities.html): one
         hairline from the list, the activity's name, its fields as wells, saved as you go. -->
    <section
      class="panel"
      data-id="details"
      aria-labelledby="activity-details-title"
    >
      <div class="panel-head">
        <h2
          id="activity-details-title"
          class="panel-title"
          tabindex="-1"
          data-heading
        >
          {labels.name}<span class="slds-assistive-text"> details</span>
        </h2>
        <c-shoresh-saved-mark class="panel-saved"></c-shoresh-saved-mark>
        <button
          type="button"
          class="shoresh-item shoresh-item_icon shoresh-item_tool panel-close"
          data-id="close"
          aria-label={labels.close}
          title={labels.close}
          onclick={handleClose}
        >
          <!-- The rail's 16 px glyph, drawn by its attributes (no stylesheet rule). -->
          <svg
            width="16"
            height="16"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M4.5 4.5l7 7 M11.5 4.5l-7 7"></path>
          </svg>
        </button>
      </div>

      <div class="field">
        <lightning-combobox
          data-field="rainPlan"
          label={labels.rainPlan}
          value={rainPlan}
          options={rainPlanOptions}
          onchange={handleRule}
          read-only={readOnly}
        ></lightning-combobox>
        <template lwc:if={fieldErrors.rainPlan}>
          <div
            class="slds-form-element__help slds-text-color_error"
            role="alert"
            data-error="rainPlan"
          >
            {fieldErrors.rainPlan}
          </div>
        </template>
      </div>

      <div class="field">
        <lightning-radio-group
          class="set"
          type="button"
          data-field="sameDivision"
          label={labels.together}
          options={togetherOptions}
          value={together}
          onchange={handleRule}
          disabled={readOnly}
        ></lightning-radio-group>
        <template lwc:if={sameDivisionError}>
          <div
            class="slds-form-element__help slds-text-color_error"
            role="alert"
            data-error="sameDivision"
          >
            {sameDivisionError}
          </div>
        </template>
      </div>

      <fieldset class="slds-form-element field" data-id="early">
        <!-- A label over its fields, not SLDS's floated legend. -->
        <legend class="slds-form-element__label">{labels.early}</legend>
        <div class="pair">
          <div class="pair-part">
            <lightning-input
              type="number"
              data-field="earlyCount"
              label={labels.earlyCount}
              value={earlyCount}
              min="1"
              step="1"
              message-when-range-underflow={limits.earlyCount.low}
              message-when-step-mismatch={limits.earlyCount.whole}
              onchange={handleRule}
              onfocusout={handleRuleLeave}
              onkeydown={handleRuleKey}
              read-only={readOnly}
            ></lightning-input>
            <template lwc:if={earlyCountError}>
              <div
                class="slds-form-element__help slds-text-color_error"
                role="alert"
                data-error="earlyCount"
              >
                {earlyCountError}
              </div>
            </template>
          </div>
          <div class="pair-part">
            <lightning-combobox
              data-field="earlyDay"
              label={labels.earlyDay}
              value={earlyDay}
              options={dayOptions}
              onchange={handleRule}
              read-only={readOnly}
            ></lightning-combobox>
            <template lwc:if={earlyDayError}>
              <div
                class="slds-form-element__help slds-text-color_error"
                role="alert"
                data-error="earlyDay"
              >
                {earlyDayError}
              </div>
            </template>
          </div>
        </div>
      </fieldset>

      <div class="field">
        <lightning-checkbox-group
          data-id="who-can-do-it"
          data-field="whoCanDoIt"
          label={whoLabel}
          options={targetOptions}
          value={whoCanDoIt}
          onchange={handleWhoChange}
          disabled={readOnly}
        ></lightning-checkbox-group>
        <template lwc:if={whoError}>
          <div
            class="slds-form-element__help slds-text-color_error"
            role="alert"
            data-error="who"
          >
            {whoError}
          </div>
        </template>
      </div>

      <!-- Who leads it (ADR 0031 piece B): the season's staff, ticked like Who can do it. -->
      <template lwc:if={hasStaff}>
        <div class="field">
          <lightning-checkbox-group
            data-id="who-leads-it"
            data-field="whoLeadsIt"
            label={labels.whoLeadsIt}
            options={staffOptions}
            value={leaders}
            onchange={handleLeadsChange}
            disabled={readOnly}
          ></lightning-checkbox-group>
          <template lwc:if={leadsError}>
            <div
              class="slds-form-element__help slds-text-color_error"
              role="alert"
              data-error="leads"
            >
              {leadsError}
            </div>
          </template>
        </div>
      </template>

      <!-- When it runs (ADR 0031 piece A): per program, its days by its time blocks, every box
           ticked until the director unticks a time it can't run; the recurring activities' day
           ticks, in a grid. -->
      <template lwc:if={hasRunsGrids}>
        <div class="field" data-id="when-it-runs">
          <template for:each={runsGrids} for:item="grid">
            <table key={grid.key} class="runs" data-program={grid.key}>
              <caption class="slds-form-element__label runs-caption">
                {grid.label}
              </caption>
              <thead>
                <tr>
                  <td class="runs-corner"></td>
                  <template for:each={grid.days} for:item="day">
                    <th
                      key={day.key}
                      scope="col"
                      class="runs-day"
                      abbr={day.label}
                    >
                      {day.short}
                    </th>
                  </template>
                </tr>
              </thead>
              <tbody>
                <template for:each={grid.rows} for:item="row">
                  <tr key={row.key}>
                    <th scope="row" class="runs-block">{row.name}</th>
                    <template for:each={row.boxes} for:item="box">
                      <td key={box.key} class="runs-cell">
                        <label class="chip">
                          <input
                            type="checkbox"
                            class="chip-box"
                            aria-label={box.label}
                            checked={box.checked}
                            data-field="whenItRuns"
                            data-box={box.box}
                            disabled={readOnly}
                            onchange={handleRunsChange}
                          />
                          <span class="chip-face" aria-hidden="true"></span>
                        </label>
                      </td>
                    </template>
                  </tr>
                </template>
              </tbody>
            </table>
          </template>
          <template lwc:if={runsError}>
            <div
              class="slds-form-element__help slds-text-color_error"
              role="alert"
              data-error="runs"
            >
              {runsError}
            </div>
          </template>
        </div>
      </template>

      <div class="pair field">
        <div class="pair-part">
          <span class="number-with-unit">
            <lightning-input
              type="number"
              data-field="length"
              label={labels.length}
              value={length}
              min="1"
              step="1"
              message-when-range-underflow={limits.length.low}
              message-when-step-mismatch={limits.length.whole}
              message-when-value-missing={limits.length.missing}
              required
              onchange={handleRule}
              onfocusout={handleRuleLeave}
              onkeydown={handleRuleKey}
              read-only={readOnly}
            ></lightning-input>
            <span class="number-unit" data-id="length-unit">{lengthUnit}</span>
          </span>
          <template lwc:if={fieldErrors.length}>
            <div
              class="slds-form-element__help slds-text-color_error"
              role="alert"
              data-error="length"
            >
              {fieldErrors.length}
            </div>
          </template>
        </div>
        <div class="pair-part">
          <lightning-combobox
            data-field="priority"
            label={labels.priority}
            value={priority}
            options={priorityOptions}
            onchange={handleRule}
            read-only={readOnly}
          ></lightning-combobox>
          <template lwc:if={fieldErrors.priority}>
            <div
              class="slds-form-element__help slds-text-color_error"
              role="alert"
              data-error="priority"
            >
              {fieldErrors.priority}
            </div>
          </template>
        </div>
      </div>

      <div class="pair field">
        <div class="pair-part">
          <lightning-input
            type="number"
            data-field="groupsAtOnce"
            label={labels.groupsAtOnce}
            value={groupsAtOnce}
            min="1"
            step="1"
            message-when-range-underflow={limits.groupsAtOnce.low}
            message-when-step-mismatch={limits.groupsAtOnce.whole}
            onchange={handleRule}
            onfocusout={handleRuleLeave}
            onkeydown={handleRuleKey}
            read-only={readOnly}
          ></lightning-input>
          <template lwc:if={fieldErrors.groupsAtOnce}>
            <div
              class="slds-form-element__help slds-text-color_error"
              role="alert"
              data-error="groupsAtOnce"
            >
              {fieldErrors.groupsAtOnce}
            </div>
          </template>
        </div>
        <div class="pair-part pair-tick">
          <lightning-input
            type="checkbox"
            data-field="noGroupLimit"
            label={labels.noGroupLimit}
            checked={noGroupLimit}
            onchange={handleRule}
            disabled={readOnly}
          ></lightning-input>
          <template lwc:if={fieldErrors.noGroupLimit}>
            <div
              class="slds-form-element__help slds-text-color_error"
              role="alert"
              data-error="noGroupLimit"
            >
              {fieldErrors.noGroupLimit}
            </div>
          </template>
        </div>
      </div>

      <div class="ticks field">
        <lightning-input
          type="checkbox"
          data-field="outdoor"
          label={labels.outdoor}
          checked={outdoor}
          onchange={handleRule}
          disabled={readOnly}
        ></lightning-input>
        <template lwc:if={fieldErrors.outdoor}>
          <div
            class="slds-form-element__help slds-text-color_error"
            role="alert"
            data-error="outdoor"
          >
            {fieldErrors.outdoor}
          </div>
        </template>
        <lightning-input
          type="checkbox"
          data-field="noWeeklyMax"
          label={labels.noWeeklyMax}
          checked={noWeeklyMax}
          onchange={handleRule}
          disabled={readOnly}
        ></lightning-input>
        <template lwc:if={fieldErrors.noWeeklyMax}>
          <div
            class="slds-form-element__help slds-text-color_error"
            role="alert"
            data-error="noWeeklyMax"
          >
            {fieldErrors.noWeeklyMax}
          </div>
        </template>
      </div>

      <div class="field field_grow">
        <lightning-textarea
          class="notes"
          data-field="notes"
          label={labels.notes}
          value={notes}
          onchange={handleRule}
          onfocusout={handleRuleLeave}
          read-only={readOnly}
        ></lightning-textarea>
        <template lwc:if={notesError}>
          <div
            class="slds-form-element__help slds-text-color_error"
            role="alert"
            data-error="notes"
          >
            {notesError}
          </div>
        </template>
      </div>
    </section>

    <!-- Someone else changed the field since it was shown (the setup tables' question, ADR 0011
         choice 5) -->
    <template lwc:if={conflict}>
      <section
        role="dialog"
        aria-modal="true"
        aria-labelledby="activity-conflict-title"
        class="slds-modal slds-fade-in-open"
        data-id="conflict"
        onkeydown={handleConflictKeyDown}
      >
        <div class="slds-modal__container">
          <div class="slds-modal__header">
            <h2 id="activity-conflict-title" class="slds-modal__title">
              Changed by someone else
            </h2>
          </div>
          <div class="slds-modal__content slds-p-around_medium">
            <ul class="conflict-rows">
              <template for:each={conflictRows} for:item="row">
                <li key={row.key} class="conflict-row" data-field={row.key}>
                  <p class="conflict-where">{row.where}</p>
                  <dl class="conflict-choices">
                    <dt>Theirs</dt>
                    <dd data-id="theirs">{row.theirs}</dd>
                    <dt>Yours</dt>
                    <dd data-id="yours">{row.yours}</dd>
                  </dl>
                </li>
              </template>
            </ul>
          </div>
          <div class="slds-modal__footer">
            <button
              type="button"
              class="slds-button slds-button_neutral"
              onclick={handleKeepTheirs}
              data-id="keep-theirs"
            >
              Keep theirs
            </button>
            <button
              type="button"
              class="slds-button slds-button_brand"
              onclick={handleUseYours}
              data-id="use-yours"
            >
              Use yours
            </button>
          </div>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
  </template>
  <!-- A question before an action, its button naming the action (word walk W4: never "OK"). -->
  <template lwc:if={ask}>
    <c-shoresh-ask
      heading={ask.heading}
      lines={ask.lines}
      confirm-label={ask.confirmLabel}
      tone={ask.tone}
      onanswer={handleAskAnswer}
    ></c-shoresh-ask>
  </template>
</template>
