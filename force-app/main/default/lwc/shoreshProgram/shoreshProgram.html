<template>
  <template lwc:if={isProgram}>
    <article class="slds-card slds-card_boundary slds-m-bottom_medium">
      <div class="slds-card__body slds-card__body_inner slds-p-top_small">
        <div
          class="slds-grid slds-wrap slds-gutters_small slds-grid_vertical-align-end"
        >
          <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
            <lightning-input
              data-id="name"
              label={labels.name}
              value={name}
              required
              onchange={handleName}
              onfocusout={handleNameLeave}
              onkeydown={handleNameKey}
            ></lightning-input>
            <template lwc:if={nameError}>
              <div
                class="slds-form-element__help slds-text-color_error"
                role="alert"
                data-id="name-error"
              >
                {nameError}
              </div>
            </template>
          </div>
          <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-3">
            <fieldset class="slds-form-element">
              <legend
                class="slds-form-element__legend slds-form-element__label"
              >
                {labels.days}
              </legend>
              <div class="slds-grid slds-wrap">
                <template for:each={dayOptions} for:item="option">
                  <lightning-input
                    key={option.day}
                    class="slds-m-right_small"
                    type="checkbox"
                    label={option.label}
                    checked={option.checked}
                    data-day={option.day}
                    onchange={handleDay}
                  ></lightning-input>
                </template>
              </div>
              <template lwc:if={daysError}>
                <div
                  class="slds-form-element__help slds-text-color_error"
                  role="alert"
                  data-id="days-error"
                >
                  {daysError}
                </div>
              </template>
            </fieldset>
          </div>
        </div>
        <div
          class="slds-m-top_x-small slds-grid slds-grid_vertical-align-center"
        >
          <lightning-button
            label={labels.deleteProgram}
            variant="destructive-text"
            onclick={handleDeleteProgram}
            disabled={busy}
          ></lightning-button>
          <c-shoresh-saved-mark
            class="slds-m-left_small"
          ></c-shoresh-saved-mark>
        </div>
      </div>
    </article>
  </template>

  <template lwc:if={isTimeBlocks}>
    <c-shoresh-editable-table
      data-id="time-blocks"
      title={labels.timeBlocks}
      heading={sectionHeading}
      show-columns
      object-api-name={objects.TimeBlock}
      flag-same-names
      columns={blockColumns}
      rows={entry.timeBlocks}
      add-label={labels.addTimeBlock}
      empty-message={labels.noTimeBlocks}
      new-row-defaults={blockDefaults}
      busy={busy}
      onsave={handleChildSave}
      ondelete={handleChildDelete}
    ></c-shoresh-editable-table>
  </template>

  <template lwc:if={isDivisions}>
    <c-shoresh-editable-table
      data-id="divisions"
      title={labels.divisions}
      heading={sectionHeading}
      show-columns
      object-api-name={objects.Division}
      flag-same-names
      columns={divisionColumns}
      rows={divisionRecords}
      add-label={labels.addDivision}
      empty-message={labels.noDivisions}
      new-row-defaults={divisionDefaults}
      busy={busy}
      onsave={handleChildSave}
      ondelete={handleChildDelete}
    ></c-shoresh-editable-table>
  </template>

  <template lwc:if={isGroups}>
    <template lwc:if={hasDivisions}>
      <template for:each={divisions} for:item="division">
        <c-shoresh-editable-table
          key={division.id}
          data-id="groups"
          title={division.title}
          heading={division.heading}
          show-columns={division.first}
          object-api-name={objects.Group}
          flag-same-names
          same-name-scope={groupDivisionField}
          same-names-elsewhere={division.namesElsewhere}
          data-division={division.id}
          onpendingnames={handlePendingNames}
          columns={groupColumns}
          rows={division.groups}
          add-label={labels.addGroup}
          empty-message={labels.noGroups}
          new-row-defaults={division.defaults}
          draft-note={groupMoveNote}
          draft-note-heading={labels.moving}
          weeks={weeks}
          week-exceptions={weekExceptions}
          weeks-heading={labels.weeksColumn}
          week-words={weekWords}
          before-week-off={beforeWeekOff}
          week-phrase="runs in"
          busy={busy}
          onsave={handleChildSave}
          ondelete={handleChildDelete}
        ></c-shoresh-editable-table>
      </template>
    </template>
    <template lwc:else>
      <div class="slds-m-bottom_medium" data-id="needs-divisions">
        <c-shoresh-empty-state
          title={labels.noDivisions}
        ></c-shoresh-empty-state>
        <div class="slds-text-align_center">
          <lightning-button
            label={labels.toDivisions}
            data-screen="divisions"
            data-id="go-divisions"
            onclick={handleGo}
          ></lightning-button>
        </div>
      </div>
    </template>
  </template>

  <template lwc:if={isFixed}>
    <template lwc:if={hasTimeBlocks}>
      <c-shoresh-editable-table
        data-id="fixed-activities"
        title={labels.fixed}
        object-api-name={objects.FixedActivity}
        flag-same-names
        columns={fixedColumns}
        rows={entry.fixedActivities}
        add-label={labels.addFixed}
        empty-message={labels.noFixed}
        new-row-defaults={fixedDefaults}
        weeks={weeks}
        week-exceptions={weekExceptions}
        weeks-heading={labels.weeksColumn}
        week-words={weekWords}
        before-week-off={beforeWeekOff}
        week-phrase="runs in"
        notes-heading={labels.leftOut}
        row-notes={fixedNotes}
        row-actions={fixedActions}
        busy={busy}
        onsave={handleChildSave}
        ondelete={handleChildDelete}
      ></c-shoresh-editable-table>
    </template>
    <template lwc:else>
      <div class="slds-m-bottom_medium" data-id="needs-blocks">
        <c-shoresh-empty-state
          title={labels.noTimeBlocks}
        ></c-shoresh-empty-state>
        <div class="slds-text-align_center">
          <lightning-button
            label={labels.toTimeBlocks}
            data-screen="timeBlocks"
            data-id="go-time-blocks"
            onclick={handleGo}
          ></lightning-button>
        </div>
      </div>
    </template>
  </template>

  <template lwc:if={isRecurring}>
    <template lwc:if={hasTimeBlocks}>
      <c-shoresh-editable-table
        data-id="recurring-activities"
        title={labels.recurring}
        object-api-name={objects.RecurringActivity}
        flag-same-names
        columns={recurringColumns}
        rows={entry.recurringActivities}
        add-label={labels.addRecurring}
        empty-message={labels.noRecurring}
        new-row-defaults={recurringDefaults}
        weeks={weeks}
        week-exceptions={weekExceptions}
        weeks-heading={labels.weeksColumn}
        week-words={weekWords}
        before-week-off={beforeWeekOff}
        week-phrase="runs in"
        notes-heading={labels.leftOut}
        row-notes={recurringNotes}
        row-actions={recurringActions}
        busy={busy}
        onsave={handleChildSave}
        ondelete={handleChildDelete}
      ></c-shoresh-editable-table>
    </template>
    <template lwc:else>
      <div class="slds-m-bottom_medium" data-id="needs-blocks">
        <c-shoresh-empty-state
          title={labels.noTimeBlocks}
        ></c-shoresh-empty-state>
        <div class="slds-text-align_center">
          <lightning-button
            label={labels.toTimeBlocks}
            data-screen="timeBlocks"
            data-id="go-time-blocks"
            onclick={handleGo}
          ></lightning-button>
        </div>
      </div>
    </template>
  </template>
</template>
