<template>
  <div class="import" data-id="import">
    <!-- The rail (the design's grammar): the way back, what this is and which files, then
         Start again and the one main action. design-research/screens-r1/import.html -->
    <div class="rail" data-id="rail">
      <div class="side side_left">
        <button
          type="button"
          class="shoresh-item"
          aria-label="Back to Roots"
          onclick={handleClose}
          data-id="close"
        >
          <svg class="shoresh-glyph" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M10 4 6 8l4 4"></path>
          </svg>
          Roots
        </button>
        <span class="shoresh-rail-line" role="presentation"></span>
        <h2
          class="shoresh-item shoresh-item_value title"
          tabindex="-1"
          data-heading
        >
          Import last year
        </h2>
        <template lwc:if={hasFiles}>
          <span
            class="shoresh-item file-name"
            title={fileNames}
            data-id="file-name"
            >{firstFileName}<template lwc:if={moreFiles}
              ><span class="more shoresh-num"
                >&nbsp;+ {moreFiles}</span
              ></template
            ></span
          >
        </template>
      </div>
      <div class="side side_right">
        <template lwc:if={isReview}>
          <button
            type="button"
            class="shoresh-item"
            onclick={handleStartAgain}
            disabled={isSaving}
            data-id="start-again"
          >
            Start again
          </button>
          <button
            type="button"
            class="shoresh-item shoresh-item_primary"
            onclick={handleSave}
            disabled={saveDisabled}
            data-id="save"
          >
            {saveLabel}
          </button>
        </template>
        <template lwc:if={isDone}>
          <template lwc:if={canUndo}>
            <button
              type="button"
              class="shoresh-item"
              onclick={handleUndo}
              data-id="undo"
            >
              Undo this import
            </button>
          </template>
          <button
            type="button"
            class="shoresh-item shoresh-item_primary"
            onclick={handleClose}
            data-id="continue"
          >
            Done
          </button>
        </template>
      </div>
    </div>
    <div class="shoresh-hairline" role="presentation"></div>

    <!-- Reading, saving, imported and undone, read out as they happen (WCAG 4.1.3). -->
    <div class="slds-assistive-text" role="status" data-id="status">
      {statusText}
    </div>

    <div class="page">
      <template lwc:if={error}>
        <div class="message" role="alert" data-id="error">{error}</div>
      </template>

      <!-- 1. Drop the files -->
      <template lwc:if={isPick}>
        <div
          class={dropClass}
          data-id="drop"
          ondragover={handleDragOver}
          ondragleave={handleDragLeave}
          ondrop={handleDrop}
        >
          <template lwc:if={isReading}>
            <lightning-spinner
              alternative-text="Reading the files"
              size="small"
            ></lightning-spinner>
          </template>
          <template lwc:else>
            <svg class="drop-glyph" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M8 10.5V2.5"></path>
              <path d="M5 5.5l3-3 3 3"></path>
              <path d="M2.5 10.5v2a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-2"></path>
            </svg>
            <div class="drop-title">Drop last year's files</div>
            <div class="drop-hint">.xlsx · .xls · .csv</div>
            <button
              type="button"
              class="shoresh-item shoresh-raised choose"
              onclick={handleChoose}
              data-id="choose"
            >
              Choose files
            </button>
            <!-- Opened by "Choose files": named, and out of the tab order. -->
            <input
              class="slds-assistive-text"
              type="file"
              tabindex="-1"
              aria-label="Choose files"
              multiple
              accept=".xlsx,.xlsm,.xls,.csv"
              data-id="files"
              onchange={handleFileInput}
            />
          </template>
        </div>
      </template>

      <!-- 2. One page: what needs an answer first, then what comes in, as quiet counts -->
      <template lwc:if={isReview}>
        <template lwc:if={isSaving}>
          <lightning-spinner
            alternative-text="Saving"
            size="small"
          ></lightning-spinner>
        </template>

        <template lwc:if={hasQuestions}>
          <section class="section" data-id="questions">
            <h3 class="section-head">
              Check these first
              <span class="shoresh-num">{questionCount}</span>
            </h3>
            <template for:each={questionRows} for:item="card">
              <div key={card.id} class={card.className} data-card={card.id}>
                <span class="n">{card.title}</span>
                <span class="d"
                  >{card.subtitle}<template lwc:if={card.detail}
                    >&nbsp;{card.detail}</template
                  ></span
                >
                <span class="options">
                  <template lwc:if={card.select}>
                    <lightning-combobox
                      class="pick"
                      label={card.title}
                      variant="label-hidden"
                      placeholder={card.placeholder}
                      value={card.value}
                      options={card.comboOptions}
                      data-id={card.id}
                      onchange={handleChoice}
                    ></lightning-combobox>
                  </template>
                  <template lwc:else>
                    <template for:each={card.options} for:item="option">
                      <button
                        key={option.key}
                        type="button"
                        class={option.className}
                        aria-pressed={option.pressed}
                        title={option.description}
                        data-key={option.key}
                        onclick={handleAnswer}
                      >
                        {option.label}<template lwc:if={option.description}
                          ><span class="slds-assistive-text"
                            >. {option.description}</span
                          ></template
                        >
                      </button>
                    </template>
                  </template>
                  <template lwc:if={card.fromMemory}>
                    <span class="tag">{card.memoryNote}</span>
                  </template>
                </span>
                <template lwc:if={card.open}>
                  <span class="corner" role="img" aria-label="Needs an answer"
                    ><i class="shoresh-look-mark"></i
                  ></span>
                </template>
              </div>
            </template>
          </section>
        </template>

        <template lwc:if={hasReadAs}>
          <!-- review.md INGEST-5: what Shoresh read without asking, each with a one-click change. -->
          <section class="section" data-id="read-as">
            <h3 class="section-head">Shoresh read these as</h3>
            <div class="tiles">
              <template for:each={readAsTiles} for:item="group">
                <button
                  key={group.key}
                  type="button"
                  class={group.className}
                  aria-expanded={group.expanded}
                  aria-controls="read-as-lines"
                  data-read-as={group.key}
                  onclick={handleReadAsTile}
                >
                  <span class="slds-assistive-text">{group.spoken}</span>
                  <b class="shoresh-num" aria-hidden="true">{group.count}</b>
                  <span aria-hidden="true">{group.label}</span>
                </button>
              </template>
            </div>
            <template lwc:if={openReadAsGroup}>
              <div
                id="read-as-lines"
                role="group"
                aria-label={openReadAsGroup.label}
                data-id="read-as-lines"
              >
                <template for:each={openReadAsGroup.lines} for:item="line">
                  <div
                    key={line.key}
                    class="row shoresh-raised"
                    data-line={line.id}
                  >
                    <span class="n">{line.name}</span>
                    <span class="d">{line.detail}</span>
                    <span class="options">
                      <template lwc:if={line.select}>
                        <lightning-combobox
                          class="pick"
                          label={line.name}
                          variant="label-hidden"
                          value={line.answer}
                          options={line.comboOptions}
                          data-id={line.id}
                          onchange={handleChoice}
                        ></lightning-combobox>
                      </template>
                      <template lwc:else>
                        <template for:each={line.options} for:item="option">
                          <button
                            key={option.key}
                            type="button"
                            class={option.className}
                            aria-pressed={option.pressed}
                            data-key={option.key}
                            onclick={handleReadAs}
                          >
                            {option.label}
                          </button>
                        </template>
                      </template>
                    </span>
                  </div>
                </template>
              </div>
            </template>
          </section>
        </template>
        <template lwc:if={hasMissing}>
          <!-- review.md INGEST-5.8: what an earlier import brought in that these files lack. -->
          <section class="section" data-id="missing">
            <h3 class="section-head">
              Not in these files
              <span class="shoresh-num">{missingRows.length}</span>
            </h3>
            <template for:each={missingRows} for:item="row">
              <div
                key={row.key}
                class="row shoresh-raised"
                data-missing={row.key}
              >
                <span class="n">{row.name}</span>
                <span class="d">{row.detail}</span>
                <span class="options">
                  <template for:each={row.options} for:item="option">
                    <button
                      key={option.key}
                      type="button"
                      class={option.className}
                      aria-pressed={option.pressed}
                      data-key={option.key}
                      onclick={handleMissing}
                    >
                      {option.label}
                    </button>
                  </template>
                </span>
              </div>
            </template>
          </section>
        </template>
        <template lwc:if={hasComingIn}>
          <section class="section" data-id="coming-in">
            <h3 class="section-head">Comes in</h3>
            <div class="tiles">
              <template for:each={comingInTiles} for:item="tile">
                <button
                  key={tile.key}
                  type="button"
                  class={tile.className}
                  aria-expanded={tile.expanded}
                  aria-controls="coming-in-names"
                  data-tile={tile.key}
                  onclick={handleTile}
                >
                  <span class="slds-assistive-text">{tile.spoken}</span>
                  <b class="shoresh-num" aria-hidden="true">{tile.count}</b>
                  <span aria-hidden="true">{tile.label}</span>
                </button>
              </template>
            </div>
            <template lwc:if={openTile}>
              <ul
                class="names"
                id="coming-in-names"
                aria-label={openTile.label}
                data-id="names"
              >
                <template for:each={openTile.nameItems} for:item="item">
                  <li key={item.key} class="name shoresh-raised">
                    {item.name}
                  </li>
                </template>
              </ul>
            </template>
          </section>
        </template>

        <template lwc:if={hasProgramChoices}>
          <section class="section" data-id="program-choices">
            <h3 class="section-head">{labels.programs}</h3>
            <template for:each={programChoices} for:item="card">
              <div key={card.id} class={card.className} data-card={card.id}>
                <span class="n">{card.subject}</span>
                <span class="d"></span>
                <span class="options">
                  <lightning-combobox
                    class="pick"
                    label={card.title}
                    variant="label-hidden"
                    placeholder={card.placeholder}
                    value={card.value}
                    options={card.comboOptions}
                    data-id={card.id}
                    onchange={handleChoice}
                  ></lightning-combobox>
                </span>
              </div>
            </template>
          </section>
        </template>

        <template lwc:if={hasUnitChoices}>
          <section class="section" data-id="unit-choices">
            <h3 class="section-head">{labels.units}</h3>
            <template for:each={unitChoices} for:item="card">
              <div key={card.id} class={card.className} data-card={card.id}>
                <span class="n">{card.subject}</span>
                <span class="d"></span>
                <span class="options">
                  <lightning-combobox
                    class="pick"
                    label={card.title}
                    variant="label-hidden"
                    placeholder={card.placeholder}
                    value={card.value}
                    options={card.comboOptions}
                    data-id={card.id}
                    onchange={handleChoice}
                  ></lightning-combobox>
                </span>
              </div>
            </template>
          </section>
        </template>

        <template lwc:if={hasElectiveRows}>
          <!-- Electives read from the file (slice E9): what was read, and "Not electives". -->
          <section class="section" data-id="electives">
            <h3 class="section-head">{labels.electives}</h3>
            <template for:each={electiveRows} for:item="card">
              <div key={card.id} class={card.className} data-card={card.id}>
                <span class="n">{card.title}</span>
                <span class="d"
                  >{card.subtitle}<template lwc:if={card.detail}
                    >&nbsp;{card.detail}</template
                  ></span
                >
                <span class="options">
                  <template for:each={card.options} for:item="option">
                    <button
                      key={option.key}
                      type="button"
                      class={option.className}
                      aria-pressed={option.pressed}
                      title={option.description}
                      data-key={option.key}
                      onclick={handleAnswer}
                    >
                      {option.label}<template lwc:if={option.description}
                        ><span class="slds-assistive-text"
                          >. {option.description}</span
                        ></template
                      >
                    </button>
                  </template>
                  <template lwc:if={card.fromMemory}>
                    <span class="tag">{card.memoryNote}</span>
                  </template>
                </span>
              </div>
            </template>
          </section>
        </template>

        <template lwc:if={hasPlaces}>
          <section class="section" data-id="places">
            <h3 class="section-head">{labels.locations}</h3>
            <template for:each={places} for:item="place">
              <div
                key={place.id}
                class="row row_place shoresh-raised"
                data-place={place.id}
              >
                <span class="n">
                  <lightning-input
                    type="checkbox"
                    label={place.name}
                    checked={place.ticked}
                    data-id={place.id}
                    onchange={handlePlace}
                  ></lightning-input>
                </span>
                <span class="d">{place.usedByText}</span>
                <span class="options">
                  <template lwc:if={place.fromMemory}>
                    <span class="tag">{place.memoryNote}</span>
                  </template>
                </span>
              </div>
            </template>
          </section>
        </template>

        <template lwc:if={hasVersions}>
          <section class="section" data-id="version">
            <h3 class="section-head">Last year's schedule</h3>
            <template for:each={versionRows} for:item="version">
              <div key={version.key} class="version shoresh-raised">
                <div class="mini" style={version.miniStyle} aria-hidden="true">
                  <template for:each={version.mini} for:item="cell">
                    <i key={cell.key} class={cell.className}></i>
                  </template>
                </div>
                <div class="version-words">
                  <b>{version.weekName}</b>
                  <span>{version.reviewLine}</span>
                </div>
              </div>
            </template>
          </section>
        </template>

        <template lwc:if={hasNotSetUp}>
          <section class="section" data-id="not-set-up">
            <h3 class="section-head">
              Not set up yet
              <span class="shoresh-num">{notSetUpCount}</span>
            </h3>
            <div class="chips">
              <template for:each={notedList} for:item="item">
                <span
                  key={item.key}
                  class="chip chip_dashed"
                  data-noted={item.key}
                  >{item.name}<span class="chip-detail"
                    >&nbsp;· {item.detail}</span
                  ></span
                >
              </template>
              <template for:each={deletedItems} for:item="item">
                <span key={item.key} class="chip" data-deleted={item.key}>
                  <span class="chip-detail"
                    >Deleted before: {item.name} · {item.detail}</span
                  >
                  <button
                    type="button"
                    class="shoresh-item bring-back"
                    aria-label={item.bringBackLabel}
                    data-key={item.key}
                    data-place-answer={item.place}
                    onclick={handleBringBack}
                  >
                    Bring back
                  </button>
                </span>
              </template>
            </div>
          </section>
        </template>

        <section class="section" data-id="files">
          <h3 class="section-head">
            Files <span class="shoresh-num">{fileRows.length}</span>
          </h3>
          <template for:each={fileRows} for:item="row">
            <div key={row.file} class={row.className} data-file={row.file}>
              <span class="n">{row.file}</span>
              <span class="d shoresh-num">{row.pageCount}</span>
              <span class="options">
                <lightning-combobox
                  class="pick pick_layout"
                  label={row.layoutLabel}
                  variant="label-hidden"
                  value={row.layout}
                  options={row.options}
                  data-file={row.file}
                  onchange={handleLayout}
                ></lightning-combobox>
              </span>
              <template lwc:if={row.unsure}>
                <span class="corner" role="img" aria-label="Layout unclear"
                  ><i class="shoresh-look-mark"></i
                ></span>
              </template>
            </div>
          </template>
        </section>

        <template lwc:if={hasNotes}>
          <section class="section" data-id="notes">
            <h3 class="section-head">Good to know</h3>
            <ul class="lines">
              <template for:each={notes} for:item="note">
                <li key={note.key} class="line">{note.text}</li>
              </template>
            </ul>
          </section>
        </template>
      </template>

      <!-- 3. Done: what was added, last year's schedule, and Undo on the rail -->
      <template lwc:if={isDone}>
        <template lwc:if={undone}>
          <p class="message" data-id="undone">{undone}</p>
        </template>
        <section class="section" data-id="added">
          <h3 class="section-head" tabindex="-1" data-id="done">
            Added <span class="shoresh-num">{addedTotal}</span>
          </h3>
          <div class="tiles">
            <template for:each={addedTiles} for:item="tile">
              <div
                key={tile.key}
                class="tile shoresh-raised"
                data-tile={tile.key}
              >
                <span class="slds-assistive-text">{tile.spoken}</span>
                <b class="shoresh-num" aria-hidden="true">{tile.count}</b>
                <span aria-hidden="true">{tile.label}</span>
              </div>
            </template>
          </div>
        </section>
        <template lwc:if={hasChanged}>
          <section class="section" data-id="changed">
            <h3 class="section-head">
              Changed, as you chose
              <span class="shoresh-num">{changedTotal}</span>
            </h3>
            <div class="tiles">
              <template for:each={changedTiles} for:item="tile">
                <div key={tile.key} class="tile shoresh-raised">
                  <span class="slds-assistive-text">{tile.spoken}</span>
                  <b class="shoresh-num" aria-hidden="true">{tile.count}</b>
                  <span aria-hidden="true">{tile.label}</span>
                </div>
              </template>
            </div>
          </section>
        </template>
        <template lwc:if={hasVersions}>
          <section class="section" data-id="version">
            <h3 class="section-head">Last year's schedule</h3>
            <template for:each={versionRows} for:item="version">
              <div key={version.key} class="version shoresh-raised">
                <div class="mini" style={version.miniStyle} aria-hidden="true">
                  <template for:each={version.mini} for:item="cell">
                    <i key={cell.key} class={cell.className}></i>
                  </template>
                </div>
                <div class="version-words">
                  <b>{version.name}</b>
                  <span>{version.doneLine}</span>
                </div>
                <span class="version-where">Open it on Saved versions</span>
              </div>
            </template>
          </section>
        </template>
        <template lwc:if={hasUnplaced}>
          <section class="section" data-id="unplaced">
            <h3 class="section-head">{unplacedTitle}</h3>
            <table class="unplaced" aria-label={unplacedTitle}>
              <thead>
                <tr>
                  <th scope="col">In the file</th>
                  <th scope="col">How many</th>
                  <th scope="col">Why</th>
                  <th scope="col">For example</th>
                </tr>
              </thead>
              <tbody>
                <template for:each={unplaced} for:item="line">
                  <tr key={line.key} data-unplaced={line.key}>
                    <th scope="row">{line.name}</th>
                    <td class="shoresh-num">{line.count}</td>
                    <td>{line.why}</td>
                    <td>{line.whereText}</td>
                  </tr>
                </template>
              </tbody>
            </table>
          </section>
        </template>
        <template lwc:if={hasRemoved}>
          <section class="section" data-id="removed">
            <h3 class="section-head">Removed, as you chose</h3>
            <div class="tiles">
              <template for:each={removedTiles} for:item="tile">
                <div key={tile.key} class="tile shoresh-raised">
                  <span class="slds-assistive-text">{tile.spoken}</span>
                  <b class="shoresh-num" aria-hidden="true">{tile.count}</b>
                  <span aria-hidden="true">{tile.label}</span>
                </div>
              </template>
            </div>
          </section>
        </template>
        <template lwc:if={hasLater}>
          <!-- review.md INGEST-5.5: kept for later; they wait on Roots. -->
          <section class="section" data-id="later">
            <h3 class="section-head">{laterTitle}</h3>
            <div class="chips">
              <template for:each={laterLines} for:item="line">
                <span key={line.key} class="chip">{line.text}</span>
              </template>
            </div>
          </section>
        </template>
        <template lwc:if={hasLeftOut}>
          <section class="section" data-id="left-out">
            <h3 class="section-head">
              Left out for now
              <span class="shoresh-num">{leftOutLines.length}</span>
            </h3>
            <div class="chips">
              <template for:each={leftOutLines} for:item="line">
                <span key={line.key} class="chip">{line.text}</span>
              </template>
            </div>
          </section>
        </template>
        <template lwc:if={hasDeleted}>
          <section class="section" data-id="deleted-summary">
            <h3 class="section-head">
              Deleted before; not brought back
              <span class="shoresh-num">{deletedItems.length}</span>
            </h3>
            <div class="chips">
              <template for:each={deletedItems} for:item="item">
                <span key={item.key} class="chip"
                  >{item.name}<span class="chip-detail"
                    >&nbsp;· {item.detail}</span
                  ></span
                >
              </template>
            </div>
          </section>
        </template>
        <template lwc:if={hasNoted}>
          <section class="section" data-id="noted">
            <h3 class="section-head">
              Not set up yet
              <span class="shoresh-num">{notedList.length}</span>
            </h3>
            <div class="chips">
              <template for:each={notedList} for:item="item">
                <span key={item.key} class="chip chip_dashed"
                  >{item.name}<span class="chip-detail"
                    >&nbsp;· {item.detail}</span
                  ></span
                >
              </template>
            </div>
          </section>
        </template>
        <template lwc:if={hasNotes}>
          <section class="section" data-id="notes">
            <h3 class="section-head">Good to know</h3>
            <ul class="lines">
              <template for:each={notes} for:item="note">
                <li key={note.key} class="line">{note.text}</li>
              </template>
            </ul>
          </section>
        </template>
      </template>
    </div>
  </div>
</template>
