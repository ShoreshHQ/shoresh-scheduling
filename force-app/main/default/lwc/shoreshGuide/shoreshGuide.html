<template>
  <!-- Getting started (CORE-6.17): a closed row; open, the first steps as the clicks themselves. -->
  <section class="guide" aria-labelledby="guide-title" data-id="guide">
    <h3 class="rail-title" id="guide-title">
      <button
        type="button"
        class="toggle"
        aria-expanded={expanded}
        aria-controls="guide-steps"
        data-id="guide-toggle"
        onclick={handleToggle}
      >
        <svg
          class={chevronClass}
          viewBox="0 0 16 16"
          width="12"
          height="12"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M6 3.5 10.5 8 6 12.5"></path>
        </svg>
        Getting started
      </button>
    </h3>
    <template lwc:if={open}>
      <ol class="steps" id="guide-steps" data-id="guide-steps">
        <template for:each={steps} for:item="step">
          <li key={step.key} class="step" data-step={step.key}>
            <span class="number shoresh-num" aria-hidden="true"
              >{step.number}</span
            >
            <div class="body">
              <div class="step-head">
                <h4 class="step-title">{step.title}</h4>
                <template lwc:if={step.who}>
                  <span class="who" data-id="who">{step.who}</span>
                </template>
              </div>
              <template for:each={step.paths} for:item="path">
                <p key={path.key} class="path" data-path={path.key}>
                  <template for:each={path.clicks} for:item="click">
                    <span key={click.key} class="click-wrap"
                      ><template lwc:if={click.after}
                        ><span class="arrow" aria-hidden="true">›</span
                        ><span class="slds-assistive-text">then</span></template
                      ><span class="click" data-click>{click.label}</span></span
                    >
                  </template>
                </p>
              </template>
              <template lwc:if={step.sample}>
                <div class="downloads">
                  <a
                    class="slds-button slds-button_neutral"
                    href={campUrl}
                    download={campFile}
                    data-id="download-sample-camp"
                  >
                    <lightning-icon
                      icon-name="utility:download"
                      size="x-small"
                      class="slds-button__icon_left"
                    ></lightning-icon>
                    {campFile}
                  </a>
                  <a
                    class="slds-button slds-button_neutral"
                    href={choicesUrl}
                    download={choicesFile}
                    data-id="download-sample-choices"
                  >
                    <lightning-icon
                      icon-name="utility:download"
                      size="x-small"
                      class="slds-button__icon_left"
                    ></lightning-icon>
                    {choicesFile}
                  </a>
                </div>
              </template>
            </div>
          </li>
        </template>
      </ol>
    </template>
  </section>
</template>
