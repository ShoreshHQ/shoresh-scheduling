<template>
  <template lwc:if={host}>
    <!-- The rail (the setup screens' grammar): the section's name and one action per kind of AI app -->
    <div class="rail" data-id="connect-ai">
      <h3 class="rail-title">Connect your AI</h3>
      <!-- Claude's desktop app: the extension, from this camp's own Salesforce (API-1.17) -->
      <a
        class="slds-button slds-button_neutral"
        href={extensionUrl}
        download="Shoresh.mcpb"
        data-id="download-extension"
        onclick={handleDownload}
      >
        <lightning-icon
          icon-name="utility:download"
          size="x-small"
          class="slds-button__icon_left"
        ></lightning-icon>
        Claude desktop
      </a>
      <!-- Any AI app that runs commands (Claude Code, Cursor and the like): the prompt (API-1.15) -->
      <lightning-button
        label={copyLabel}
        icon-name={copyIcon}
        data-id="copy-prompt"
        onclick={handleCopy}
      ></lightning-button>
    </div>
    <!-- How long a person's AI stays signed in: the camp admin's clicks in Salesforce (API-1.162) -->
    <div class="sign-in" data-id="ai-sign-in">
      <div class="sign-in-head">
        <h4 class="sign-in-title">AI sign-in</h4>
        <span class="who">Salesforce admin</span>
      </div>
      <template for:each={signInPaths} for:item="path">
        <p key={path.key} class="path" data-path={path.key}>
          <template for:each={path.clicks} for:item="click">
            <span key={click.key} class="click-wrap"
              ><template lwc:if={click.after}
                ><span class="arrow" aria-hidden="true">›</span
                ><span class="slds-assistive-text">then</span></template
              ><span class="click" data-click>{click.label}</span></span
            >
          </template>
        </p>
      </template>
    </div>
    <div class="shoresh-hairline" role="presentation"></div>
    <p class="slds-assistive-text" role="status" aria-live="polite">{said}</p>
    <template lwc:if={copyFailed}>
      <pre class="prompt" tabindex="0" data-id="prompt-text">{prompt}</pre>
    </template>
  </template>
</template>
