<template>
  <span class="wrap" onfocusout={handleLeave}>
    <button
      type="button"
      class="mark"
      aria-label={name}
      aria-expanded={expanded}
      data-id="guess-mark"
      onclick={handleToggle}
      onkeydown={handleKey}
    >
      <span class="shoresh-look-mark" aria-hidden="true"></span>
    </button>
    <template lwc:if={open}>
      <span
        class="shoresh-pop pop"
        role="group"
        aria-label={name}
        data-id="guess-pop"
        onkeydown={handleKey}
      >
        <span class="words" data-id="guess-words">{label}</span>
        <template lwc:if={canConfirm}>
          <button
            type="button"
            class="shoresh-pop-row looks-right"
            data-id="looks-right"
            disabled={busy}
            onclick={handleConfirm}
          >
            Looks right
          </button>
        </template>
      </span>
    </template>
  </span>
</template>
