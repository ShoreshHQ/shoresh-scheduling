<template>
  <!-- The living dot field behind Roots (ADR 0015 choice 13): decoration only. -->
  <c-shoresh-dot-field>
    <div class="roots" data-id="roots">
      <h2 class="roots-title" tabindex="-1" data-heading>Roots</h2>

      <!-- The door to the schedules: both, side by side, never one picked for the director. -->
      <div
        class="roots-door"
        role="group"
        aria-labelledby="schedule-door-title"
        data-id="schedule-door"
      >
        <span id="schedule-door-title">Build or generate the schedule</span>
        <span class="roots-door-ways">
          <template for:each={scheduleDoors} for:item="door">
            <button
              key={door.screen}
              type="button"
              class="roots-door-way"
              data-screen={door.screen}
              onclick={handleOpen}
            >
              <span>{door.label}</span>
              <span aria-hidden="true">→</span>
            </button>
          </template>
        </span>
      </div>

      <div class="roots-layout">
        <div class="roots-main">
          <section class="slds-m-top_large">
            <div class="roots-section-label">What has taken root</div>
            <div class="roots-bento">
              <template for:each={cards} for:item="card">
                <template lwc:if={card.coming}>
                  <div
                    key={card.key}
                    class={card.className}
                    data-card={card.key}
                  >
                    <div class="roots-card-header">
                      <span>{card.label}</span>
                      <span class="slds-badge">Coming</span>
                    </div>
                  </div>
                </template>
                <template lwc:else>
                  <button
                    key={card.key}
                    type="button"
                    class={card.className}
                    data-card={card.key}
                    data-screen={card.key}
                    onclick={handleOpen}
                  >
                    <span class="roots-card-header">
                      <span>{card.label}</span>
                      <span class={card.countClass} data-count={card.key}
                        >{card.count}</span
                      >
                    </span>
                    <template lwc:if={card.hasChips}>
                      <span class="roots-chips">
                        <template for:each={card.chips} for:item="chip">
                          <span key={chip.key} class="roots-chip"
                            >{chip.name}</span
                          >
                        </template>
                        <template lwc:if={card.more}>
                          <span class="roots-chip roots-chip_more"
                            >{card.more}</span
                          >
                        </template>
                      </span>
                    </template>
                  </button>
                </template>
              </template>
            </div>
          </section>

          <div class="roots-bottom">
            <template lwc:if={campIsEmpty}>
              <lightning-button
                data-id="import"
                data-screen="import"
                label="Import last year"
                variant="brand"
                onclick={handleOpen}
              ></lightning-button>
            </template>
            <lightning-button
              data-id="download-workbook"
              label="Download worksheet"
              icon-name="utility:download"
              disabled={downloading}
              onclick={handleDownloadWorkbook}
            ></lightning-button>
            <c-shoresh-list-import
              data-id="workbook-import"
              workbook
              setup={setup}
              terms={terms}
              onimported={handleImported}
            ></c-shoresh-list-import>
            <template lwc:if={campHasData}>
              <lightning-button
                data-id="import"
                data-screen="import"
                label="Re-import last year"
                variant="base"
                onclick={handleOpen}
              ></lightning-button>
            </template>
            <template lwc:if={lastImport}>
              <div class="roots-last-import" data-id="last-import">
                <span>{lastImport.line}</span>
                <span class="roots-weak"
                  >Undo removes what this import added and puts back what it
                  changed. Anything you have edited since stays as it is.</span
                >
                <lightning-button
                  data-id="undo-import"
                  label="Undo last import"
                  onclick={handleUndoImport}
                ></lightning-button>
              </div>
            </template>
          </div>
        </div>

        <aside class="roots-rail" aria-label="Needs your attention">
          <div class="roots-section-label slds-m-top_large">
            Needs your attention
          </div>
          <template lwc:if={hasAttention}>
            <template for:each={attention} for:item="row">
              <button
                key={row.key}
                type="button"
                class="roots-attention-row"
                data-screen={row.screen}
                data-attention={row.key}
                aria-label={row.ariaLabel}
                onclick={handleOpen}
              >
                <span class="roots-attention-name">{row.name}</span>
                <span class="roots-tag">{row.tag}</span>
                <span class="roots-attention-why">{row.why}</span>
              </button>
            </template>
          </template>
          <template lwc:else>
            <div class="roots-all-clear" data-id="all-clear">
              <lightning-icon
                icon-name="utility:success"
                size="small"
                variant="success"
                alternative-text=""
              ></lightning-icon>
              <div class="slds-m-top_x-small">All clear</div>
            </div>
          </template>
        </aside>
      </div>
    </div>
  </c-shoresh-dot-field>
</template>
