<template>
  <div class="roots" data-id="roots">
    <h2 class="slds-assistive-text" tabindex="-1" data-heading>Roots</h2>

    <div class="roots-body" data-id="body">
      <!-- The table: the three melds on the living dot field (ADR 0015 choice 13, ADR 0020).
           The cards and labels cover the dots with their own surfaces. -->
      <c-shoresh-dot-field class="table-field" data-id="field" solid>
        <div class="table" data-id="table">
          <template for:each={melds} for:item="meld">
            <div
              key={meld.key}
              class="meld"
              role="group"
              aria-label={meld.title}
              data-meld={meld.key}
              onpointerover={handleMeldOver}
              onpointerout={handleMeldOut}
              onfocusin={handleMeldFocusIn}
              onfocusout={handleMeldFocusOut}
              onkeydown={handleMeldKeydown}
            >
              <div class="spread" data-spread></div>
              <template lwc:if={meld.door}>
                <!-- The Schedules title is a doorway, as in the menu (wiki decision 61). -->
                <button
                  type="button"
                  class="mlabel mlabel_door"
                  data-label
                  data-screen={meld.door}
                  onclick={handleOpen}
                >
                  {meld.title}
                </button>
              </template>
              <template lwc:else>
                <div class="mlabel" data-label aria-hidden="true">
                  {meld.title}
                </div>
              </template>
              <template for:each={meld.cards} for:item="card">
                <button
                  key={card.key}
                  type="button"
                  class="card"
                  data-card={card.key}
                  aria-label={card.label}
                  onclick={handleCardClick}
                >
                  <span class="face" data-id="face">
                    <span class="name"
                      ><span class="name-text">{card.label}</span
                      ><template lwc:if={card.small}
                        ><small class="shoresh-num"
                          >{card.small}</small
                        ></template
                      ></span
                    >
                    <span class="glimpse">
                      <c-shoresh-roots-glimpse
                        glimpse={card.glimpse}
                      ></c-shoresh-roots-glimpse>
                    </span>
                  </span>
                </button>
              </template>
            </div>
          </template>
        </div>
      </c-shoresh-dot-field>

      <!-- The hand (slice R2, repo ADR 0020 choice 10): what needs a look, fanned along the
           bottom; an empty hand while all is calm. -->
      <c-shoresh-roots-hand
        cards={hand}
        play-to={playTo}
        onopen={handleHandOpen}
        onlanded={handleLanded}
        onleftfocus={handleLeftFocus}
      ></c-shoresh-roots-hand>

      <!-- The camp's workbook: secondary actions in a bar along the bottom (decision 28C). -->
      <div class="shoresh-hairline" role="presentation"></div>
      <div class="tools" data-id="tools">
        <template lwc:if={campIsEmpty}>
          <lightning-button
            data-id="import"
            data-screen="import"
            label="Import last year"
            variant="brand"
            onclick={handleOpen}
          ></lightning-button>
        </template>
        <lightning-button
          data-id="download-workbook"
          label="Download worksheet"
          icon-name="utility:download"
          disabled={downloading}
          onclick={handleDownloadWorkbook}
        ></lightning-button>
        <c-shoresh-list-import
          data-id="workbook-import"
          workbook
          setup={setup}
          terms={terms}
          onimported={handleImported}
        ></c-shoresh-list-import>
        <template lwc:if={campHasData}>
          <lightning-button
            data-id="import"
            data-screen="import"
            label="Re-import last year"
            variant="base"
            onclick={handleOpen}
          ></lightning-button>
        </template>
        <template lwc:if={lastImport}>
          <!-- As the desktop's LastImportUndo: the words on the left, Undo on their right; one
               quiet row beside the buttons (the file cut short with an ellipsis rather than the
               bar growing), so table, hand and bar share a laptop's window. What Undo does is
               said in its confirmation (the page's), and here to a screen reader. -->
          <div class="last-import" data-id="last-import">
            <div class="last-words" title={lastImport.line}>
              <div class="last-what">{lastImport.what}</div>
              <div class="weak last-when">{lastImport.when}</div>
              <span class="slds-assistive-text">
                Undo removes what this import added and puts back what it
                changed. Anything you have edited since stays as it is.
              </span>
            </div>
            <template lwc:if={lastImport.open}>
              <lightning-button
                data-id="import-questions"
                label={lastImport.openLabel}
                onclick={handleOpenQuestions}
              ></lightning-button>
            </template>
            <lightning-button
              data-id="undo-import"
              label="Undo last import"
              onclick={handleUndoImport}
            ></lightning-button>
          </div>
        </template>
      </div>
    </div>

    <!-- The sheet a screen grows out of (the page drives it): it wears the card's face, which
         gives way to the screen as it grows. For the eye only. -->
    <div
      class="sheet-shade"
      data-id="sheet-shade"
      aria-hidden="true"
      hidden
    ></div>
    <div class="sheet" data-id="sheet" aria-hidden="true" hidden>
      <div class="sheet-shelf" data-id="sheet-shelf"></div>
      <template lwc:if={travelHand}>
        <div class="ghost hghost" data-id="ghost">
          <c-shoresh-roots-hand-face
            class="hface"
            card={travelHand}
          ></c-shoresh-roots-hand-face>
        </div>
      </template>
      <template lwc:if={travelCard}>
        <div class="ghost card" data-id="ghost" data-pic={travelPic}>
          <span class="face">
            <span class="name"
              ><span class="name-text">{travelCard.label}</span
              ><template lwc:if={travelCard.small}
                ><small class="shoresh-num">{travelCard.small}</small></template
              ></span
            >
            <span class="glimpse">
              <c-shoresh-roots-glimpse
                glimpse={travelCard.glimpse}
              ></c-shoresh-roots-glimpse>
            </span>
          </span>
        </div>
      </template>
    </div>
  </div>
</template>
