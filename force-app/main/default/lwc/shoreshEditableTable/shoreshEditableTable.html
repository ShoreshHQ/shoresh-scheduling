<template>
  <template lwc:if={unknownObject}>
    <article
      class="slds-card slds-card_boundary slds-m-bottom_medium"
      data-id="unknown-object"
      role="alert"
    >
      <div class="slds-card__body slds-card__body_inner slds-media">
        <lightning-icon
          class="slds-media__figure"
          icon-name="utility:error"
          variant="error"
          size="small"
          alternative-text=""
        ></lightning-icon>
        <div class="slds-media__body">
          <h3 class="slds-text-heading_small">{title}</h3>
          <p>This table can't be shown. Please tell Shoresh support.</p>
        </div>
      </div>
    </article>
  </template>
  <div lwc:else class={sectionClass}>
    <!-- The column names, shown once above the first section (and its heading); the table
         below reads them out with every cell, so this copy is for the eye only. -->
    <template lwc:if={showColumns}>
      <table
        class="list list_head"
        style={tableStyle}
        aria-hidden="true"
        data-id="column-names"
      >
        <colgroup>
          <template for:each={cols} for:item="col">
            <col key={col.key} style={col.style} />
          </template>
        </colgroup>
        <thead>
          <tr>
            <template for:each={headers} for:item="col">
              <th key={col.key} class={col.className}>
                <span class="head-text">{col.label}</span>
              </th>
            </template>
          </tr>
        </thead>
      </table>
    </template>
    <!-- A section's heading (a division, a type) with its count; without one, the table's name
         is read out only: the menu and the rail already say which list this is. -->
    <template lwc:if={heading}>
      <h3 class="section-head" data-id="section-head">
        <span class="section-name">{heading}</span
        ><span class="slds-assistive-text">, </span>
        <span class="section-count shoresh-num" data-id="section-count"
          >{shownCount}</span
        >
      </h3>
    </template>
    <template lwc:else>
      <h3 class="slds-assistive-text">{title}</h3>
    </template>
    <div class="scroll">
      <table class="list" style={tableStyle} aria-label={title}>
        <colgroup>
          <template for:each={cols} for:item="col">
            <col key={col.key} style={col.style} />
          </template>
        </colgroup>
        <thead class="head head_hidden">
          <tr>
            <template for:each={headers} for:item="col">
              <th
                key={col.key}
                scope="col"
                class={col.className}
                data-id={col.dataId}
              >
                <span class="head-text" title={col.label}>{col.label}</span>
              </th>
            </template>
          </tr>
        </thead>
        <tbody>
          <template for:each={bodyRows} for:item="row">
            <template lwc:if={row.isEmptyState}>
              <tr key={row.key} data-id="empty">
                <td colspan={fullSpan} data-id="none-shown">
                  <c-shoresh-empty-state
                    title={row.message}
                  ></c-shoresh-empty-state>
                </td>
              </tr>
            </template>
            <template lwc:else>
              <tr
                key={row.key}
                class={row.rowClass}
                data-row={row.key}
                onkeydown={handleRowKeyDown}
                onfocusout={handleRowLeave}
              >
                <template for:each={row.cells} for:item="cell">
                  <td key={cell.key} class={cell.className}>
                    <template lwc:if={cell.isText}>
                      <div class="cell-line">
                        <template lwc:if={cell.isAddName}>
                          <svg
                            class="plus"
                            viewBox="0 0 16 16"
                            aria-hidden="true"
                          >
                            <path d="M8 3.5v9M3.5 8h9"></path>
                          </svg>
                        </template>
                        <lightning-input
                          class="grow"
                          type="text"
                          label={cell.label}
                          variant="label-hidden"
                          value={cell.value}
                          placeholder={cell.placeholder}
                          required={cell.required}
                          data-row-key={row.key}
                          data-field={cell.fieldName}
                          disabled={cell.disabled}
                          onchange={handleChange}
                        ></lightning-input>
                        <template lwc:if={cell.sameName}>
                          <c-shoresh-dot
                            class="flag"
                            data-id="same-name"
                            label="Same name as another"
                            focusable
                          ></c-shoresh-dot>
                        </template>
                        <template lwc:if={cell.canMerge}>
                          <button
                            type="button"
                            class="shoresh-item merge"
                            aria-label={cell.mergeName}
                            data-id="merge"
                            data-row-key={row.key}
                            onclick={handleMerge}
                            disabled={busy}
                          >
                            {cell.mergeLabel}
                          </button>
                        </template>
                        <template lwc:if={cell.overlaps}>
                          <c-shoresh-dot
                            class="flag"
                            data-id="overlaps"
                            shape="overlap"
                            label={cell.overlapLabel}
                            focusable
                          ></c-shoresh-dot>
                        </template>
                      </div>
                    </template>
                    <template lwc:elseif={cell.isOften}>
                      <!-- How often: bars at rest; the two numbers in their place under the
                           pointer or while the row is edited (decision 42). -->
                      <div class={cell.oftenClass}>
                        <template lwc:if={cell.showBars}>
                          <span
                            class="bars rest"
                            role="img"
                            aria-label={cell.oftenName}
                            data-id="often-bars"
                          >
                            <template for:each={cell.bars} for:item="bar">
                              <i key={bar.key} class={bar.className}></i>
                            </template>
                          </span>
                        </template>
                        <span class="often-fields">
                          <lightning-input
                            type="number"
                            label={cell.minLabel}
                            variant="label-hidden"
                            value={cell.value}
                            required={cell.required}
                            min={cell.min}
                            step="1"
                            data-row-key={row.key}
                            data-field={cell.fieldName}
                            disabled={cell.disabled}
                            onchange={handleChange}
                          ></lightning-input>
                          <span class="often-dash" aria-hidden="true">–</span>
                          <lightning-input
                            type="number"
                            label={cell.maxLabel}
                            variant="label-hidden"
                            value={cell.maxValue}
                            min={cell.min}
                            step="1"
                            data-row-key={row.key}
                            data-field={cell.maxField}
                            disabled={cell.disabled}
                            onchange={handleChange}
                          ></lightning-input>
                        </span>
                      </div>
                    </template>
                    <template lwc:elseif={cell.isDays}>
                      <!-- Days: the rule quiet, an exception a value; the ticks in their place
                           under the pointer or while the row is edited. -->
                      <span class={cell.daysTextClass} data-id="days-text"
                        >{cell.daysText}</span
                      >
                      <span
                        class="strip"
                        role="group"
                        aria-label={cell.daysName}
                        data-id="day-strip"
                      >
                        <template for:each={cell.dayCells} for:item="day">
                          <label key={day.key} class="chip">
                            <input
                              type="checkbox"
                              class="chip-box"
                              aria-label={day.label}
                              checked={day.checked}
                              data-row-key={row.key}
                              data-field={day.fieldName}
                              disabled={day.disabled}
                              onchange={handleChange}
                            />
                            <span
                              class="chip-face chip-face_day"
                              aria-hidden="true"
                              >{day.short}</span
                            >
                          </label>
                        </template>
                      </span>
                    </template>
                    <template lwc:elseif={cell.isNumber}>
                      <lightning-input
                        type="number"
                        label={cell.label}
                        variant="label-hidden"
                        value={cell.value}
                        required={cell.required}
                        min={cell.min}
                        step="1"
                        data-row-key={row.key}
                        data-field={cell.fieldName}
                        disabled={cell.disabled}
                        onchange={handleChange}
                      ></lightning-input>
                    </template>
                    <template lwc:elseif={cell.isDate}>
                      <lightning-input
                        class="shoresh-date"
                        type="date"
                        label={cell.label}
                        variant="label-hidden"
                        value={cell.value}
                        required={cell.required}
                        data-row-key={row.key}
                        data-field={cell.fieldName}
                        disabled={cell.disabled}
                        onchange={handleChange}
                      ></lightning-input>
                    </template>
                    <template lwc:elseif={cell.isTime}>
                      <lightning-input
                        type="time"
                        label={cell.label}
                        variant="label-hidden"
                        value={cell.value}
                        required={cell.required}
                        data-row-key={row.key}
                        data-field={cell.fieldName}
                        disabled={cell.disabled}
                        onchange={handleChange}
                      ></lightning-input>
                    </template>
                    <template lwc:elseif={cell.isCheckbox}>
                      <lightning-input
                        type="checkbox"
                        label={cell.label}
                        variant="label-hidden"
                        checked={cell.checked}
                        data-row-key={row.key}
                        data-field={cell.fieldName}
                        disabled={cell.disabled}
                        onchange={handleChange}
                      ></lightning-input>
                    </template>
                    <template lwc:elseif={cell.isWho}>
                      <div class="cell-line">
                        <span class={cell.whoClass} data-id="who">
                          {cell.whoSummary}
                        </span>
                        <button
                          type="button"
                          class="shoresh-item who-change"
                          aria-label={cell.whoName}
                          data-row-key={row.key}
                          data-field="who"
                          data-id="who-toggle"
                          disabled={row.locked}
                          onclick={handleWhoToggle}
                        >
                          {cell.whoButton}
                        </button>
                      </div>
                    </template>
                    <template lwc:elseif={cell.isPicklist}>
                      <lightning-combobox
                        label={cell.label}
                        variant="label-hidden"
                        value={cell.value}
                        placeholder={cell.pickPlaceholder}
                        options={cell.options}
                        required={cell.required}
                        data-row-key={row.key}
                        data-field={cell.fieldName}
                        disabled={cell.disabled}
                        onchange={handleChange}
                      ></lightning-combobox>
                    </template>
                    <template lwc:elseif={cell.isFixed}>
                      <span class="fixed" data-id="fixed"
                        >{cell.fixedText}</span
                      >
                    </template>
                    <template lwc:elseif={cell.isReadonly}>
                      <span
                        class={cell.fixedClass}
                        data-id="readonly"
                        data-column={cell.fieldName}
                        title={cell.fixedText}
                        >{cell.fixedText}</span
                      >
                    </template>
                  </td>
                </template>
                <template lwc:if={hasWeeks}>
                  <!-- Weeks: the exception in words at rest ("Every week", "Off Wk 3"); under
                       the pointer or while the row is being edited, a fine strip of the weeks,
                       one tick each, in their place. -->
                  <td class="cell cell_weeks" data-id="weeks">
                    <span class={row.weeksTextClass} data-id="weeks-text"
                      >{row.weeksText}</span
                    >
                    <span
                      class="strip"
                      role="group"
                      aria-label={row.weeksName}
                      data-id="week-strip"
                    >
                      <template for:each={row.weekCells} for:item="cell">
                        <label key={cell.key} class="chip">
                          <input
                            type="checkbox"
                            class="chip-box"
                            aria-label={cell.label}
                            checked={cell.checked}
                            data-row-key={row.key}
                            data-week={cell.weekId}
                            disabled={row.locked}
                            onchange={handleTick}
                          />
                          <span class="chip-face shoresh-num" aria-hidden="true"
                            >{cell.number}</span
                          >
                        </label>
                      </template>
                    </span>
                  </td>
                </template>
                <template lwc:if={hasNotes}>
                  <td class="cell cell_note" data-id="note">
                    {row.note}
                    <template for:each={row.actions} for:item="action">
                      <lightning-button
                        key={action.key}
                        class="slds-m-left_x-small"
                        variant="base"
                        label={action.label}
                        data-row-key={row.key}
                        data-action={action.name}
                        data-id="row-action"
                        onclick={handleRowAction}
                        disabled={busy}
                      ></lightning-button>
                    </template>
                  </td>
                </template>
                <td class="cell cell_end">
                  <template lwc:if={row.isNew}>
                    <button
                      type="button"
                      class="shoresh-item add"
                      aria-label={addName}
                      title={addLabel}
                      data-id="add"
                      onclick={handleAdd}
                      disabled={addDisabled}
                    >
                      {addText}
                    </button>
                  </template>
                  <template lwc:else>
                    <template lwc:if={row.notSaved}>
                      <span class="slds-assistive-text" data-id="not-saved"
                        >Not saved</span
                      >
                    </template>
                    <span class="tools">
                      <lightning-button-icon
                        icon-name="utility:delete"
                        alternative-text={row.deleteLabel}
                        title={row.deleteLabel}
                        variant="bare"
                        data-id="delete"
                        data-row-key={row.key}
                        onclick={handleDelete}
                        disabled={busy}
                      ></lightning-button-icon>
                      <template lwc:if={row.hasMore}>
                        <button
                          type="button"
                          class="shoresh-item shoresh-item_icon more"
                          aria-label={row.moreName}
                          title={row.moreName}
                          aria-expanded={row.moreOpenText}
                          data-id="more"
                          data-row-key={row.key}
                          onclick={handleMoreToggle}
                        >
                          <svg
                            class={row.moreGlyphClass}
                            viewBox="0 0 16 16"
                            aria-hidden="true"
                          >
                            <path d="m6 4 4 4-4 4"></path>
                          </svg>
                        </button>
                      </template>
                      <!-- Its details beside the table (Activities): the same chevron, the
                           page opens them. -->
                      <template lwc:if={row.hasDetails}>
                        <button
                          type="button"
                          class="shoresh-item shoresh-item_icon more"
                          aria-label={row.detailsName}
                          title={row.detailsName}
                          aria-expanded={row.detailsOpen}
                          data-id="details"
                          data-row-key={row.key}
                          onclick={handleDetails}
                        >
                          <svg
                            class={row.detailsGlyphClass}
                            viewBox="0 0 16 16"
                            aria-hidden="true"
                          >
                            <path d="m6 4 4 4-4 4"></path>
                          </svg>
                        </button>
                      </template>
                    </span>
                  </template>
                </td>
              </tr>
              <!-- The row's details, opened from its end: the fields that are not columns
                   (a group's division, a place's type and notes). Saved as the row is. -->
              <template lwc:if={row.moreOpen}>
                <tr
                  key={row.moreKey}
                  class="extra"
                  data-row={row.key}
                  data-more-row={row.key}
                  onkeydown={handleRowKeyDown}
                  onfocusout={handleRowLeave}
                >
                  <td colspan={fullSpan}>
                    <div class="more-fields" data-id="more-fields">
                      <template for:each={row.moreCells} for:item="cell">
                        <div key={cell.key} class={cell.className}>
                          <template lwc:if={cell.isPicklist}>
                            <lightning-combobox
                              label={cell.label}
                              value={cell.value}
                              options={cell.options}
                              required={cell.required}
                              data-row-key={row.key}
                              data-field={cell.fieldName}
                              disabled={cell.disabled}
                              onchange={handleChange}
                            ></lightning-combobox>
                          </template>
                          <template lwc:elseif={cell.isNumber}>
                            <lightning-input
                              type="number"
                              label={cell.label}
                              value={cell.value}
                              required={cell.required}
                              min={cell.min}
                              step="1"
                              data-row-key={row.key}
                              data-field={cell.fieldName}
                              disabled={cell.disabled}
                              onchange={handleChange}
                            ></lightning-input>
                          </template>
                          <template lwc:elseif={cell.isCheckbox}>
                            <lightning-input
                              type="checkbox"
                              label={cell.label}
                              checked={cell.checked}
                              data-row-key={row.key}
                              data-field={cell.fieldName}
                              disabled={cell.disabled}
                              onchange={handleChange}
                            ></lightning-input>
                          </template>
                          <template lwc:else>
                            <lightning-input
                              type="text"
                              label={cell.label}
                              value={cell.value}
                              required={cell.required}
                              data-row-key={row.key}
                              data-field={cell.fieldName}
                              disabled={cell.disabled}
                              onchange={handleChange}
                            ></lightning-input>
                          </template>
                        </div>
                      </template>
                    </div>
                  </td>
                </tr>
              </template>
              <template lwc:if={row.whoOpen}>
                <tr
                  key={row.whoKey}
                  class="extra"
                  data-row={row.key}
                  data-who-row={row.key}
                  onfocusout={handleRowLeave}
                >
                  <td colspan={fullSpan}>
                    <lightning-checkbox-group
                      data-row-key={row.key}
                      data-id="who-picker"
                      label={row.whoLabel}
                      options={row.whoOptions}
                      value={row.who}
                      onchange={handleWhoChange}
                    ></lightning-checkbox-group>
                  </td>
                </tr>
              </template>
            </template>
          </template>
        </tbody>
      </table>
    </div>
    <div class="slds-assistive-text" aria-live="polite" data-id="announce">
      {announcement}
    </div>

    <!-- Someone else changed the row since it was shown (Manual Build's question) -->
    <template lwc:if={conflict}>
      <section
        role="dialog"
        aria-modal="true"
        aria-labelledby="conflict-title"
        class="slds-modal slds-fade-in-open"
        data-id="conflict"
        onkeydown={handleConflictKeyDown}
      >
        <div class="slds-modal__container">
          <div class="slds-modal__header">
            <h2 id="conflict-title" class="slds-modal__title">
              Changed by someone else
            </h2>
          </div>
          <div class="slds-modal__content slds-p-around_medium">
            <ul class="conflict-rows">
              <template for:each={conflictRows} for:item="row">
                <li key={row.key} class="conflict-row" data-field={row.key}>
                  <p class="conflict-where">{row.where}</p>
                  <dl class="conflict-choices">
                    <dt>Theirs</dt>
                    <dd data-id="theirs">{row.theirs}</dd>
                    <dt>Yours</dt>
                    <dd data-id="yours">{row.yours}</dd>
                  </dl>
                </li>
              </template>
            </ul>
          </div>
          <div class="slds-modal__footer">
            <button
              type="button"
              class="slds-button slds-button_neutral"
              onclick={handleKeepTheirs}
              data-id="keep-theirs"
            >
              Keep theirs
            </button>
            <button
              type="button"
              class="slds-button slds-button_brand"
              onclick={handleUseYours}
              data-id="use-yours"
            >
              Use yours
            </button>
          </div>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
  </div>
</template>
