<template>
  <div class="frame-scroll">
    <div
      class="frame"
      role={frameRole}
      aria-label={label}
      aria-rowcount={rowCount}
      aria-colcount={colCount}
      style={frameStyle}
      data-id="schedule-grid"
      onfocusin={handleFocusIn}
      onfocusout={handleFocusOut}
      onkeydown={handleKeyDown}
      ondblclick={handleDoubleClick}
      onclick={handleClick}
      ondragstart={handleDragStart}
      ondragover={handleDragOver}
      ondrop={handleDrop}
    >
      <div class="grid grid_header" role="rowgroup" style={columnTemplate}>
        <div role="row" class="row" aria-rowindex="1">
          <div
            role="columnheader"
            aria-colindex="1"
            class="head row-head"
            style="grid-row: 1 / span 1; grid-column: 1 / span 1"
          >
            {corner}
          </div>
          <template for:each={columns} for:item="column">
            <div
              key={column.key}
              role="columnheader"
              aria-colindex={column.colIndex}
              class="head"
              style={column.style}
              data-column={column.key}
            >
              <span>{column.label}</span>
              <template lwc:if={column.sub}>
                <span class="head-sub">{column.sub}</span>
              </template>
              <template lwc:if={column.note}>
                <span class="note">{column.note}</span>
              </template>
            </div>
          </template>
        </div>
      </div>
      <div class="grid grid_body" role="rowgroup" style={bodyStyle}>
        <template for:each={bodyRows} for:item="row">
          <div
            key={row.key}
            role="row"
            class="row"
            aria-rowindex={row.rowIndex}
          >
            <div
              role="rowheader"
              aria-colindex="1"
              class="row-head block"
              style={row.style}
            >
              <span class="block-name">{row.name}</span>
              <template for:each={row.timeLines} for:item="line">
                <span key={line.key} class="block-time">{line.text}</span>
              </template>
              <template lwc:if={row.gone}>
                <span class="note">deleted since</span>
              </template>
            </div>
            <template for:each={row.cells} for:item="cell">
              <div
                key={cell.key}
                role={cell.role}
                tabindex={cell.tabIndex}
                aria-readonly={cell.ariaReadOnly}
                draggable={cell.draggable}
                aria-selected={cell.ariaSelected}
                aria-colindex={cell.colIndex}
                aria-rowspan={cell.rowSpan}
                class={cell.className}
                style={cell.style}
                title={cell.title}
                data-cell={cell.key}
              >
                <div class="cell-inner">
                  <template lwc:if={cell.names}>
                    <template for:each={cell.names} for:item="name">
                      <span key={name.key} class="cell-group">{name.name}</span>
                    </template>
                  </template>
                  <template lwc:else>
                    <span class="cell-name">{cell.text}</span>
                    <template lwc:if={cell.note}>
                      <span class="note">{cell.note}</span>
                    </template>
                  </template>
                  <template lwc:if={cell.locked}>
                    <span class="cell-lock"
                      ><lightning-icon
                        icon-name="utility:lock"
                        size="xx-small"
                        alternative-text={cell.lockText}
                        title={cell.lockText}
                      ></lightning-icon
                    ></span>
                  </template>
                  <template lwc:if={cell.dot}>
                    <span class="cell-dot"
                      ><c-shoresh-dot
                        label={cell.dot}
                        open={cell.dotOpen}
                        in-cell
                      ></c-shoresh-dot
                    ></span>
                  </template>
                  <template lwc:if={cell.handle}>
                    <span class="handle" data-handle="true" aria-hidden="true">
                      <span
                        class="handle-bar"
                        draggable="true"
                        data-handle-bar="true"
                      ></span>
                    </span>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </template>
      </div>
    </div>
  </div>
</template>
