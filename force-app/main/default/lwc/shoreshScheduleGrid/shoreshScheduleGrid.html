<template>
  <div class="frame-scroll">
    <div
      class="frame"
      role={frameRole}
      aria-multiselectable={multiSelectable}
      aria-label={label}
      aria-rowcount={rowCount}
      aria-colcount={colCount}
      style={frameStyle}
      data-id="schedule-grid"
      onfocusin={handleFocusIn}
      onfocusout={handleFocusOut}
      onkeydown={handleKeyDown}
      ondblclick={handleDoubleClick}
      onclick={handleClick}
      onpointerover={handlePointerOver}
      onpointerleave={handlePointerLeave}
      onpointerdown={handlePointerDown}
      onpointermove={handlePointerMove}
      onpointerup={handlePointerUp}
      onpointercancel={handlePointerCancel}
      ondragstart={handleDragStart}
      ondragover={handleDragOver}
      ondrop={handleDrop}
    >
      <div class="grid grid_header" role="rowgroup" style={columnTemplate}>
        <div role="row" class="row" aria-rowindex="1">
          <div
            role="columnheader"
            aria-colindex="1"
            class="head corner"
            style="grid-row: 1 / span 1; grid-column: 1 / span 1"
          >
            <span class="slds-assistive-text">{corner}</span>
          </div>
          <template for:each={columns} for:item="column">
            <div
              key={column.key}
              role="columnheader"
              aria-colindex={column.colIndex}
              class="head"
              style={column.style}
              data-column={column.key}
            >
              <span class={column.labelClass}>{column.label}</span>
              <template lwc:if={column.sub}>
                <span class="slds-assistive-text">, {column.sub}</span>
              </template>
              <template lwc:if={column.note}>
                <span class="slds-assistive-text"> {column.note}</span>
              </template>
            </div>
          </template>
        </div>
      </div>
      <div class="grid grid_body" role="rowgroup" style={bodyStyle}>
        <template for:each={bodyRows} for:item="row">
          <div
            key={row.key}
            role="row"
            class="row"
            aria-rowindex={row.rowIndex}
          >
            <div
              role="rowheader"
              aria-colindex="1"
              class={row.headClass}
              style={row.style}
            >
              <span class="block-time" aria-hidden="true">{row.time}</span>
              <span class="slds-assistive-text">{row.said}</span>
            </div>
            <template for:each={row.cells} for:item="cell">
              <div
                key={cell.key}
                role={cell.role}
                tabindex={cell.tabIndex}
                aria-readonly={cell.ariaReadOnly}
                draggable={cell.draggable}
                aria-selected={cell.ariaSelected}
                aria-colindex={cell.colIndex}
                aria-rowspan={cell.rowSpan}
                aria-colspan={cell.colSpan}
                class={cell.className}
                style={cell.style}
                title={cell.title}
                data-cell={cell.key}
                data-ghost={cell.ghost}
              >
                <div class="cell-inner">
                  <template lwc:if={cell.names}>
                    <template for:each={cell.names} for:item="name">
                      <span key={name.key} class="cell-group">{name.name}</span>
                    </template>
                  </template>
                  <template lwc:else>
                    <template lwc:if={cell.locked}>
                      <!-- The director's Lock: the padlock in the cell's bottom-right corner (the
                           top-right is the look corner, the left the special event flag). First
                           in the cell, so a screen reader still hears "Locked" before the name. -->
                      <span class="cell-lock" title={cell.lockText}
                        ><c-shoresh-lock></c-shoresh-lock
                        ><span class="slds-assistive-text" data-id="lock-words"
                          >{cell.lockText}</span
                        ></span
                      >
                    </template>
                    <template lwc:elseif={cell.setTimeLock}>
                      <span class="set-lock" aria-hidden="true"
                        ><svg
                          class="lock"
                          viewBox="0 0 12 12"
                          focusable="false"
                        >
                          <rect
                            x="2.25"
                            y="5.25"
                            width="7.5"
                            height="5.5"
                            rx="1.5"
                          ></rect>
                          <path d="M4 5.25V3.75a2 2 0 0 1 4 0v1.5"></path></svg
                      ></span>
                    </template>
                    <template lwc:if={cell.quiet}>
                      <span class="slds-assistive-text cell-name"
                        >{cell.text}</span
                      >
                    </template>
                    <template lwc:elseif={cell.flag}>
                      <span class="event-name"
                        ><svg
                          class="flag"
                          viewBox="0 0 12 12"
                          aria-hidden="true"
                          focusable="false"
                        >
                          <path d="M3 10.5V1.75"></path>
                          <path d="M3 2h6l-1.5 2.25L9 6.5H3"></path></svg
                        ><span class={cell.nameClass}>{cell.text}</span></span
                      >
                      <template lwc:if={cell.where}>
                        <span class="event-where">{cell.where}</span>
                      </template>
                    </template>
                    <template lwc:elseif={cell.setMark}>
                      <!-- An elective set (decision 53.2; mock-up electives-r1 grid-a): its mark
                           before the name, "Chugim (4)". -->
                      <span class="event-name"
                        ><svg
                          class="flag"
                          viewBox="0 0 12 12"
                          aria-hidden="true"
                          focusable="false"
                        >
                          <path d="M6 11V6.5"></path>
                          <path d="M6 6.5 2.5 2.5"></path>
                          <path d="M6 6.5l3.5-4"></path>
                          <path d="M2.5 5V2.5H5"></path>
                          <path d="M7 2.5h2.5V5"></path></svg
                        ><span class={cell.nameClass}>{cell.text}</span></span
                      >
                    </template>
                    <template lwc:else>
                      <span class={cell.nameClass}>{cell.text}</span>
                    </template>
                    <template lwc:if={cell.note}>
                      <span class="slds-assistive-text"> {cell.note}</span>
                    </template>
                  </template>
                  <template lwc:if={cell.dot}>
                    <span class="cell-dot"
                      ><c-shoresh-dot
                        label={cell.dot}
                        open={cell.dotOpen}
                        shape="corner"
                        in-cell
                      ></c-shoresh-dot
                    ></span>
                  </template>
                  <template lwc:if={cell.handle}>
                    <span class="handle" data-handle="true" aria-hidden="true">
                      <span class="handle-bar" data-handle-bar="true"></span>
                    </span>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </template>
      </div>
    </div>
    <template lwc:if={hasLegend}>
      <p class="legend" data-id="legend">
        <template for:each={legend} for:item="entry">
          <span key={entry.key} class="legend-entry"
            ><span class={entry.className} aria-hidden="true"></span
            >{entry.label}</span
          >
        </template>
      </p>
    </template>
  </div>
</template>
