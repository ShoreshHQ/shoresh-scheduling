<template>
  <button
    type="button"
    class={buttonClass}
    aria-haspopup={hasPopup}
    aria-expanded={expanded}
    aria-controls="pop"
    aria-label={alternativeText}
    disabled={disabled}
    onclick={handleToggle}
    onkeydown={handleButtonKey}
    data-id="button"
  >
    <template lwc:if={mark}>
      <span class="shoresh-look-mark mark" aria-hidden="true"></span>
    </template>
    <template lwc:if={hasCount}><b>{count}</b></template>
    <span>{label}</span>
    <template lwc:if={showChevron}>
      <svg class="shoresh-chevron" viewBox="0 0 12 12" aria-hidden="true">
        <path d="M3 4.5 6 7.5l3-3"></path>
      </svg>
    </template>
  </button>
  <div
    class={popClass}
    id="pop"
    role={popRole}
    aria-label={popLabel}
    hidden={closed}
    data-id="pop"
  >
    <slot></slot>
  </div>
</template>
