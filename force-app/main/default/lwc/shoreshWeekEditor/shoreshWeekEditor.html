<template>
  <div
    class="schedules"
    data-id="manual-build"
    onkeydown={handleKeyDown}
    ondragend={handleDragEnd}
  >
    <!-- The rail (docs/design/manual-build.html #b; ADR 0008 part 7): three zones. Left: the
         host's week and program, Edit, the host's own tools, then how to look at the week.
         Centre: the days (or bunks), over the grid's cells. Right: the counter, then Versions
         and Publish. One item grammar throughout. -->
    <div class="rail" data-id="rail">
      <div class="side side_left">
        <slot name="pickers"></slot>
        <template lwc:if={draft}>
          <span class="shoresh-rail-line" role="presentation"></span>
          <c-shoresh-rail-pop
            label="Edit"
            menu
            onselect={handleEditSelect}
            ontoggle={handleEditToggle}
            data-id="edit-menu"
          >
            <button
              type="button"
              role="menuitem"
              class="shoresh-pop-row"
              title={undoTitle}
              aria-label={undoTitle}
              aria-keyshortcuts={undoKeys}
              disabled={cannotUndo}
              onclick={handleUndo}
              data-id="undo"
            >
              <span>Undo</span>
              <span class="shoresh-pop-end" aria-hidden="true">{undoHint}</span>
            </button>
            <button
              type="button"
              role="menuitem"
              class="shoresh-pop-row"
              title={redoTitle}
              aria-label={redoTitle}
              aria-keyshortcuts={redoKeys}
              disabled={cannotRedo}
              onclick={handleRedo}
              data-id="redo"
            >
              <span>Redo</span>
              <span class="shoresh-pop-end" aria-hidden="true">{redoHint}</span>
            </button>
            <div class="shoresh-pop-divider" role="separator"></div>
            <button
              type="button"
              role="menuitem"
              class="shoresh-pop-row"
              aria-keyshortcuts={copyKeys}
              disabled={cannotCopy}
              onclick={handleCopyClick}
              data-id="copy"
            >
              <span>Copy</span>
              <span class="shoresh-pop-end" aria-hidden="true">{copyHint}</span>
            </button>
            <button
              type="button"
              role="menuitem"
              class="shoresh-pop-row"
              aria-keyshortcuts={pasteKeys}
              disabled={cannotPaste}
              onclick={handlePasteClick}
              data-id="paste"
            >
              <span>Paste</span>
              <span class="shoresh-pop-end" aria-hidden="true"
                >{pasteHint}</span
              >
            </button>
            <template for:each={editRows} for:item="row">
              <template lwc:if={row.divider}>
                <div
                  key={row.key}
                  class="shoresh-pop-divider"
                  role="separator"
                ></div>
              </template>
              <template lwc:elseif={row.group}>
                <button
                  key={row.key}
                  type="button"
                  role="menuitem"
                  class="shoresh-pop-row"
                  aria-expanded={row.expanded}
                  disabled={row.disabled}
                  onclick={handleEditGroup}
                  data-group={row.value}
                  data-id={row.dataId}
                >
                  <span>{row.label}</span>
                  <svg
                    class={row.chevronClass}
                    viewBox="0 0 12 12"
                    aria-hidden="true"
                  >
                    <path d="M3 4.5 6 7.5l3-3"></path>
                  </svg>
                </button>
              </template>
              <template lwc:else>
                <button
                  key={row.key}
                  type="button"
                  role="menuitem"
                  class={row.className}
                  disabled={row.disabled}
                  data-value={row.value}
                  data-id={row.dataId}
                >
                  {row.label}
                </button>
              </template>
            </template>
          </c-shoresh-rail-pop>
          <template lwc:if={showTools}>
            <slot name="tools"></slot>
          </template>
          <template lwc:if={showViews}>
            <div class="views">
              <span class="shoresh-rail-line" role="presentation"></span>
              <div class="group" role="group" aria-label="View">
                <template for:each={viewButtons} for:item="button">
                  <button
                    key={button.key}
                    type="button"
                    class={button.className}
                    aria-pressed={button.pressed}
                    data-view={button.key}
                    onclick={handleView}
                  >
                    {button.label}
                  </button>
                </template>
              </div>
              <span class="shoresh-rail-line" role="presentation"></span>
            </div>
          </template>
        </template>
      </div>
      <div class="mid">
        <template lwc:if={showDayPills}>
          <div
            class="group"
            role="group"
            aria-label={dayWord}
            data-id="day-pills"
          >
            <template for:each={dayPills} for:item="day">
              <button
                key={day.key}
                type="button"
                class={day.className}
                aria-pressed={day.pressed}
                aria-label={day.name}
                data-index={day.index}
                onclick={handleDay}
              >
                {day.short}<template lwc:if={day.special}
                  ><span class="pill-special"> · {day.special}</span></template
                >
              </button>
            </template>
          </div>
        </template>
        <template lwc:if={showGroupPills}>
          <div
            class="group group_scroll"
            role="group"
            aria-label={groupWord}
            data-id="group-pills"
          >
            <template for:each={groupPills} for:item="grp">
              <button
                key={grp.key}
                type="button"
                class={grp.className}
                aria-pressed={grp.pressed}
                data-key={grp.key}
                onclick={handleGroup}
              >
                {grp.name}<template lwc:if={grp.note}
                  ><span class="pill-sub"> {grp.note}</span></template
                >
              </button>
            </template>
          </div>
        </template>
      </div>
      <div class="side side_right">
        <!-- The counter is the week's: not on a day a special day replaces (decision 47.4). -->
        <template lwc:if={showChecks}>
          <slot name="checks"></slot>
        </template>
        <template lwc:if={draft}>
          <span class="shoresh-rail-line" role="presentation"></span>
        </template>
        <slot name="end"></slot>
      </div>
    </div>
    <div class="shoresh-hairline" role="presentation"></div>
    <!-- The grid's zone and the drawer's under it (docs/design/manual-build.html; ADR 0008
         part 8): on the same columns and as wide as each other, so each tile sits under its
         column; with many bunks they scroll sideways together. -->
    <div class="below">
      <div class="work" style={sheetStyle}>
        <template lwc:if={toolNoticeText}>
          <p class="notice" data-id="tool-notice">
            <span>{toolNoticeText} ·</span>
            <button
              type="button"
              class="slds-button tool-undo"
              data-id="tool-undo"
              aria-label={toolUndoLabel}
              onclick={handleToolUndo}
            >
              Undo
            </button>
          </p>
        </template>
        <template lwc:if={notice}>
          <p class="notice" data-id="notice">{notice}</p>
        </template>
        <!-- A cell noted from a file as a special event or day: one click sets it up. -->
        <template lwc:if={setUpOffer}>
          <p class="notice" data-id="set-up-offer">
            <span>{setUpOffer.text} ·</span>
            <button
              type="button"
              class="slds-button tool-undo"
              data-id="set-up"
              aria-label={setUpOffer.label}
              aria-disabled={settingUp}
              onmousedown={handleKeepFocus}
              onclick={handleSetUp}
            >
              Set it up
            </button>
          </p>
        </template>
        <slot name="status"></slot>

        <div class="slds-assistive-text" aria-live="polite" data-id="announce">
          {announcement}
        </div>

        <slot name="outcome"></slot>

        <template lwc:if={draft}>
          <template lwc:if={hasNoDays}>
            <c-shoresh-empty-state
              title={noDaysMessage}
              data-id="no-days"
            ></c-shoresh-empty-state>
          </template>
          <template lwc:else>
            <template lwc:if={isDaily}>
              <template lwc:if={replacedShown}>
                <!-- A day a special day replaces: its own schedule, read-only (decision 47.4). -->
                <template lwc:if={planShown}>
                  <c-shoresh-schedule-grid
                    data-id="special-day-grid"
                    grid={planShown}
                    corner={corner}
                    label={replacedShown.name}
                  ></c-shoresh-schedule-grid>
                </template>
                <template lwc:else>
                  <c-shoresh-empty-state
                    title={planMissing}
                    data-id="special-day-empty"
                  ></c-shoresh-empty-state>
                </template>
              </template>
              <template lwc:elseif={dayProblem}>
                <div
                  class="slds-notify slds-notify_alert slds-alert_warning"
                  role="alert"
                >
                  {dayProblem}
                </div>
              </template>
              <template lwc:else>
                <c-shoresh-schedule-grid
                  data-id="edit-grid"
                  grid={editGrid}
                  corner={corner}
                  label={dailyGridLabel}
                  held={gridHeld}
                  editable
                  oneditcell={handleEditCell}
                  onclearcell={handleClearCell}
                  oncellfocus={handleCellFocus}
                  oncellselect={handleCellSelect}
                  oncellspace={handleCellSpace}
                  oncellclick={handleCellClick}
                  oncellescape={handleCellEscape}
                  oncellresize={handleCellResize}
                  oncelldragstart={handleCellDragStart}
                  oncellstretch={handleCellStretch}
                  oncelldrop={handleCellDrop}
                  onhandleclick={handleHandleClick}
                ></c-shoresh-schedule-grid>
              </template>
            </template>

            <template lwc:if={isGroup}>
              <template lwc:if={editGrid}>
                <c-shoresh-schedule-grid
                  data-id="edit-grid"
                  grid={editGrid}
                  corner={corner}
                  label={groupGridLabel}
                  held={gridHeld}
                  editable
                  oneditcell={handleEditCell}
                  onclearcell={handleClearCell}
                  oncellfocus={handleCellFocus}
                  oncellselect={handleCellSelect}
                  oncellspace={handleCellSpace}
                  oncellclick={handleCellClick}
                  oncellescape={handleCellEscape}
                  oncellresize={handleCellResize}
                  oncelldragstart={handleCellDragStart}
                  oncellstretch={handleCellStretch}
                  oncelldrop={handleCellDrop}
                  onhandleclick={handleHandleClick}
                ></c-shoresh-schedule-grid>
              </template>
            </template>

            <template lwc:if={isActivity}>
              <template lwc:if={selectedActivity}>
                <div class="drill-head">
                  <button
                    type="button"
                    class="shoresh-item"
                    onclick={handleAllActivities}
                    data-id="all-activities"
                  >
                    {allActivitiesLabel}
                  </button>
                  <span class="drill-name">{selectedActivity.name}</span>
                  <template lwc:if={selectedActivity.location}>
                    <span class="drill-place">{selectedActivity.location}</span>
                  </template>
                </div>
                <c-shoresh-schedule-grid
                  data-id="activity-grid"
                  grid={activityGrid}
                  corner={corner}
                  label={selectedActivity.name}
                ></c-shoresh-schedule-grid>
              </template>
              <template lwc:else>
                <div class="cards" data-id="activity-cards">
                  <template for:each={activityCards} for:item="card">
                    <button
                      key={card.key}
                      type="button"
                      class="card"
                      data-key={card.key}
                      onclick={handleActivity}
                    >
                      <span class={card.nameClass}>{card.name}</span>
                      <template lwc:if={card.gone}>
                        <span class="slds-assistive-text"> (removed)</span>
                      </template>
                      <template lwc:if={card.location}>
                        <span class="card-place">{card.location}</span>
                      </template>
                      <span class="card-summary">{card.summary}</span>
                    </button>
                  </template>
                </div>
              </template>
            </template>
          </template>
        </template>
      </div>

      <template lwc:if={showPalette}>
        <div class="shoresh-hairline" role="presentation"></div>
        <div class="drawer-zone" style={sheetStyle}>
          <c-shoresh-build-palette
            tiles={tiles}
            under={underCount}
            columns={drawerColumns}
            heading={paletteHeading}
            filter={filter}
            picked-id={heldActivityId}
            events={eventTiles}
            events-heading={eventsHeading}
            picked-event-id={heldEventId}
            onfilter={handleFilter}
            onpickactivity={handlePickActivity}
            onactivitydragstart={handleActivityDragStart}
            onpickevent={handlePickEvent}
            oneventdragstart={handleEventDragStart}
            ontilehover={handleTileHover}
            onremovedrop={handleRemoveDrop}
          ></c-shoresh-build-palette>
        </div>
      </template>
      <!-- On a day a special day replaces, the drawer's place is the special day's own line:
           its name, its notes, and the way to open it (mockup placed-day.png). -->
      <template lwc:if={specialLine}>
        <div class="shoresh-hairline" role="presentation"></div>
        <div class="special-line" data-id="special-line">
          <div class="special-name">
            <span class="special-title">{specialLine.name}</span>
            <span class="special-kind">{specialLine.kind}</span>
          </div>
          <p class="special-notes" data-id="special-notes">
            {specialLine.notes}
          </p>
          <div class="special-actions">
            <template lwc:if={specialLine.takeOff}>
              <button
                type="button"
                class="shoresh-item special-off"
                data-id="take-off-special"
                aria-disabled={takingOff}
                onclick={handleTakeOffSpecial}
              >
                {specialLine.takeOff}
              </button>
            </template>
            <button
              type="button"
              class="shoresh-item special-open"
              data-id="open-special"
              onclick={handleOpenSpecial}
            >
              {specialLine.open}
              <svg viewBox="0 0 16 16" class="special-arrow" aria-hidden="true">
                <path d="M3 8h10M9 4l4 4-4 4"></path>
              </svg>
            </button>
          </div>
        </div>
      </template>
    </div>

    <!-- Typing a name into a slot -->
    <template lwc:if={editor}>
      <div
        class="editor"
        style={editorStyle}
        role="dialog"
        aria-label={editorLabel}
        data-id="slot-editor"
        onfocusout={handleEditorFocusOut}
      >
        <div class="editor-where">{editorLabel}</div>
        <input
          class="slds-input"
          type="text"
          role="combobox"
          aria-label={editorLabel}
          aria-autocomplete="list"
          aria-expanded={editorExpanded}
          aria-controls="slot-options"
          aria-activedescendant={activeOptionId}
          autocomplete="off"
          value={editor.text}
          oninput={handleEditorInput}
          onkeydown={handleEditorKeyDown}
          data-id="slot-input"
        />
        <ul
          class="options"
          role="listbox"
          id="slot-options"
          aria-label={editorLabel}
        >
          <template for:each={editorOptions} for:item="option">
            <li
              key={option.key}
              id={option.id}
              role="option"
              aria-selected={option.selected}
              class={option.className}
              data-option={option.id}
              onmousedown={handleOptionMouseDown}
              onclick={handleOptionClick}
            >
              <span class="option-label"
                ><template lwc:if={option.flag}
                  ><svg class="flag" viewBox="0 0 12 12" aria-hidden="true">
                    <path d="M3 10.5V1.75"></path>
                    <path d="M3 2h6l-1.5 2.25L9 6.5H3"></path></svg></template
                >{option.label}</span
              >
              <template lwc:if={option.tag}>
                <c-shoresh-dot
                  label={option.tag}
                  open={option.highlighted}
                ></c-shoresh-dot>
              </template>
            </li>
          </template>
        </ul>
      </div>
    </template>

    <!-- Someone else changed the slot since it was opened -->
    <template lwc:if={conflict}>
      <section
        role="dialog"
        aria-modal="true"
        aria-labelledby="conflict-title"
        class="slds-modal slds-fade-in-open"
        data-id="conflict"
        onkeydown={handleConflictKeyDown}
      >
        <div class="slds-modal__container">
          <div class="slds-modal__header">
            <h2 id="conflict-title" class="slds-modal__title">
              Changed by someone else
            </h2>
          </div>
          <div class="slds-modal__content slds-p-around_medium">
            <ul class="conflict-rows">
              <template for:each={conflict.rows} for:item="row">
                <li key={row.key} class="conflict-row" data-cell={row.key}>
                  <p class="conflict-where">{row.where}</p>
                  <dl class="conflict-choices">
                    <dt>Theirs</dt>
                    <dd data-id="theirs">{row.theirs}</dd>
                    <dt>Yours</dt>
                    <dd data-id="yours">{row.yours}</dd>
                  </dl>
                </li>
              </template>
            </ul>
          </div>
          <div class="slds-modal__footer">
            <button
              type="button"
              class="slds-button slds-button_neutral"
              onclick={handleKeepTheirs}
              data-id="keep-theirs"
            >
              Keep theirs
            </button>
            <button
              type="button"
              class="slds-button slds-button_brand"
              onclick={handleUseYours}
              data-id="use-yours"
            >
              Use yours
            </button>
          </div>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
  </div>
</template>
