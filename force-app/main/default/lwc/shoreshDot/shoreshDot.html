<template>
  <span
    class="wrap"
    tabindex={tabIndex}
    onmouseenter={handleEnter}
    onmouseleave={handleLeave}
    onfocus={handleFocus}
    onblur={handleBlur}
    onclick={handleTap}
    data-id="dot"
  >
    <span class="dot" aria-hidden="true"></span>
    <span class="slds-assistive-text" data-id="dot-words">{label}</span>
    <template lwc:if={showTip}>
      <span class="tip" aria-hidden="true" data-id="dot-tip">{label}</span>
    </template>
  </span>
</template>
