<template>
  <div class="schedules" data-id="schedules">
    <!-- The rail (design-research/screens-r1 schedules.html; ADR 0005 part 2 §14), in Manual
         Build's grammar (ADR 0008 part 7): left, the program and the week, then how to look at
         it; centre, the days (or the bunk, or the activity), over the grid's cells; right,
         Versions, then Excel and Print, the main button. -->
    <div class="rail" data-id="rail">
      <div class="side side_left">
        <template lwc:if={hasSeveralPrograms}>
          <c-shoresh-rail-picker
            label={programLabel}
            value={programId}
            options={programOptions}
            onchange={handleProgram}
            data-id="program"
          ></c-shoresh-rail-picker>
        </template>
        <template lwc:if={canChoose}>
          <c-shoresh-rail-picker
            label={weekLabel}
            value={weekId}
            options={weekOptions}
            arrows
            onchange={handleWeek}
            data-id="week"
          ></c-shoresh-rail-picker>
        </template>
        <template lwc:if={opened}>
          <div class="views">
            <span class="shoresh-rail-line" role="presentation"></span>
            <div class="group" role="group" aria-label="View">
              <template for:each={viewButtons} for:item="button">
                <button
                  key={button.key}
                  type="button"
                  class={button.className}
                  aria-pressed={button.pressed}
                  data-view={button.key}
                  onclick={handleView}
                >
                  {button.label}
                </button>
              </template>
            </div>
            <span class="shoresh-rail-line" role="presentation"></span>
          </div>
        </template>
      </div>
      <div class="mid">
        <template lwc:if={showDayPills}>
          <div
            class="group"
            role="group"
            aria-label={dayWord}
            data-id="day-pills"
          >
            <template for:each={dayPills} for:item="day">
              <button
                key={day.key}
                type="button"
                class={day.className}
                aria-pressed={day.pressed}
                aria-label={day.name}
                title={day.name}
                data-index={day.index}
                onclick={handleDay}
              >
                {day.short}<template lwc:if={day.special}
                  ><svg
                    class="flag"
                    viewBox="0 0 12 12"
                    aria-hidden="true"
                    focusable="false"
                    data-id="special-flag"
                  >
                    <path d="M3 10.5V1.75"></path>
                    <path d="M3 2h6l-1.5 2.25L9 6.5H3"></path></svg
                ></template>
              </button>
            </template>
          </div>
        </template>
        <template lwc:if={showGroupPicker}>
          <c-shoresh-rail-picker
            label={groupLabel}
            value={groupKey}
            options={groupOptions}
            arrows
            onchange={handleGroup}
            data-id="group-picker"
          ></c-shoresh-rail-picker>
        </template>
        <template lwc:if={showActivityPicker}>
          <c-shoresh-rail-picker
            label={activityLabel}
            value={activityValue}
            options={activityOptions}
            arrows
            onchange={handleActivityPick}
            data-id="activity-picker"
          ></c-shoresh-rail-picker>
        </template>
      </div>
      <!-- Getting the week out, as on the desktop: Versions, then the exports, set apart. -->
      <div
        class="side side_right"
        role="group"
        aria-label="Versions and export"
      >
        <template lwc:if={canChoose}>
          <c-shoresh-versions
            versions={versions}
            open-id={openId}
            label={versionLabel}
            terms={terms}
            busy={busy}
            onopen={handleOpenVersion}
            onrename={handleRename}
          ></c-shoresh-versions>
          <template lwc:if={opened}>
            <span class="shoresh-rail-line" role="presentation"></span>
            <button
              type="button"
              class="shoresh-item"
              aria-label="Export to Excel"
              title="Export to Excel"
              data-id="export"
              disabled={cannotGetOut}
              aria-disabled={exportBusy}
              onclick={handleExport}
            >
              <svg class="shoresh-glyph" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8 2.5V10"></path>
                <path d="M5 7l3 3 3-3"></path>
                <path
                  d="M2.5 10v2.5a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V10"
                ></path></svg
              >Excel
            </button>
            <button
              type="button"
              class="shoresh-item shoresh-item_primary print"
              data-id="print"
              disabled={cannotGetOut}
              aria-disabled={printBusy}
              onclick={handlePrint}
            >
              <svg class="shoresh-glyph" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M4.5 6V2.5h7V6"></path>
                <path
                  d="M4.5 11.5h-2v-5a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 .5.5v5h-2"
                ></path>
                <path d="M4.5 9.5h7v4h-7z"></path></svg
              >Print
            </button>
          </template>
        </template>
      </div>
    </div>
    <div class="shoresh-hairline" role="presentation"></div>

    <!-- The grid's zone. Nothing here can be dragged, so there is no drawer under it. -->
    <div class="below">
      <div class="work">
        <template lwc:if={busy}>
          <lightning-spinner
            alternative-text="Loading"
            size="small"
          ></lightning-spinner>
        </template>
        <template lwc:if={error}>
          <div
            class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small"
            role="alert"
            data-id="schedules-error"
          >
            {error}
          </div>
        </template>

        <template lwc:if={opened}>
          <template lwc:if={hasNoDays}>
            <c-shoresh-empty-state
              title={noDaysMessage}
              data-id="no-days"
            ></c-shoresh-empty-state>
          </template>
          <template lwc:else>
            <!-- Daily View: all groups for one day -->
            <template lwc:if={isDaily}>
              <!-- A special event's own schedule, opened from its day (ADR 0014 slice 5). -->
              <template lwc:if={openedEvent}>
                <div class="drill-head">
                  <button
                    type="button"
                    class="shoresh-item"
                    onclick={handleEventBack}
                    data-id="event-back"
                  >
                    {eventBackLabel}
                  </button>
                  <span class="drill-name">{openedEvent.name}</span>
                  <span class="drill-place">{eventWord}</span>
                </div>
                <c-shoresh-schedule-grid
                  data-id="event-grid"
                  grid={eventGrid}
                  corner={corner}
                  label={openedEvent.name}
                ></c-shoresh-schedule-grid>
              </template>
              <template lwc:else>
                <template lwc:if={dayProblem}>
                  <div
                    class="slds-notify slds-notify_alert slds-alert_warning"
                    role="alert"
                  >
                    {dayProblem}
                  </div>
                </template>
                <template lwc:elseif={noSpecialSchedule}>
                  <c-shoresh-empty-state
                    title={noSpecialSchedule}
                    data-id="no-special-schedule"
                  ></c-shoresh-empty-state>
                </template>
                <template lwc:else>
                  <c-shoresh-schedule-grid
                    data-id="daily-grid"
                    grid={dailyGrid}
                    corner={corner}
                    label={dailyGridLabel}
                  ></c-shoresh-schedule-grid>
                </template>
                <!-- A day a special day replaces: its name, the camp's word for it, its notes. -->
                <template lwc:if={specialLine}>
                  <div class="special-line" data-id="special-line">
                    <div class="special-name">
                      <span class="special-title">{specialLine.name}</span>
                      <span class="special-kind">{specialLine.kind}</span>
                    </div>
                    <p class="special-notes" data-id="special-notes">
                      {specialLine.notes}
                    </p>
                  </div>
                </template>
                <!-- The special events on this day, each opening its own schedule. -->
                <template lwc:if={hasDayEvents}>
                  <ul class="day-events" data-id="day-events">
                    <template for:each={dayEvents} for:item="event">
                      <li key={event.id} class="special-line">
                        <div class="special-name">
                          <span class="special-title"
                            ><svg
                              class="flag"
                              viewBox="0 0 12 12"
                              aria-hidden="true"
                              focusable="false"
                            >
                              <path d="M3 10.5V1.75"></path>
                              <path d="M3 2h6l-1.5 2.25L9 6.5H3"></path></svg
                            >{event.name}</span
                          >
                          <span class="special-kind">{eventWord}</span>
                        </div>
                        <div class="special-actions">
                          <button
                            type="button"
                            class="shoresh-item special-open"
                            data-event={event.id}
                            onclick={handleOpenEvent}
                          >
                            {event.open}
                            <svg
                              viewBox="0 0 16 16"
                              class="special-arrow"
                              aria-hidden="true"
                            >
                              <path d="M3 8h10M9 4l4 4-4 4"></path>
                            </svg>
                          </button>
                        </div>
                      </li>
                    </template>
                  </ul>
                </template>
              </template>
            </template>

            <!-- Group View: one group's week -->
            <template lwc:if={isGroup}>
              <template lwc:if={groupGrid}>
                <c-shoresh-schedule-grid
                  data-id="group-grid"
                  grid={groupGrid}
                  corner={corner}
                  label={groupGridLabel}
                ></c-shoresh-schedule-grid>
              </template>
            </template>

            <!-- Activity View: where one activity runs across the week, or every activity's card -->
            <template lwc:if={isActivity}>
              <template lwc:if={selectedActivity}>
                <c-shoresh-schedule-grid
                  data-id="activity-grid"
                  grid={activityGrid}
                  corner={corner}
                  label={activityGridLabel}
                ></c-shoresh-schedule-grid>
              </template>
              <template lwc:else>
                <div class="cards" data-id="activity-cards">
                  <template for:each={activityCards} for:item="card">
                    <button
                      key={card.key}
                      type="button"
                      class="card"
                      data-key={card.key}
                      onclick={handleActivity}
                    >
                      <span class="card-name">{card.name}</span>
                      <template lwc:if={card.gone}>
                        <span class="note">(removed)</span>
                      </template>
                      <template lwc:if={card.location}>
                        <span class="card-place">{card.location}</span>
                      </template>
                      <span class="card-summary">{card.summary}</span>
                    </button>
                  </template>
                </div>
              </template>
            </template>

            <!-- The grid names its own marks on a quiet line under it (c-shoresh-schedule-grid). -->
          </template>
        </template>

        <template lwc:elseif={showEmpty}>
          <c-shoresh-empty-state
            title={emptyMessage}
            data-id="nothing-open"
          ></c-shoresh-empty-state>
        </template>
        <template lwc:elseif={cannotChoose}>
          <c-shoresh-empty-state
            title={emptyMessage}
            data-id="nothing-open"
          ></c-shoresh-empty-state>
        </template>
      </div>
    </div>
    <!-- On paper only, while it prints (c-shoresh-schedule-print, ShoreshPrint). -->
    <template lwc:if={printout}>
      <c-shoresh-schedule-print
        pages={printout}
        week={printWeek}
        version={printVersion}
        corner={corner}
      ></c-shoresh-schedule-print>
    </template>
  </div>
</template>
