<template>
  <div class="schedules" data-id="schedules">
    <!-- Toolbar, as on the desktop: the week, how to look at it, then Versions. -->
    <div class="toolbar">
      <template lwc:if={hasSeveralPrograms}>
        <lightning-combobox
          class="picker"
          label={programLabel}
          value={programId}
          options={programOptions}
          onchange={handleProgram}
          data-id="program"
        ></lightning-combobox>
      </template>
      <template lwc:if={canChoose}>
        <lightning-combobox
          class="picker"
          label={weekLabel}
          value={weekId}
          options={weekOptions}
          onchange={handleWeek}
          data-id="week"
        ></lightning-combobox>
      </template>
      <template lwc:if={opened}>
        <div class="view-toggle" role="group" aria-label="View">
          <template for:each={viewButtons} for:item="button">
            <button
              key={button.key}
              type="button"
              class={button.className}
              aria-pressed={button.pressed}
              data-view={button.key}
              onclick={handleView}
            >
              {button.label}
            </button>
          </template>
        </div>
      </template>
      <div class="spacer"></div>
      <template lwc:if={canChoose}>
        <!-- Getting the week out, as on the desktop: Versions, then the exports, set apart. -->
        <div class="toolbar-end" role="group" aria-label="Versions and export">
          <c-shoresh-versions
            versions={versions}
            open-id={openId}
            terms={terms}
            busy={busy}
            onopen={handleOpenVersion}
            onrename={handleRename}
          ></c-shoresh-versions>
          <template lwc:if={opened}>
            <span class="shoresh-rail-line" aria-hidden="true"></span>
            <button
              type="button"
              class="shoresh-item"
              data-id="export"
              disabled={cannotExport}
              onclick={handleExport}
            >
              <svg class="shoresh-glyph" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8 2.5V10"></path>
                <path d="M5 7l3 3 3-3"></path>
                <path
                  d="M2.5 10v2.5a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V10"
                ></path></svg
              >Export to Excel
            </button>
            <button
              type="button"
              class="shoresh-item"
              data-id="print"
              disabled={cannotPrint}
              onclick={handlePrint}
            >
              <svg class="shoresh-glyph" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M4.5 6V2.5h7V6"></path>
                <path
                  d="M4.5 11.5h-2v-5a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 .5.5v5h-2"
                ></path>
                <path d="M4.5 9.5h7v4h-7z"></path></svg
              >Print
            </button>
          </template>
        </div>
      </template>
    </div>

    <template lwc:if={busy}>
      <lightning-spinner
        alternative-text="Loading"
        size="small"
      ></lightning-spinner>
    </template>
    <template lwc:if={error}>
      <div
        class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small"
        role="alert"
        data-id="schedules-error"
      >
        {error}
      </div>
    </template>

    <template lwc:if={opened}>
      <div class="viewing" data-id="viewing">
        <span class="viewing-name">{openedName}</span>
        <span class="viewing-meta">
          {openedOrigin} · saved
          <lightning-formatted-date-time
            value={openedSavedAt}
            month="short"
            day="numeric"
            hour="numeric"
            minute="2-digit"
          ></lightning-formatted-date-time>
          · view only
        </span>
      </div>

      <template lwc:if={hasNoDays}>
        <c-shoresh-empty-state
          title={noDaysMessage}
          data-id="no-days"
        ></c-shoresh-empty-state>
      </template>
      <template lwc:else>
        <!-- Daily View: all groups for one day -->
        <template lwc:if={isDaily}>
          <div class="pills" data-id="day-pills">
            <template for:each={dayPills} for:item="day">
              <button
                key={day.key}
                type="button"
                class={day.className}
                aria-pressed={day.pressed}
                data-index={day.index}
                onclick={handleDay}
              >
                {day.label} <span class="pill-sub">{day.sub}</span>
              </button>
            </template>
          </div>
          <template lwc:if={dayProblem}>
            <div
              class="slds-notify slds-notify_alert slds-alert_warning"
              role="alert"
            >
              {dayProblem}
            </div>
          </template>
          <template lwc:else>
            <c-shoresh-schedule-grid
              data-id="daily-grid"
              grid={dailyGrid}
              corner={corner}
              label={dailyGridLabel}
            ></c-shoresh-schedule-grid>
          </template>
        </template>

        <!-- Group View: one group's week -->
        <template lwc:if={isGroup}>
          <div class="pills" data-id="group-pills">
            <template for:each={groupPills} for:item="grp">
              <button
                key={grp.key}
                type="button"
                class={grp.className}
                aria-pressed={grp.pressed}
                data-key={grp.key}
                onclick={handleGroup}
              >
                {grp.name} <span class="pill-sub">{grp.note}</span>
              </button>
            </template>
          </div>
          <template lwc:if={groupGrid}>
            <c-shoresh-schedule-grid
              data-id="group-grid"
              grid={groupGrid}
              corner={corner}
              label={groupGridLabel}
            ></c-shoresh-schedule-grid>
          </template>
        </template>

        <!-- Activity View: where one activity runs across the week -->
        <template lwc:if={isActivity}>
          <template lwc:if={selectedActivity}>
            <div class="drill-head">
              <button
                type="button"
                class="back"
                onclick={handleAllActivities}
                data-id="all-activities"
              >
                {allActivitiesLabel}
              </button>
              <span class="drill-name">{selectedActivity.name}</span>
              <template lwc:if={selectedActivity.location}>
                <span class="drill-place">{selectedActivity.location}</span>
              </template>
            </div>
            <c-shoresh-schedule-grid
              data-id="activity-grid"
              grid={activityGrid}
              corner={corner}
              label={activityGridLabel}
            ></c-shoresh-schedule-grid>
          </template>
          <template lwc:else>
            <div class="cards" data-id="activity-cards">
              <template for:each={activityCards} for:item="card">
                <button
                  key={card.key}
                  type="button"
                  class="card"
                  data-key={card.key}
                  onclick={handleActivity}
                >
                  <span class="card-name">{card.name}</span>
                  <template lwc:if={card.location}>
                    <span class="card-place">{card.location}</span>
                  </template>
                  <template lwc:if={card.gone}>
                    <span class="note">(removed)</span>
                  </template>
                  <span class="card-summary">{card.summary}</span>
                </button>
              </template>
            </div>
          </template>
        </template>

        <!-- The grid names its own marks on a quiet line under it (c-shoresh-schedule-grid). -->
      </template>
    </template>

    <template lwc:elseif={showEmpty}>
      <c-shoresh-empty-state
        title={emptyMessage}
        data-id="nothing-open"
      ></c-shoresh-empty-state>
    </template>
    <template lwc:elseif={cannotChoose}>
      <c-shoresh-empty-state
        title={emptyMessage}
        data-id="nothing-open"
      ></c-shoresh-empty-state>
    </template>
    <!-- On paper only, while it prints (c-shoresh-schedule-print, ShoreshPrint). -->
    <template lwc:if={printout}>
      <c-shoresh-schedule-print
        pages={printout}
        week={printWeek}
        version={printVersion}
        corner={corner}
      ></c-shoresh-schedule-print>
    </template>
  </div>
</template>
