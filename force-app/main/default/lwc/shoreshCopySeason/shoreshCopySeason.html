<template>
  <!-- The rail: what this page does and to which season, then Cancel and the one main button,
       which names the result. -->
  <div class="rail" data-id="rail">
    <h2
      class="title"
      tabindex="-1"
      aria-label={labels.titleName}
      data-id="copy-title"
    >
      {labels.title}
      <span class="title-season shoresh-num">{season.Name}</span>
    </h2>
    <span class="rail-spacer"></span>
    <button
      type="button"
      class="shoresh-item"
      data-id="cancel"
      onclick={handleCancel}
    >
      Cancel
    </button>
    <button
      type="button"
      class="shoresh-item shoresh-item_primary"
      data-id="copy"
      onclick={handleCopy}
      disabled={copyDisabled}
    >
      {labels.copy}
    </button>
  </div>
  <div class="shoresh-hairline" role="presentation"></div>
  <div class="page">
    <div class="fields">
      <div class="field">
        <lightning-input
          label={labels.name}
          value={newName}
          required
          onchange={handleName}
        ></lightning-input>
      </div>
      <div class="field" data-id="start">
        <lightning-input
          class="shoresh-date"
          type="date"
          label={labels.start}
          value={newStart}
          required
          onchange={handleStart}
        ></lightning-input>
        <template lwc:if={weekdayNote}>
          <!-- Shown, not refused: the needs-a-look mark and one line. -->
          <p class="field-note" role="status">
            <span
              class="shoresh-look-mark"
              aria-hidden="true"
              data-id="weekday-mark"
            ></span>
            <span data-id="weekday-warning">{weekdayNote}</span>
          </p>
        </template>
      </div>
    </div>
    <template lwc:if={error}>
      <div
        class="slds-notify slds-notify_alert slds-alert_error"
        role="alert"
        data-id="error"
      >
        {error}
      </div>
    </template>
    <template lwc:if={hasPreviewWeeks}>
      <!-- Last season's weeks, faint, over the new ones: each column is one week. -->
      <!-- A long season scrolls sideways: the keyboard can reach and scroll it too. -->
      <div
        class="weeks-scroll"
        tabindex="0"
        role="region"
        aria-label={labels.weeks}
        data-id="weeks-scroll"
      >
        <table class="weeks" aria-label={labels.weeks} style={weeksStyle}>
          <tbody>
            <tr class="weeks-old" data-id="old-weeks">
              <th scope="row" class="weeks-season shoresh-num">
                {season.Name}
              </th>
              <template for:each={previewWeeks} for:item="week">
                <td key={week.key}>
                  <span class="week week_old">
                    <span class="week-name">{week.name}</span>
                    <lightning-formatted-date-time
                      class="week-date"
                      value={week.oldStartDate}
                      weekday="short"
                      month="short"
                      day="numeric"
                      time-zone="UTC"
                    ></lightning-formatted-date-time>
                  </span>
                </td>
              </template>
            </tr>
            <tr class="weeks-new" data-id="new-weeks">
              <th scope="row" class="weeks-season shoresh-num">
                {newSeasonLabel}
              </th>
              <template for:each={previewWeeks} for:item="week">
                <td key={week.key}>
                  <span class="week shoresh-raised">
                    <span class="week-name">{week.name}</span>
                    <lightning-formatted-date-time
                      class="week-date"
                      value={week.startDate}
                      weekday="short"
                      month="short"
                      day="numeric"
                      time-zone="UTC"
                    ></lightning-formatted-date-time>
                  </span>
                </td>
              </template>
            </tr>
          </tbody>
        </table>
      </div>
    </template>
    <template lwc:if={showDates}>
      <p class="dates" data-id="new-dates">
        <lightning-formatted-date-time
          value={preview.startDate}
          weekday="long"
          year="numeric"
          month="long"
          day="numeric"
          time-zone="UTC"
        ></lightning-formatted-date-time>
        to
        <lightning-formatted-date-time
          value={preview.endDate}
          weekday="long"
          year="numeric"
          month="long"
          day="numeric"
          time-zone="UTC"
        ></lightning-formatted-date-time>
      </p>
    </template>
    <section class="what" data-id="comes-along">
      <h3 class="what-head">{labels.comesAlong}</h3>
      <ul class="chips">
        <template for:each={comesAlong} for:item="item">
          <li key={item.key} class="chip">{item.label}</li>
        </template>
      </ul>
    </section>
    <section class="what" data-id="stays-behind">
      <h3 class="what-head">{labels.staysBehind}</h3>
      <ul class="chips">
        <template for:each={staysBehind} for:item="item">
          <li key={item.key} class="chip chip_stays">{item.label}</li>
        </template>
      </ul>
    </section>
  </div>
</template>
