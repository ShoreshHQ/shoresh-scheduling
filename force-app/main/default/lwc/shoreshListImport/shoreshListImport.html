<template>
  <template lwc:if={open}>
    <div class="list-import slds-m-bottom_medium" data-id="list-import">
      <div class="list-header">
        <h3 class="slds-text-heading_small">{title}</h3>
        <lightning-button
          data-id="close"
          variant="base"
          label="Close"
          onclick={handleClose}
        ></lightning-button>
      </div>

      <template lwc:if={error}>
        <div class="list-error" role="alert" data-id="error">{error}</div>
      </template>

      <!-- Choosing the file -->
      <template lwc:if={isPick}>
        <input
          type="file"
          class="slds-hide"
          aria-label="Choose a file"
          data-id="file"
          accept=".xlsx,.xlsm,.xls,.csv"
          onchange={handleFileInput}
        />
        <lightning-button
          data-id="choose"
          label="Choose a file"
          icon-name="utility:upload"
          onclick={handleChoose}
          disabled={isReading}
        ></lightning-button>
        <span class="list-weak slds-m-left_small">.xlsx · .xls · .csv</span>
        <template lwc:if={isReading}>
          <lightning-spinner
            alternative-text="Reading"
            size="small"
          ></lightning-spinner>
        </template>
      </template>

      <!-- Reviewing it -->
      <template lwc:if={isReview}>
        <lightning-badge
          class="slds-m-bottom_small"
          label={fileName}
          icon-name="utility:file"
        ></lightning-badge>

        <template lwc:if={showSheetChoice}>
          <div
            class="slds-size_1-of-1 slds-medium-size_1-of-3 slds-m-bottom_small"
          >
            <lightning-combobox
              data-id="sheet"
              label="Sheet"
              value={currentSheet}
              options={sheetOptions}
              onchange={handleSheet}
            ></lightning-combobox>
          </div>
        </template>

        <template lwc:if={hasCards}>
          <h4 class="list-section">{questionsHeading}</h4>
          <template for:each={cards} for:item="card">
            <div key={card.id} class={card.className} data-card={card.id}>
              <template lwc:if={card.answered}>
                <span>✓ {card.answerLabel}</span>
                <template lwc:if={card.fromMemory}>
                  <span class="list-tag">Remembered</span>
                </template>
                <span class="list-weak"> {card.title}</span>
                <lightning-button
                  variant="base"
                  label="Change"
                  data-id={card.id}
                  onclick={handleCardChange}
                ></lightning-button>
              </template>
              <template lwc:else>
                <div class="list-card-title">{card.title}</div>
                <div class="list-options">
                  <template lwc:if={card.daysQuestion}>
                    <lightning-checkbox-group
                      label="Days"
                      variant="label-hidden"
                      options={dayOptions}
                      value={card.draftDays}
                      data-id={card.id}
                      data-part="days"
                      onchange={handleDraft}
                    ></lightning-checkbox-group>
                    <lightning-button
                      label="Use these days"
                      data-id={card.id}
                      data-kind="days"
                      onclick={handleDraftDone}
                    ></lightning-button>
                  </template>
                  <template lwc:if={card.timesQuestion}>
                    <lightning-input
                      type="time"
                      label="Start"
                      data-id={card.id}
                      data-part="start"
                      onchange={handleDraft}
                    ></lightning-input>
                    <lightning-input
                      type="time"
                      label="End"
                      data-id={card.id}
                      data-part="end"
                      onchange={handleDraft}
                    ></lightning-input>
                    <lightning-button
                      label="Use these times"
                      data-id={card.id}
                      data-kind="times"
                      onclick={handleDraftDone}
                    ></lightning-button>
                  </template>
                  <template lwc:if={card.draftProblem}>
                    <span class="list-tag list-tag_attention"
                      >{card.draftProblem}</span
                    >
                  </template>
                  <template for:each={card.options} for:item="option">
                    <lightning-button
                      key={option.key}
                      label={option.label}
                      data-key={option.key}
                      onclick={handleCardAnswer}
                    ></lightning-button>
                  </template>
                </div>
              </template>
            </div>
          </template>
        </template>

        <template lwc:if={hasUnanswered}>
          <lightning-button
            class="list-change-all"
            data-id="change-all"
            label={changeAllLabel}
            onclick={handleChangeAll}
          ></lightning-button>
        </template>

        <template for:each={sections} for:item="section">
          <div key={section.key} class="list-sheet" data-section={section.key}>
            <template lwc:if={section.showLabel}>
              <h4 class="list-sheet-title">{section.label}</h4>
            </template>

            <template for:each={section.lists} for:item="list">
              <div key={list.key} data-list={list.key}>
                <div
                  class="list-section"
                  role="heading"
                  aria-level={section.level}
                >
                  {list.heading}
                </div>
                <ul class="list-names">
                  <template for:each={list.lines} for:item="line">
                    <li key={line.key}>{line.text}</li>
                  </template>
                </ul>
              </div>
            </template>

            <template lwc:if={section.hasMapping}>
              <div
                class="list-section"
                role="heading"
                aria-level={section.level}
              >
                Columns
              </div>
              <div class="list-headings" data-id="headings">
                <template for:each={section.headings} for:item="heading">
                  <div key={heading.key} class={heading.className}>
                    <span class="list-heading-text">“{heading.text}”</span>
                    <lightning-combobox
                      data-id={heading.key}
                      label={heading.text}
                      variant="label-hidden"
                      value={heading.value}
                      options={section.columnOptions}
                      onchange={handleColumn}
                    ></lightning-combobox>
                    <template lwc:if={heading.note}>
                      <span class={heading.tagClass}>{heading.note}</span>
                    </template>
                  </div>
                </template>
              </div>
            </template>

            <template lwc:if={section.hasAlsoAdd}>
              <div
                class="list-section"
                role="heading"
                aria-level={section.level}
              >
                Also adding
              </div>
              <div data-id="also-add">
                <template for:each={section.alsoAdd} for:item="item">
                  <template lwc:if={item.canUntick}>
                    <lightning-input
                      key={item.key}
                      type="checkbox"
                      label={item.label}
                      checked={item.checked}
                      data-rain-plan={item.rainPlan}
                      onchange={handleAlsoAdd}
                    ></lightning-input>
                  </template>
                  <template lwc:else>
                    <lightning-input
                      key={item.key}
                      type="checkbox"
                      label={item.label}
                      checked
                      disabled
                    ></lightning-input>
                  </template>
                </template>
              </div>
            </template>

            <template lwc:if={section.hasNew}>
              <div
                class="list-section"
                role="heading"
                aria-level={section.level}
              >
                {section.newHeading}
              </div>
              <ul class="list-names" data-id="new">
                <template for:each={section.newRows} for:item="row">
                  <li key={row.key}>
                    {row.name}
                    <template lwc:if={row.starting}>
                      <span class="list-tag slds-m-left_x-small"
                        >{row.starting}</span
                      >
                    </template>
                  </li>
                </template>
              </ul>
            </template>

            <template lwc:if={section.hasChanges}>
              <div
                class="list-section"
                role="heading"
                aria-level={section.level}
              >
                Changes
              </div>
              <template for:each={section.changedRows} for:item="row">
                <div key={row.key} class="list-changed" data-row={row.name}>
                  <div class="list-card-title">{row.name}</div>
                  <template for:each={row.differences} for:item="d">
                    <div key={d.id} class={d.className}>
                      <span>{d.text}</span>
                      <template lwc:if={d.clears}>
                        <span class="list-clears">clears</span>
                      </template>
                      <button
                        type="button"
                        class={d.keepClass}
                        aria-pressed={d.keepPressed}
                        aria-label={d.keepLabel}
                        data-id={d.id}
                        onclick={handleKeep}
                      >
                        Keep
                      </button>
                      <button
                        type="button"
                        class={d.changeClass}
                        aria-pressed={d.changePressed}
                        aria-label={d.changeLabel}
                        data-id={d.id}
                        onclick={handleChange}
                      >
                        Change
                      </button>
                    </div>
                  </template>
                </div>
              </template>
            </template>

            <template lwc:if={section.unchangedCount}>
              <p class="list-weak slds-m-top_small" data-id="unchanged">
                Unchanged ({section.unchangedCount})
              </p>
            </template>

            <template lwc:if={section.hasUnreadable}>
              <div
                class="list-section"
                role="heading"
                aria-level={section.level}
              >
                {section.unreadableHeading}
              </div>
              <ul class="list-names" data-id="unreadable">
                <template for:each={section.unreadableRows} for:item="row">
                  <li key={row.key}>{row.text}</li>
                </template>
              </ul>
            </template>

            <template lwc:if={section.hasLeftOut}>
              <div
                class="list-section"
                role="heading"
                aria-level={section.level}
              >
                {section.leftOutHeading}
              </div>
              <ul class="list-names" data-id="left-out">
                <template for:each={section.leftOutRows} for:item="row">
                  <li key={row.key}>{row.text}</li>
                </template>
              </ul>
            </template>
          </div>
        </template>

        <div class="list-footer">
          <template lwc:if={hasWaiting}>
            <ul class="list-waiting" data-id="waiting">
              <template for:each={waitingLines} for:item="line">
                <li key={line.key}>{line.text}</li>
              </template>
            </ul>
          </template>
          <lightning-button
            data-id="save"
            variant="brand"
            label={saveLabel}
            onclick={handleSave}
            disabled={saveDisabled}
          ></lightning-button>
        </div>
      </template>

      <!-- Saved -->
      <template lwc:if={isDone}>
        <p class="slds-m-bottom_small" data-id="saved">Saved</p>
        <ul class="list-names" data-id="summary">
          <template for:each={summaryLines} for:item="line">
            <li key={line.key}>{line.text}</li>
          </template>
          <template for:each={droppedPlans} for:item="line">
            <li key={line.key}>{line.text}</li>
          </template>
        </ul>
        <template lwc:if={undone}>
          <p class="slds-m-top_small" data-id="undone">{undone}</p>
        </template>
        <div class="slds-m-top_small">
          <template lwc:if={canUndo}>
            <lightning-button
              data-id="undo"
              label="Undo this import"
              onclick={handleUndo}
              disabled={undoing}
            ></lightning-button>
          </template>
          <lightning-button
            class="slds-m-left_x-small"
            data-id="done"
            variant="brand"
            label="Done"
            onclick={handleClose}
          ></lightning-button>
        </div>
      </template>
    </div>
  </template>
  <template lwc:else>
    <lightning-button-group>
      <lightning-button
        data-id="open"
        label={openLabel}
        icon-name="utility:upload"
        onclick={handleOpen}
      ></lightning-button>
      <template lwc:if={showDownload}>
        <lightning-button
          data-id="download"
          label="Download this list"
          icon-name="utility:download"
          disabled={downloading}
          onclick={handleDownload}
        ></lightning-button>
      </template>
    </lightning-button-group>
  </template>
</template>
