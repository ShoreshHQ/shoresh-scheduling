<template>
  <section class="slds-m-top_large">
    <h2 class="slds-text-heading_medium slds-m-bottom_x-small">
      {labels.title}
    </h2>
    <template lwc:if={hasGrid}>
      <p class="slds-m-bottom_small">{labels.intro}</p>
      <div class="slds-scrollable_x">
        <table
          class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered"
          aria-label={labels.title}
        >
          <thead>
            <tr class="slds-line-height_reset">
              <th scope="col">
                <span class="slds-assistive-text">{labels.title}</span>
              </th>
              <template for:each={weeks} for:item="week">
                <th key={week.id} scope="col" class="slds-text-align_center">
                  {week.name}
                </th>
              </template>
            </tr>
          </thead>
          <template for:each={sections} for:item="section">
            <tbody key={section.key}>
              <tr class="slds-theme_shade">
                <th scope="colgroup" colspan={columnCount}>
                  <span class="slds-text-title_caps">{section.heading}</span>
                </th>
              </tr>
              <template for:each={section.rows} for:item="row">
                <tr key={row.id}>
                  <th scope="row">
                    <div>{row.name}</div>
                    <template lwc:if={row.place}>
                      <div class="slds-text-color_weak slds-text-body_small">
                        {row.place}
                      </div>
                    </template>
                  </th>
                  <template for:each={row.cells} for:item="cell">
                    <td key={cell.key} class="slds-text-align_center">
                      <lightning-input
                        type="checkbox"
                        variant="label-hidden"
                        label={cell.label}
                        checked={cell.checked}
                        data-key={cell.key}
                        onchange={handleTick}
                      ></lightning-input>
                    </td>
                  </template>
                </tr>
              </template>
            </tbody>
          </template>
        </table>
      </div>
      <div class="slds-m-top_x-small">
        <lightning-button
          label="Cancel changes"
          onclick={handleCancel}
          disabled={saveDisabled}
        ></lightning-button>
        <lightning-button
          class="slds-m-left_x-small"
          variant="brand"
          label="Save changes"
          onclick={handleSave}
          disabled={saveDisabled}
        ></lightning-button>
      </div>
    </template>
    <template lwc:else>
      <p class="slds-text-color_weak">{labels.empty}</p>
    </template>
  </section>
</template>
