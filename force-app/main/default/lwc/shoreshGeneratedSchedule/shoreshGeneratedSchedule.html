<template>
  <div class="schedules" data-id="generated-schedule">
    <!-- One editor shell from the start, as in Manual Build: the week and program pickers sit in
         its rail before the week is generated too, so they never move when it is drawn. -->
    <c-shoresh-week-editor
      data-id="week-editor"
      set-up-with={setUpWith}
      take-off-with={takeOffWith}
      onopenspecial={handleOpenSpecial}
      terms={terms}
      setup={editorSetup}
      week-name={weekName}
      program-name={programName}
      save-runs={saveRuns}
      restoring={editsWait}
      locks={editorLocks}
      check-with={checkWith}
      setup-dots={setupDots}
      edit-items={editItems}
      oneditselect={handleEditSelect}
      rainy-with={rainyWith}
      add-activity-with={addActivityWith}
      onstatechange={handleEditorState}
      oneditstate={handleEditState}
      onsaved={handleSaved}
      onedited={handleEdited}
      onerrorchange={handleEditorError}
      onreload={handleEditorReload}
      onunlockrequest={handleUnlockRequest}
      oncellfocus={handleCellFocus}
    >
      <!-- Setup changed since the week was built: the cells carry their marks and the menu's
           foot says so, with Update to match setup, as on Manual Build (ADR 0015 §9). Here
           only when it can't be compared, so that is never hidden. -->
      <template lwc:if={showSetupProblem}>
        <p class="notice" slot="status" data-id="setup-problem">
          {setupProblem}
        </p>
      </template>

      <template lwc:if={busy}>
        <div class="busy" slot="status" data-id="busy" tabindex="-1">
          <div class="busy-row">
            <div
              class={progressClass}
              role="progressbar"
              aria-label={busyText}
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow={progressValue}
            >
              <div class="progress-fill" style={progressStyle}></div>
            </div>
            <span class="busy-text">{busyText}</span>
            <template lwc:if={canStopBuild}>
              <button
                type="button"
                class="slds-button slds-button_neutral"
                onclick={handleStopBuild}
                data-id="stop-build"
              >
                Cancel
              </button>
            </template>
          </div>
          <!-- What the build is doing now, in camp words. Not a live region: it changes a few
               times a second; a screen reader hears it every few seconds (announce). -->
          <p class="busy-now" data-id="busy-now">{busyLine}</p>
        </div>
      </template>

      <template lwc:if={loading}>
        <lightning-spinner
          slot="status"
          alternative-text="Loading"
          size="small"
        ></lightning-spinner>
      </template>
      <template lwc:if={error}>
        <div
          slot="status"
          class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small"
          role="alert"
          data-id="build-error"
        >
          {error}
        </div>
      </template>

      <!-- Someone else saved this week first: nothing of ours was written. A refused Restore
           (nothing was changed) is the quiet line Manual Build shows for it. -->
      <template lwc:if={quietConflict}>
        <p class="notice" slot="status" data-id="restore-refused">
          <span>{conflict.message} ·</span>
          <button
            type="button"
            class="slds-button tool-undo"
            disabled={reloadDisabled}
            onclick={handleReload}
            data-id="reload"
          >
            Reload
          </button>
        </p>
      </template>
      <template lwc:elseif={conflict}>
        <div class="conflict" slot="status" role="alert" data-id="conflict">
          <p>{conflict.message}</p>
          <button
            type="button"
            class="slds-button slds-button_brand"
            disabled={reloadDisabled}
            onclick={handleReload}
            data-id="reload"
          >
            Reload
          </button>
        </div>
      </template>

      <template lwc:if={notPlaced}>
        <div
          class="not-placed"
          slot="outcome"
          role="status"
          data-id="not-placed"
        >
          <c-shoresh-dot
            label="Not placed: the cell was taken"
            focusable
            data-id="not-placed-dot"
          ></c-shoresh-dot>
          <ul>
            <template for:each={notPlaced} for:item="line">
              <li key={line}>{line}</li>
            </template>
          </ul>
        </div>
      </template>

      <!-- Start over happened at once: Undo brings back the version it kept first, as Manual
           Build's Clear week offers Undo (Greg's decision 2, 2026-10-20). -->
      <template lwc:if={startedOverText}>
        <p class="notice" slot="status" data-id="started-over">
          <span>{startedOverText} ·</span>
          <button
            type="button"
            class="slds-button tool-undo"
            data-id="start-over-undo"
            aria-label={startOverUndoLabel}
            disabled={versionsBusy}
            onclick={handleUndoStartOver}
          >
            Undo
          </button>
        </p>
      </template>

      <!-- Before the week is generated, under the rail: what building still needs, or the
           desktop's empty card. -->
      <template lwc:if={showNoDays}>
        <p class="empty-state" slot="outcome">{noDaysMessage}</p>
      </template>

      <!-- Building waits for the basics (desktop readiness.js), as in Manual Build. -->
      <template lwc:if={showStillNeeded}>
        <div class="still-needed-box" slot="outcome" data-id="still-needed-box">
          <p class="still-needed" data-id="still-needed">
            <template for:each={stillNeededParts} for:item="part">
              <template lwc:if={part.link}>
                <a
                  key={part.key}
                  href="#"
                  data-screen={part.screen}
                  onclick={handleStillNeeded}
                  >{part.text}</a
                >
              </template>
              <template lwc:else>
                <span key={part.key}>{part.text}</span>
              </template>
            </template>
          </p>
          <lightning-button
            variant="brand"
            label={setUpFirstLabel}
            data-screen={setUpFirstScreen}
            onclick={handleStillNeeded}
            data-id="set-up-first"
          ></lightning-button>
        </div>
      </template>

      <!-- Not generated yet (desktop: "Let the app propose one"). -->
      <template lwc:if={showStart}>
        <div class="start" slot="outcome" data-id="start">
          <h3 class="start-title">Let the app propose one</h3>
          <lightning-button
            variant="brand"
            label={generateLabel}
            disabled={actionsDisabled}
            onclick={handleGenerate}
            data-id="generate"
          ></lightning-button>
          <!-- Its versions, when it has any: any of them can be restored here (decision 9). With
               no week here yet there is nothing to save as a version or delete from. -->
          <template lwc:if={showStartVersions}>
            <c-shoresh-versions
              restore
              no-draft
              versions={versions}
              terms={terms}
              busy={versionsBusy}
              announce-with={announceText}
              onopen={handleRestore}
              onrename={handleRenameVersion}
              data-id="versions"
            ></c-shoresh-versions>
          </template>
        </div>
      </template>

      <template lwc:if={cannotChoose}>
        <div class="empty-state" slot="outcome" data-id="nothing-to-build">
          <p>{chooseMessage}</p>
        </div>
      </template>

      <!-- The rail's left: the program (when there are several) and the week, as on Manual
           Build, before Edit, Build and how to look at the week. -->
      <c-shoresh-roots-back
        slot="pickers"
        lineless={backStandsAlone}
        onbacktoroots={handleBackToRoots}
      ></c-shoresh-roots-back>
      <template lwc:if={hasSeveralPrograms}>
        <c-shoresh-rail-picker
          slot="pickers"
          label={programLabel}
          value={programId}
          options={programOptions}
          disabled={pickerDisabled}
          onchange={handleProgram}
          data-id="program"
        ></c-shoresh-rail-picker>
      </template>
      <template lwc:if={canChoose}>
        <c-shoresh-rail-picker
          slot="pickers"
          label={weekLabel}
          value={weekId}
          options={weekOptions}
          disabled={pickerDisabled}
          arrows
          onchange={handleWeek}
          data-id="week"
        ></c-shoresh-rail-picker>
      </template>
      <template lwc:if={showWeek}>
        <!-- Build, beside Edit (ADR 0010 §58): what Shoresh builds. Rebuild and Try another, Fill
             the open cells, any option tried this visit brought back, then Start over. Edit holds
             what is done by hand: Undo, Redo and Lock. -->
        <c-shoresh-rail-pop
          slot="tools"
          label="Build"
          menu
          disabled={actionsDisabled}
          data-id="build-menu"
        >
          <button
            type="button"
            role="menuitem"
            class="shoresh-pop-row"
            disabled={actionsDisabled}
            onclick={handleRebuild}
            data-action="Rebuild"
          >
            Rebuild
          </button>
          <button
            type="button"
            role="menuitem"
            class="shoresh-pop-row"
            disabled={actionsDisabled}
            onclick={handleTryAnother}
            data-action="TryAnother"
          >
            Try another
          </button>
          <button
            type="button"
            role="menuitem"
            class="shoresh-pop-row"
            disabled={cannotFill}
            onclick={handleFillOpen}
            data-action="FillOpen"
          >
            Fill the open cells
          </button>
          <div class="shoresh-pop-divider" role="separator"></div>
          <div role="group" aria-label={optionLabel} data-id="option">
            <template for:each={optionRows} for:item="choice">
              <button
                key={choice.value}
                type="button"
                role="menuitemradio"
                class="shoresh-pop-row"
                aria-checked={choice.checked}
                disabled={actionsDisabled}
                onclick={handleOptionRow}
                data-option={choice.value}
              >
                {choice.label}
              </button>
            </template>
          </div>
          <div class="shoresh-pop-divider" role="separator"></div>
          <button
            type="button"
            role="menuitem"
            class="shoresh-pop-row"
            disabled={actionsDisabled}
            onclick={handleStartOver}
            data-action="StartOver"
          >
            Start over
          </button>
        </c-shoresh-rail-pop>

        <!-- The rail's right: the counter, in the same place and with the same words as on Manual
             Build, then Versions and Publish at the edge. -->
        <c-shoresh-week-checks
          slot="checks"
          measure={measure}
          schedule-id={checksScheduleId}
          reset-key={checksResetKey}
          onlocate={handleLocate}
          onshowactivity={handleShowActivity}
          data-id="counter"
        ></c-shoresh-week-checks>
        <c-shoresh-versions
          slot="end"
          restore
          versions={versions}
          open-id={restoredId}
          terms={terms}
          busy={versionsBusy}
          announce-with={announceText}
          onopen={handleRestore}
          onrename={handleRenameVersion}
          ondelete={handleDeleteVersion}
          onsave={handleSaveVersion}
          data-id="versions"
        ></c-shoresh-versions>
        <div class="publish" slot="end" data-id="publish-area">
          <!-- Published: when, and Unpublish, in a dropdown; the corner when the week changed
               since. As Manual Build. -->
          <template lwc:if={publishState}>
            <c-shoresh-rail-pop
              label="Published"
              mark={publishState.changedSince}
              alternative-text={publishedName}
              align="right"
              data-id="published-menu"
            >
              <p class="shoresh-pop-row published" data-id="published">
                <span
                  >{publishedWord}<lightning-formatted-date-time
                    value={publishState.publishedAt}
                    month="short"
                    day="numeric"
                    hour="numeric"
                    minute="2-digit"
                  ></lightning-formatted-date-time
                  >{publishedBy}</span
                >
                <template lwc:if={publishState.changedSince}>
                  <c-shoresh-dot
                    class="changed-since"
                    label="Changed since"
                    focusable
                    data-id="changed-since"
                  ></c-shoresh-dot>
                </template>
              </p>
              <div class="shoresh-pop-divider" role="presentation"></div>
              <button
                type="button"
                class="shoresh-pop-row"
                data-pop-row
                data-id="unpublish"
                disabled={publishDisabled}
                onclick={handleUnpublish}
              >
                Unpublish
              </button>
            </c-shoresh-rail-pop>
          </template>
          <button
            type="button"
            class="shoresh-item shoresh-item_primary"
            data-id="publish"
            disabled={publishDisabled}
            onclick={handlePublish}
          >
            Publish
          </button>
        </div>
      </template>
    </c-shoresh-week-editor>

    <template lwc:if={publishAsk}>
      <c-shoresh-ask
        heading={publishAsk.heading}
        lines={publishAsk.lines}
        confirm-label={publishAsk.confirmLabel}
        onanswer={handlePublishAnswer}
        data-id="publish-ask"
      ></c-shoresh-ask>
    </template>
    <template lwc:if={setupAsk}>
      <c-shoresh-setup-match
        heading={setupHeading}
        changes={setupChanges}
        busy={setupWorking}
        notice={setupAsk.notice}
        announcement={setupAsk.announcement}
        said={setupAsk.said}
        updated={setupAsk.updated}
        onupdate={handleSetupUpdate}
        onclose={handleSetupClose}
        data-id="setup-match"
      ></c-shoresh-setup-match>
    </template>
    <template lwc:if={unpublishAsk}>
      <c-shoresh-ask
        heading={unpublishAsk.heading}
        lines={unpublishAsk.lines}
        confirm-label="Unpublish"
        onanswer={handleUnpublishAnswer}
        data-id="unpublish-ask"
      ></c-shoresh-ask>
    </template>

    <!-- Rebuild: the desktop's ConfirmRegenModal. -->
    <template lwc:if={confirming}>
      <section
        role="alertdialog"
        aria-modal="true"
        aria-labelledby="confirm-title"
        aria-describedby="confirm-body"
        class="slds-modal slds-fade-in-open"
        data-id="confirm"
        onkeydown={handleConfirmKeyDown}
      >
        <div class="slds-modal__container">
          <div class="slds-modal__header">
            <h2 id="confirm-title" class="slds-modal__title">{confirmTitle}</h2>
          </div>
          <div class="slds-modal__content slds-p-around_medium">
            <p id="confirm-body" data-id="confirm-body">{confirmBody}</p>
            <p class="confirm-note" data-id="confirm-note">{confirmNote}</p>
          </div>
          <div class="slds-modal__footer">
            <button
              type="button"
              class="slds-button slds-button_neutral"
              onclick={handleCancelConfirm}
              data-id="confirm-cancel"
            >
              Cancel
            </button>
            <button
              type="button"
              class="slds-button slds-button_destructive"
              onclick={handleConfirm}
              data-id="confirm-go"
            >
              {confirmLabel}
            </button>
          </div>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
  </div>
</template>
