<template>
  <div class="schedules" data-id="generated-schedule">
    <div class="slds-assistive-text" aria-live="polite" data-id="announce">
      {announcement}
    </div>

    <!-- One editor shell from the start, as in Manual Build: the week and program pickers sit in
         its toolbar before the week is generated too, so they never move when it is drawn. -->
    <c-shoresh-week-editor
      data-id="week-editor"
      terms={terms}
      setup={editorSetup}
      week-name={weekName}
      program-name={programName}
      save-runs={saveRuns}
      restoring={editsWait}
      locks={editorLocks}
      check-with={checkWith}
      lit={lit}
      add-activity-with={addActivityWith}
      onstatechange={handleEditorState}
      oneditstate={handleEditState}
      onsaved={handleSaved}
      onedited={handleEdited}
      onerrorchange={handleEditorError}
      onreload={handleEditorReload}
      onunlockrequest={handleUnlockRequest}
      oncellfocus={handleCellFocus}
    >
      <template lwc:if={busy}>
        <div class="busy" slot="status" data-id="busy">
          <div
            class={progressClass}
            role="progressbar"
            aria-label={busyText}
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow={progressValue}
          >
            <div class="progress-fill" style={progressStyle}></div>
          </div>
          <span class="busy-text">{busyText}</span>
        </div>
      </template>

      <template lwc:if={loading}>
        <lightning-spinner
          slot="status"
          alternative-text="Loading"
          size="small"
        ></lightning-spinner>
      </template>
      <template lwc:if={error}>
        <div
          slot="status"
          class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small"
          role="alert"
          data-id="build-error"
        >
          {error}
        </div>
      </template>

      <!-- Someone else saved this week first: nothing of ours was written. -->
      <template lwc:if={conflict}>
        <div class="conflict" slot="status" role="alert" data-id="conflict">
          <p>{conflict.message}</p>
          <button
            type="button"
            class="slds-button slds-button_brand"
            disabled={reloadDisabled}
            onclick={handleReload}
            data-id="reload"
          >
            Reload
          </button>
        </div>
      </template>

      <template lwc:if={notPlaced}>
        <div
          class="not-placed"
          slot="outcome"
          role="status"
          data-id="not-placed"
        >
          <c-shoresh-dot
            label="Not placed: the cell was taken"
            focusable
            data-id="not-placed-dot"
          ></c-shoresh-dot>
          <ul>
            <template for:each={notPlaced} for:item="line">
              <li key={line}>{line}</li>
            </template>
          </ul>
        </div>
      </template>

      <!-- Start over happened at once: Undo brings back the version it kept first, as Manual
           Build's Clear week offers Undo (Greg's decision 2, 2026-10-20). -->
      <template lwc:if={startedOverText}>
        <p class="notice" slot="status" data-id="started-over">
          <span>{startedOverText} ·</span>
          <button
            type="button"
            class="slds-button tool-undo"
            data-id="start-over-undo"
            aria-label={startOverUndoLabel}
            disabled={versionsBusy}
            onclick={handleUndoStartOver}
          >
            Undo
          </button>
        </p>
      </template>

      <!-- Before the week is generated, under the toolbar: what building still needs, or the
           desktop's empty card. -->
      <template lwc:if={showNoDays}>
        <p class="empty-state" slot="outcome">{noDaysMessage}</p>
      </template>

      <!-- Building waits for the basics (desktop readiness.js), as in Manual Build. -->
      <template lwc:if={showStillNeeded}>
        <div class="still-needed-box" slot="outcome" data-id="still-needed-box">
          <p class="still-needed" data-id="still-needed">
            <template for:each={stillNeededParts} for:item="part">
              <template lwc:if={part.link}>
                <a
                  key={part.key}
                  href="#"
                  data-screen={part.screen}
                  onclick={handleStillNeeded}
                  >{part.text}</a
                >
              </template>
              <template lwc:else>
                <span key={part.key}>{part.text}</span>
              </template>
            </template>
          </p>
          <lightning-button
            variant="brand"
            label={setUpFirstLabel}
            data-screen={setUpFirstScreen}
            onclick={handleStillNeeded}
            data-id="set-up-first"
          ></lightning-button>
        </div>
      </template>

      <!-- Not generated yet (desktop: "Let the app propose one"). -->
      <template lwc:if={showStart}>
        <div class="start" slot="outcome" data-id="start">
          <h3 class="start-title">Let the app propose one</h3>
          <lightning-button
            variant="brand"
            label={generateLabel}
            disabled={actionsDisabled}
            onclick={handleGenerate}
            data-id="generate"
          ></lightning-button>
          <!-- Its versions, when it has any: any of them can be restored here (decision 9). With
               no week here yet there is nothing to save as a version or delete from. -->
          <template lwc:if={showStartVersions}>
            <c-shoresh-versions
              restore
              no-draft
              versions={versions}
              terms={terms}
              busy={versionsBusy}
              onopen={handleRestore}
              onrename={handleRenameVersion}
              data-id="versions"
            ></c-shoresh-versions>
          </template>
        </div>
      </template>

      <template lwc:if={cannotChoose}>
        <div class="empty-state" slot="outcome" data-id="nothing-to-build">
          <p>{chooseMessage}</p>
        </div>
      </template>

      <!-- One toolbar, as on the desktop: the week, how to look at it (the editor's views), then
           what changes it: Undo and Redo (the editor's), with Rebuild beside them (desktop
           ScheduleScreen.jsx: "Sits with undo/redo", owner 2026-09-12). -->
      <template lwc:if={hasSeveralPrograms}>
        <lightning-combobox
          slot="pickers"
          class="picker"
          label={programLabel}
          value={programId}
          options={programOptions}
          disabled={pickerDisabled}
          onchange={handleProgram}
          data-id="program"
        ></lightning-combobox>
      </template>
      <template lwc:if={canChoose}>
        <lightning-combobox
          slot="pickers"
          class="picker"
          label={weekLabel}
          value={weekId}
          options={weekOptions}
          disabled={pickerDisabled}
          onchange={handleWeek}
          data-id="week"
        ></lightning-combobox>
      </template>
      <template lwc:if={showWeek}>
        <div class="actions" slot="tools" role="group" aria-label="Build">
          <button
            type="button"
            class="slds-button slds-button_neutral"
            disabled={actionsDisabled}
            onclick={handleRebuild}
            data-action="Rebuild"
          >
            Rebuild
          </button>
          <button
            type="button"
            class="slds-button slds-button_neutral"
            disabled={cannotFill}
            onclick={handleFillOpen}
            data-action="FillOpen"
          >
            Fill the open cells
          </button>
          <button
            type="button"
            class="slds-button slds-button_neutral"
            disabled={actionsDisabled}
            onclick={handleTryAnother}
            data-action="TryAnother"
          >
            Try another
          </button>
          <lightning-combobox
            class="option"
            label={optionLabel}
            value={optionValue}
            options={optionChoices}
            disabled={actionsDisabled}
            onchange={handleOption}
            data-id="option"
          ></lightning-combobox>
        </div>
        <div class="actions" slot="tools">
          <lightning-button-menu
            class="lock-menu"
            label="Lock"
            icon-name="utility:lock"
            alternative-text="Lock"
            disabled={lockDisabled}
            onselect={handleLockSelect}
            data-id="lock-menu"
          >
            <template for:each={lockMenu} for:item="choice">
              <lightning-menu-item
                key={choice.value}
                value={choice.value}
                label={choice.label}
                data-value={choice.value}
              ></lightning-menu-item>
            </template>
          </lightning-button-menu>
        </div>
        <button
          slot="tools"
          type="button"
          class="slds-button slds-button_neutral"
          disabled={actionsDisabled}
          onclick={handleStartOver}
          data-action="StartOver"
        >
          Start over
        </button>
        <!-- Versions and Publish at the right edge, as on Manual Build and the desktop. -->
        <span class="spacer" slot="tools"></span>
        <!-- Versions, set off by a divider as on the desktop and Manual Build: Restore, rename,
             delete and Save version. -->
        <div class="divider" slot="tools" aria-hidden="true"></div>
        <c-shoresh-versions
          slot="tools"
          restore
          versions={versions}
          open-id={restoredId}
          terms={terms}
          busy={versionsBusy}
          onopen={handleRestore}
          onrename={handleRenameVersion}
          ondelete={handleDeleteVersion}
          onsave={handleSaveVersion}
          data-id="versions"
        ></c-shoresh-versions>
        <!-- Publish, last on the toolbar, as on Manual Build: when the week was published, then
             Unpublish (only while it is) and Publish. -->
        <div class="publish" slot="tools" data-id="publish-area">
          <template lwc:if={publishState}>
            <span class="published" data-id="published">
              {publishedWord}<lightning-formatted-date-time
                value={publishState.publishedAt}
                month="short"
                day="numeric"
                hour="numeric"
                minute="2-digit"
              ></lightning-formatted-date-time
              >{publishedBy}
              <template lwc:if={publishState.changedSince}>
                <span data-id="changed-since"> · changed since</span>
              </template>
            </span>
            <button
              type="button"
              class="slds-button slds-button_neutral"
              data-id="unpublish"
              disabled={publishDisabled}
              onclick={handleUnpublish}
            >
              Unpublish
            </button>
          </template>
          <button
            type="button"
            class="slds-button slds-button_brand"
            data-id="publish"
            disabled={publishDisabled}
            onclick={handlePublish}
          >
            Publish
          </button>
        </div>

        <!-- The counters under the toolbar, in the same place and with the same words as on
             Manual Build (desktop ScheduleScreen.jsx; Greg's decision 3, 2026-10-20). -->
        <c-shoresh-week-checks
          slot="checks"
          checked={checked}
          reset-key={checksResetKey}
          route="generated"
          onlocate={handleLocate}
          onhighlight={handleHighlight}
        ></c-shoresh-week-checks>
      </template>
    </c-shoresh-week-editor>

    <template lwc:if={publishAsk}>
      <c-shoresh-ask
        heading={publishAsk.heading}
        lines={publishAsk.lines}
        confirm-label={publishAsk.confirmLabel}
        onanswer={handlePublishAnswer}
        data-id="publish-ask"
      ></c-shoresh-ask>
    </template>
    <template lwc:if={unpublishAsk}>
      <c-shoresh-ask
        heading={unpublishAsk.heading}
        lines={unpublishAsk.lines}
        confirm-label="Unpublish"
        onanswer={handleUnpublishAnswer}
        data-id="unpublish-ask"
      ></c-shoresh-ask>
    </template>

    <!-- Rebuild: the desktop's ConfirmRegenModal. -->
    <template lwc:if={confirming}>
      <section
        role="alertdialog"
        aria-modal="true"
        aria-labelledby="confirm-title"
        aria-describedby="confirm-body"
        class="slds-modal slds-fade-in-open"
        data-id="confirm"
        onkeydown={handleConfirmKeyDown}
      >
        <div class="slds-modal__container">
          <div class="slds-modal__header">
            <h2 id="confirm-title" class="slds-modal__title">{confirmTitle}</h2>
          </div>
          <div class="slds-modal__content slds-p-around_medium">
            <p id="confirm-body" data-id="confirm-body">{confirmBody}</p>
            <p class="confirm-note" data-id="confirm-note">{confirmNote}</p>
          </div>
          <div class="slds-modal__footer">
            <button
              type="button"
              class="slds-button slds-button_neutral"
              onclick={handleCancelConfirm}
              data-id="confirm-cancel"
            >
              Cancel
            </button>
            <button
              type="button"
              class="slds-button slds-button_destructive"
              onclick={handleConfirm}
              data-id="confirm-go"
            >
              {confirmLabel}
            </button>
          </div>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
  </div>
</template>
