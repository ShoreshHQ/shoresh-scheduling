<template>
  <article class="slds-card slds-card_boundary">
    <div class="slds-card__header slds-grid slds-grid_vertical-align-center">
      <h2 class="slds-text-heading_medium" tabindex="-1" data-heading>
        {title}
      </h2>
      <c-shoresh-saved-mark class="slds-m-left_small"></c-shoresh-saved-mark>
    </div>
    <div class="slds-card__body slds-card__body_inner">
      <template lwc:if={readOnly}>
        <div
          class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_small"
          role="status"
          data-id="read-only"
        >
          {blockedReason}
        </div>
      </template>
      <template lwc:if={error}>
        <div
          class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small"
          role="alert"
        >
          {error}
        </div>
      </template>
      <table
        class="slds-table slds-table_cell-buffer slds-table_bordered"
        aria-label={title}
      >
        <thead>
          <tr>
            <th scope="col">Standard word</th>
            <th scope="col">Your word (one)</th>
            <th scope="col">Your word (more than one)</th>
          </tr>
        </thead>
        <tbody>
          <template for:each={view} for:item="row">
            <tr key={row.term}>
              <td>{row.modelSingular} / {row.modelPlural}</td>
              <td>
                <lightning-input
                  label={row.modelSingular}
                  variant="label-hidden"
                  value={row.singular}
                  max-length="80"
                  data-term={row.term}
                  data-field="singular"
                  onchange={handleChange}
                  onfocusout={handleLeave}
                  onkeydown={handleKey}
                  disabled={readOnly}
                ></lightning-input>
                <template lwc:if={row.singularError}>
                  <div
                    class="slds-form-element__help slds-text-color_error"
                    role="alert"
                    data-error={row.term}
                    data-field-error="singular"
                  >
                    {row.singularError}
                  </div>
                </template>
              </td>
              <td>
                <lightning-input
                  label={row.modelPlural}
                  variant="label-hidden"
                  value={row.plural}
                  max-length="80"
                  data-term={row.term}
                  data-field="plural"
                  onchange={handleChange}
                  onfocusout={handleLeave}
                  onkeydown={handleKey}
                  disabled={readOnly}
                ></lightning-input>
                <template lwc:if={row.pluralError}>
                  <div
                    class="slds-form-element__help slds-text-color_error"
                    role="alert"
                    data-error={row.term}
                    data-field-error="plural"
                  >
                    {row.pluralError}
                  </div>
                </template>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </article>
</template>
