<template>
  <!-- The rail (the setup screens' grammar): how many words are the camp's own, then Saved.
       The screen's name is read out; the menu shows it. -->
  <div class="rail" data-id="rail">
    <h2 class="slds-assistive-text" tabindex="-1" data-heading>Camp words</h2>
    <c-shoresh-roots-back
      onbacktoroots={handleBackToRoots}
    ></c-shoresh-roots-back>
    <template lwc:if={changedCount}>
      <span class="rail-count" data-id="count"
        ><b class="shoresh-num">{changedCount}</b> changed</span
      >
    </template>
    <span class="rail-spacer"></span>
    <c-shoresh-saved-mark class="rail-saved"></c-shoresh-saved-mark>
  </div>
  <div class="shoresh-hairline" role="presentation"></div>
  <div class="list">
    <template lwc:if={readOnly}>
      <p class="note" role="status" data-id="read-only">{blockedReason}</p>
    </template>
    <template lwc:if={error}>
      <!-- Floats at the foot of the window, never moving the words (word walk W4). -->
      <div class="shoresh-refusal_float" role="alert">
        <p class="shoresh-refusal" data-id="error">{error}</p>
        <lightning-button-icon
          icon-name="utility:close"
          variant="bare"
          size="small"
          alternative-text="Close"
          data-id="error-close"
          onclick={handleCloseError}
        ></lightning-button-icon>
      </div>
    </template>
    <template lwc:if={loaded}>
      <!-- The column names, for the eye: every box is named on its own. -->
      <div class="words-head" aria-hidden="true">
        <span>Shoresh word</span><span>Camp word</span><span></span>
      </div>
      <template for:each={sections} for:item="section">
        <section
          key={section.key}
          class="words-section"
          data-section={section.key}
        >
          <h3 class="section-head">{section.title}</h3>
          <ul class="rows">
            <template for:each={section.rows} for:item="row">
              <li
                key={row.term}
                class="row shoresh-raised"
                data-term={row.term}
              >
                <span class="standard" data-id="standard"
                  >{row.modelSingular}</span
                >
                <span class="field">
                  <input
                    type="text"
                    class={row.singularClass}
                    aria-label={row.modelSingular}
                    placeholder={row.shown}
                    value={row.singular}
                    maxlength="80"
                    data-term={row.term}
                    data-field="singular"
                    oninput={handleChange}
                    onfocusout={handleLeave}
                    onkeydown={handleKey}
                    disabled={readOnly}
                  />
                  <template lwc:if={row.singularError}>
                    <span
                      class="field-error"
                      role="alert"
                      data-error={row.term}
                      data-field-error="singular"
                      >{row.singularError}</span
                    >
                  </template>
                </span>
                <span class="field">
                  <!-- The plural, a box at rest like the word's: the standard plural or the
                       guess from the camp's word, typed over where it is wrong. -->
                  <input
                    type="text"
                    class={row.pluralClass}
                    aria-label={row.pluralLabel}
                    placeholder={row.guess}
                    value={row.plural}
                    maxlength="80"
                    data-term={row.term}
                    data-field="plural"
                    oninput={handleChange}
                    onfocusout={handleLeave}
                    onkeydown={handleKey}
                    disabled={readOnly}
                  />
                  <template lwc:if={row.pluralError}>
                    <span
                      class="field-error"
                      role="alert"
                      data-error={row.term}
                      data-field-error="plural"
                      >{row.pluralError}</span
                    >
                  </template>
                </span>
              </li>
            </template>
          </ul>
        </section>
      </template>
    </template>
  </div>
</template>
