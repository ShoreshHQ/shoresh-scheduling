<template>
  <c-shoresh-rail-pop
    count={placed}
    label={placedWords}
    mark={offTarget}
    alternative-text={counterName}
    align="right"
    data-id="counter"
  >
    <div class="list" data-id="counter-list">
      <div class="bar" aria-hidden="true" data-id="bar">
        <span class="bar-fill" style={barStyle}></span>
      </div>
      <p class="shoresh-pop-row" data-id="still-needed">
        <b>{stillNeeded}</b><span>still needed</span>
      </p>
      <template lwc:if={showUnder}>
        <div class="shoresh-pop-divider" role="presentation"></div>
        <p class="shoresh-pop-row shoresh-pop-head" id="under" data-id="under">
          <b>{underCount}</b><span>under</span>
        </p>
        <template lwc:if={underRows.length}>
          <ul aria-labelledby="under">
            <template for:each={underRows} for:item="row">
              <li key={row.id}>
                <button
                  type="button"
                  class="shoresh-pop-row"
                  data-pop-row
                  data-activity={row.id}
                  aria-label={row.said}
                  onclick={handleActivity}
                >
                  <span class="name">{row.name}</span>
                  <span class="shoresh-pop-end"
                    ><b>{row.placed}</b><span>of {row.goal}</span></span
                  >
                </button>
              </li>
            </template>
          </ul>
        </template>
      </template>
      <template lwc:if={showOver}>
        <div class="shoresh-pop-divider" role="presentation"></div>
        <p class="shoresh-pop-row shoresh-pop-head" id="over" data-id="over">
          <b>{overCount}</b><span>over</span>
        </p>
        <template lwc:if={overRows.length}>
          <ul aria-labelledby="over">
            <template for:each={overRows} for:item="row">
              <li key={row.id}>
                <button
                  type="button"
                  class="shoresh-pop-row"
                  data-pop-row
                  data-activity={row.id}
                  aria-label={row.said}
                  onclick={handleActivity}
                >
                  <span class="name">{row.name}</span>
                  <span class="shoresh-pop-end"
                    ><span
                      class="shoresh-look-mark mark"
                      aria-hidden="true"
                    ></span
                    ><b>{row.placed}</b><span>of {row.goal}</span></span
                  >
                </button>
              </li>
            </template>
          </ul>
        </template>
      </template>
      <template lwc:if={lookRows.length}>
        <div class="shoresh-pop-divider" role="presentation"></div>
        <p class="shoresh-pop-row shoresh-pop-head" id="look" data-id="look">
          <b>{lookRows.length}</b><span>to look at</span>
        </p>
        <ul aria-labelledby="look">
          <template for:each={lookRows} for:item="line">
            <li key={line.key}>
              <button
                type="button"
                class="shoresh-pop-row look-row"
                data-pop-row
                data-key={line.key}
                onclick={handleLocate}
              >
                {line.text}
              </button>
            </li>
          </template>
        </ul>
      </template>
    </div>
  </c-shoresh-rail-pop>
</template>
