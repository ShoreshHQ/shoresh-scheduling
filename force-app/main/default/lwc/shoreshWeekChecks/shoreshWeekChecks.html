<template>
  <span class="slds-assistive-text" aria-live="polite" data-id="accept-said"
    >{acceptSaid}</span
  >
  <c-shoresh-rail-pop
    count={placed}
    label={placedWords}
    mark={showMark}
    alternative-text={counterName}
    align="right"
    data-id="counter"
  >
    <div class="list" data-id="counter-list">
      <div class="bar" aria-hidden="true" data-id="bar">
        <span class="bar-fill" style={barStyle}></span>
      </div>
      <p class="shoresh-pop-row" data-id="still-needed">
        <b>{stillNeeded}</b><span>still needed</span>
      </p>
      <template for:each={priorityRows} for:item="row">
        <p key={row.key} class="shoresh-pop-row" data-id={row.key}>
          <span>{row.label}</span
          ><span class="shoresh-pop-end"
            ><b>{row.met}</b><span>of {row.total} minimums met</span></span
          >
        </p>
      </template>
      <template lwc:if={spread}>
        <p class="shoresh-pop-row" data-id="spread">
          <span>Spread across the week</span
          ><span class="shoresh-pop-end"
            ><b>{spread.days}</b
            ><span>of {spread.sessions} on different days</span></span
          >
        </p>
      </template>
      <template lwc:if={openRows.length}>
        <div class="shoresh-pop-divider" role="presentation"></div>
        <p class="shoresh-pop-row shoresh-pop-head" id="open" data-id="open">
          <span>Open</span>
        </p>
        <ul aria-labelledby="open">
          <template for:each={openRows} for:item="line">
            <li key={line.key} class="line">
              <button
                type="button"
                class="shoresh-pop-row look-row"
                data-pop-row
                data-line
                data-key={line.key}
                onclick={handleLocate}
              >
                {line.text}
              </button>
              <button
                type="button"
                class="shoresh-pop-row accept"
                data-pop-row
                data-key={line.key}
                aria-label={line.acceptLabel}
                onclick={handleAccept}
              >
                Accept
              </button>
            </li>
          </template>
        </ul>
      </template>
      <template lwc:if={showUnder}>
        <div class="shoresh-pop-divider" role="presentation"></div>
        <p class="shoresh-pop-row shoresh-pop-head" id="under" data-id="under">
          <b>{underCount}</b><span>under</span>
        </p>
        <template lwc:if={underRows.length}>
          <ul aria-labelledby="under">
            <template for:each={underRows} for:item="row">
              <li key={row.key} class="line">
                <button
                  type="button"
                  class="shoresh-pop-row"
                  data-pop-row
                  data-line
                  data-activity={row.id}
                  aria-label={row.said}
                  onclick={handleActivity}
                >
                  <span class="name">{row.name}</span>
                  <span class="shoresh-pop-end"
                    ><b>{row.placed}</b><span>of {row.goal}</span></span
                  >
                </button>
                <button
                  type="button"
                  class="shoresh-pop-row accept"
                  data-pop-row
                  data-key={row.key}
                  aria-label={row.acceptLabel}
                  onclick={handleAccept}
                >
                  Accept
                </button>
              </li>
            </template>
          </ul>
        </template>
      </template>
      <template lwc:if={showOver}>
        <div class="shoresh-pop-divider" role="presentation"></div>
        <p class="shoresh-pop-row shoresh-pop-head" id="over" data-id="over">
          <b>{overCount}</b><span>over</span>
        </p>
        <template lwc:if={overRows.length}>
          <ul aria-labelledby="over">
            <template for:each={overRows} for:item="row">
              <li key={row.key} class="line">
                <button
                  type="button"
                  class="shoresh-pop-row"
                  data-pop-row
                  data-line
                  data-activity={row.id}
                  aria-label={row.said}
                  onclick={handleActivity}
                >
                  <span class="name">{row.name}</span>
                  <span class="shoresh-pop-end"
                    ><span
                      class="shoresh-look-mark mark"
                      aria-hidden="true"
                    ></span
                    ><b>{row.placed}</b><span>of {row.goal}</span></span
                  >
                </button>
                <button
                  type="button"
                  class="shoresh-pop-row accept"
                  data-pop-row
                  data-key={row.key}
                  aria-label={row.acceptLabel}
                  onclick={handleAccept}
                >
                  Accept
                </button>
              </li>
            </template>
          </ul>
        </template>
      </template>
      <template lwc:if={lookRows.length}>
        <div class="shoresh-pop-divider" role="presentation"></div>
        <p class="shoresh-pop-row shoresh-pop-head" id="look" data-id="look">
          <b>{lookRows.length}</b><span>to look at</span>
        </p>
        <ul aria-labelledby="look">
          <template for:each={lookRows} for:item="line">
            <li key={line.key} class="line">
              <button
                type="button"
                class="shoresh-pop-row look-row"
                data-pop-row
                data-line
                data-key={line.key}
                onclick={handleLocate}
              >
                {line.text}
              </button>
              <template lwc:if={line.acceptable}>
                <button
                  type="button"
                  class="shoresh-pop-row accept"
                  data-pop-row
                  data-key={line.key}
                  aria-label={line.acceptLabel}
                  onclick={handleAccept}
                >
                  Accept
                </button>
              </template>
            </li>
          </template>
        </ul>
      </template>
      <template lwc:if={noteRows.length}>
        <div class="shoresh-pop-divider" role="presentation"></div>
        <p class="shoresh-pop-row shoresh-pop-head" id="notes" data-id="notes">
          <span>Notes</span>
        </p>
        <ul aria-labelledby="notes">
          <template for:each={noteRows} for:item="line">
            <li key={line.key} class="line">
              <!-- A note names no cell: its Accept is its row for focus and the keys. -->
              <p class="shoresh-pop-row look-row note">{line.text}</p>
              <button
                type="button"
                class="shoresh-pop-row accept"
                data-pop-row
                data-line
                data-key={line.key}
                aria-label={line.acceptLabel}
                onclick={handleAccept}
              >
                Accept
              </button>
            </li>
          </template>
        </ul>
      </template>
    </div>
  </c-shoresh-rail-pop>
</template>
