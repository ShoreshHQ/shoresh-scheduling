<template>
  <!-- The rail (the setup screens' grammar): the list's name, how many answers are remembered
       and, past 15 lines, the search. The screen's name (Settings) is read out; the menu shows it. -->
  <h2 class="slds-assistive-text" tabindex="-1" data-heading>Settings</h2>
  <div class="rail" data-id="rail">
    <h3 class="rail-title" data-id="list-title">What Shoresh has learned</h3>
    <template lwc:if={hasCount}>
      <span class="rail-count" data-id="count"
        ><b class="shoresh-num">{count}</b> {countWord}</span
      >
      <template lwc:if={searching}>
        <span class="shoresh-rail-line" role="presentation"></span>
        <input
          type="search"
          class="well search"
          aria-label="Search what Shoresh has learned"
          placeholder="Search"
          value={query}
          data-id="search"
          oninput={handleSearch}
        />
      </template>
    </template>
  </div>
  <div class="shoresh-hairline" role="presentation"></div>
  <p
    class="slds-assistive-text"
    role="status"
    aria-live="polite"
    data-id="said"
  >
    {announcement}
  </p>
  <div class="list">
    <template lwc:if={isError}>
      <div class="load-error" role="alert" data-id="load-error">
        <span>{loadError}</span>
        <button
          type="button"
          class="shoresh-item link"
          data-id="retry-load"
          onclick={handleRetryLoad}
        >
          Try again
        </button>
      </div>
    </template>
    <template lwc:if={isEmpty}>
      <c-shoresh-empty-state
        title="Nothing learned yet"
        data-id="empty"
      ></c-shoresh-empty-state>
    </template>
    <template lwc:if={isReady}>
      <template lwc:if={notice}>
        <p class="note" data-id="notice">{notice}</p>
      </template>
      <template lwc:if={noMatches}>
        <p class="note" data-id="no-matches">
          {noMatchesText}
          <button
            type="button"
            class="shoresh-item link"
            data-id="clear"
            onclick={handleClear}
          >
            Clear search
          </button>
        </p>
      </template>
      <ul class="rows" data-id="lines">
        <template for:each={shown} for:item="line">
          <li
            key={line.key}
            class={line.liClass}
            data-line={line.key}
            data-kind={line.kind}
          >
            <div class="line1">
              <span class="title" data-id="title">{line.title}</span>
              <template lwc:if={line.hasFlag}>
                <span class="flag" data-id="flag">{line.flag}</span>
              </template>
              <template lwc:elseif={line.isPattern}>
                <span class="flag" data-id="flag">{line.patternFlag}</span>
              </template>
            </div>
            <template lwc:if={line.error}>
              <p class="row-error" role="alert" data-id="row-error">
                {line.error}
                <button
                  type="button"
                  class="shoresh-item link"
                  data-line={line.key}
                  data-id="retry"
                  onclick={handleRetry}
                >
                  Try again
                </button>
              </p>
            </template>
            <template lwc:if={line.isPattern}>
              <div class="line2 line_progress">
                <span class="meter" aria-hidden="true">
                  <template for:each={line.dots} for:item="dot">
                    <i key={dot.key} class={dot.className}></i>
                  </template>
                </span>
                <span class="meta" data-id="progress">{line.progress}</span>
              </div>
            </template>
            <div class="line2">
              <span class="meta"
                ><span data-id="how">{line.how}</span
                ><template lwc:if={line.when}
                  ><span aria-hidden="true"> · </span
                  ><span class="shoresh-num" data-id="when"
                    >{line.when}</span
                  ></template
                ></span
              >
              <template lwc:if={line.hasActions}>
                <span class="actions">
                  <template lwc:if={line.canUndo}>
                    <button
                      type="button"
                      class="shoresh-item link"
                      aria-label={line.undoLabel}
                      aria-busy={line.busy}
                      disabled={line.busy}
                      data-line={line.key}
                      data-id="undo"
                      onclick={handleUndo}
                    >
                      {line.undoText}
                    </button>
                  </template>
                  <template lwc:if={line.canChange}>
                    <button
                      type="button"
                      class="shoresh-item link"
                      aria-label={line.changeLabel}
                      data-line={line.key}
                      data-id="change"
                      onclick={handleChange}
                    >
                      Change
                    </button>
                  </template>
                  <template lwc:if={line.canForget}>
                    <button
                      type="button"
                      class="shoresh-item link link_forget"
                      aria-label={line.forgetLabel}
                      aria-busy={line.busy}
                      disabled={line.busy}
                      data-line={line.key}
                      data-id="forget"
                      onclick={handleForget}
                    >
                      {line.forgetText}
                    </button>
                  </template>
                </span>
              </template>
            </div>
            <template lwc:if={line.editing}>
              <div
                class="editor"
                role="group"
                aria-label={line.changeLabel}
                data-line={line.key}
                data-id="editor"
                onkeydown={handleEditorKey}
              >
                <span class="choices">
                  <template for:each={line.choiceViews} for:item="choice">
                    <button
                      key={choice.value}
                      type="button"
                      class={choice.className}
                      aria-pressed={choice.pressed}
                      data-line={line.key}
                      data-choice-of={line.key}
                      data-value={choice.value}
                      data-id="choice"
                      onclick={handleChoice}
                    >
                      {choice.label}
                    </button>
                  </template>
                </span>
                <span class="actions">
                  <template lwc:if={line.canSave}>
                    <button
                      type="button"
                      class="shoresh-item shoresh-item_primary"
                      aria-busy={line.busy}
                      disabled={line.busy}
                      data-line={line.key}
                      data-id="save"
                      onclick={handleSave}
                    >
                      {line.saveText}
                    </button>
                  </template>
                  <button
                    type="button"
                    class="shoresh-item link"
                    data-line={line.key}
                    data-id="cancel"
                    onclick={handleCancel}
                  >
                    Cancel
                  </button>
                </span>
              </div>
            </template>
          </li>
        </template>
        <template for:each={knew} for:item="rule">
          <li key={rule.id} class="row row_knew" data-rule={rule.rule}>
            <div class="line1">
              <span class="title" data-id="title">{rule.title}</span>
            </div>
            <div class="line2">
              <span class="meta" data-id="how">{rule.how}</span>
            </div>
          </li>
        </template>
        <template lwc:if={showsCapped}>
          <li class="row row_knew" data-id="capped">
            <div class="line1">
              <span class="title">Older entries not shown</span>
            </div>
          </li>
        </template>
      </ul>
      <template lwc:if={more}>
        <button
          type="button"
          class="shoresh-item link"
          data-id="more"
          onclick={handleMore}
        >
          {moreLabel}
        </button>
      </template>
    </template>
  </div>
</template>
