<template>
  <!-- The rail (the setup screens' grammar): how many answers are remembered and, past 15, the
       search and the kind filter. The screen's name is read out; the menu shows it. -->
  <div class="rail" data-id="rail">
    <h2 class="slds-assistive-text" tabindex="-1" data-heading>
      What Shoresh has learned
    </h2>
    <template lwc:if={isReady}>
      <span class="rail-count" data-id="count"
        ><b class="shoresh-num">{count}</b> {countWord}</span
      >
      <template lwc:if={searching}>
        <span class="shoresh-rail-line" role="presentation"></span>
        <input
          type="search"
          class="well search"
          aria-label="Search answers"
          placeholder="Search answers"
          value={query}
          data-id="search"
          oninput={handleSearch}
        />
        <select
          class="well kind"
          aria-label="Kind"
          data-id="kind"
          onchange={handleKind}
        >
          <template for:each={kindOptions} for:item="option">
            <option
              key={option.value}
              value={option.value}
              selected={option.selected}
            >
              {option.label}
            </option>
          </template>
        </select>
      </template>
    </template>
  </div>
  <div class="shoresh-hairline" role="presentation"></div>
  <p
    class="slds-assistive-text"
    role="status"
    aria-live="polite"
    data-id="said"
  >
    {announcement}
  </p>
  <div class="list">
    <template lwc:if={isError}>
      <div class="load-error" role="alert" data-id="load-error">
        <span>{loadError}</span>
        <button
          type="button"
          class="shoresh-item link"
          data-id="retry-load"
          onclick={handleRetryLoad}
        >
          Try again
        </button>
      </div>
    </template>
    <template lwc:if={isEmpty}>
      <c-shoresh-empty-state
        title="Nothing learned yet"
        data-id="empty"
      ></c-shoresh-empty-state>
    </template>
    <template lwc:if={isReady}>
      <template lwc:if={notice}>
        <p class="note" data-id="notice">{notice}</p>
      </template>
      <template lwc:if={noMatches}>
        <p class="note" data-id="no-matches">
          {noMatchesText}
          <button
            type="button"
            class="shoresh-item link"
            data-id="clear"
            onclick={handleClear}
          >
            Clear search
          </button>
        </p>
      </template>
      <template for:each={groups} for:item="group">
        <section key={group.key} class="group" data-group={group.key}>
          <h3 class="group-head">
            <button
              type="button"
              class="group-toggle"
              aria-expanded={group.expanded}
              aria-controls={group.panelId}
              data-group={group.key}
              data-id="group-toggle"
              onclick={handleToggle}
            >
              <span>{group.label}</span>
              <span class="group-count shoresh-num" data-id="group-count"
                >{group.count}</span
              >
              <svg
                class={group.chevronClass}
                viewBox="0 0 12 12"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M4.5 2.5 8 6l-3.5 3.5"></path>
              </svg>
            </button>
          </h3>
          <div id={group.panelId} class="panel">
            <template lwc:if={group.open}>
              <ul class="rows">
                <template for:each={group.rows} for:item="row">
                  <li key={row.id} class={row.liClass} data-row={row.id}>
                    <div class="line1">
                      <span class="title" data-id="title">{row.title}</span>
                      <template lwc:if={row.flag}>
                        <span class="flag" data-id="flag">{row.flag}</span>
                      </template>
                    </div>
                    <template lwc:if={row.error}>
                      <p class="row-error" role="alert" data-id="row-error">
                        {row.error}
                        <button
                          type="button"
                          class="shoresh-item link"
                          data-row={row.id}
                          data-id="retry"
                          onclick={handleRetry}
                        >
                          Try again
                        </button>
                      </p>
                    </template>
                    <div class="line2">
                      <template lwc:if={row.forgottenNow}>
                        <span class="meta" data-id="forgotten"
                          >{row.forgotten}</span
                        >
                        <button
                          type="button"
                          class="shoresh-item link"
                          aria-label={row.undoLabel}
                          aria-busy={row.busy}
                          disabled={row.busy}
                          data-row={row.id}
                          data-id="undo"
                          onclick={handleUndo}
                        >
                          {row.undoText}
                        </button>
                      </template>
                      <template lwc:else>
                        <span class="meta" data-id="who">{row.who}</span>
                        <template lwc:if={row.idle}>
                          <span class="actions">
                            <template lwc:if={row.canChange}>
                              <button
                                type="button"
                                class="shoresh-item link"
                                aria-label={row.changeLabel}
                                data-row={row.id}
                                data-id="change"
                                onclick={handleChange}
                              >
                                Change
                              </button>
                            </template>
                            <button
                              type="button"
                              class="shoresh-item link link_forget"
                              aria-label={row.forgetLabel}
                              aria-busy={row.busy}
                              disabled={row.busy}
                              data-row={row.id}
                              data-id="forget"
                              onclick={handleForget}
                            >
                              {row.forgetText}
                            </button>
                          </span>
                        </template>
                      </template>
                    </div>
                    <template lwc:if={row.editing}>
                      <div
                        class="editor"
                        role="group"
                        aria-label={row.changeLabel}
                        data-row={row.id}
                        data-id="editor"
                        onkeydown={handleEditorKey}
                      >
                        <span class="choices">
                          <template
                            for:each={row.choiceViews}
                            for:item="choice"
                          >
                            <button
                              key={choice.value}
                              type="button"
                              class={choice.className}
                              aria-pressed={choice.pressed}
                              data-row={row.id}
                              data-choice-of={row.id}
                              data-value={choice.value}
                              data-id="choice"
                              onclick={handleChoice}
                            >
                              {choice.label}
                            </button>
                          </template>
                        </span>
                        <span class="actions">
                          <template lwc:if={row.canSave}>
                            <button
                              type="button"
                              class="shoresh-item shoresh-item_primary"
                              aria-busy={row.busy}
                              disabled={row.busy}
                              data-row={row.id}
                              data-id="save"
                              onclick={handleSave}
                            >
                              {row.saveText}
                            </button>
                          </template>
                          <button
                            type="button"
                            class="shoresh-item link"
                            data-row={row.id}
                            data-id="cancel"
                            onclick={handleCancel}
                          >
                            Cancel
                          </button>
                        </span>
                      </div>
                    </template>
                  </li>
                </template>
              </ul>
              <template lwc:if={group.more}>
                <button
                  type="button"
                  class="shoresh-item link"
                  data-group={group.key}
                  data-id="more"
                  onclick={handleMore}
                >
                  {group.moreLabel}
                </button>
              </template>
            </template>
          </div>
        </section>
      </template>
    </template>
  </div>
</template>
