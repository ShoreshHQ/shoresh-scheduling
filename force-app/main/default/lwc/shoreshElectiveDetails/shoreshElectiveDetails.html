<template>
  <template lwc:if={offering}>
    <!-- The details zone beside the Electives list, as the Activities panel (ADR 0015 choice 12)
         and the approved mock-up (design-research electives-r1 setup-a): one hairline from the
         list, the offering's name, then its linked choices, each edited where it is. -->
    <section
      class="panel"
      data-id="details"
      aria-labelledby="elective-details-title"
    >
      <div class="panel-head">
        <h2
          id="elective-details-title"
          class="panel-title"
          tabindex="-1"
          data-heading
        >
          {name}<span class="slds-assistive-text"> details</span>
        </h2>
        <button
          type="button"
          class="panel-close"
          data-id="close"
          aria-label={closeLabel}
          title={closeLabel}
          onclick={handleClose}
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M4.5 4.5l7 7 M11.5 4.5l-7 7"></path>
          </svg>
        </button>
      </div>

      <h3 class="slds-assistive-text">{linkedTitle}</h3>
      <template for:each={choices} for:item="choice">
        <div
          key={choice.key}
          class={choice.className}
          data-id="linked-choice"
          data-key={choice.key}
        >
          <div class="field field_mark">
            <lightning-input
              data-id="choice-name"
              data-choice={choice.key}
              label={choice.nameLabel}
              value={choice.name}
              placeholder={choice.namePlaceholder}
              disabled={choice.disabled}
              max-length="80"
              onchange={handleNameInput}
              onkeydown={handleNameKey}
              onfocusout={handleNameLeave}
            ></lightning-input>
            <template lwc:if={choice.nameLook}>
              <c-shoresh-guess-mark
                words-only
                label={choice.nameLook}
                name={choice.nameLook}
                data-id="name-look"
              ></c-shoresh-guess-mark>
            </template>
          </div>
          <template lwc:if={choice.hasRows}>
            <div class="field field_mark">
              <span class="field-label">Periods</span>
              <template lwc:if={choice.periodsGuess}>
                <c-shoresh-guess-mark
                  label="Guessed from your file"
                  name={choice.periodsGuess}
                  data-id="periods-guess"
                  data-choice={choice.key}
                  onconfirm={handleConfirmGuess}
                ></c-shoresh-guess-mark>
              </template>
              <table class="periods" data-id="periods">
                <thead>
                  <tr>
                    <td></td>
                    <template for:each={choice.days} for:item="day">
                      <th key={day.key} scope="col" class="day">
                        <abbr title={day.label}>{day.short}</abbr>
                      </th>
                    </template>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={choice.rows} for:item="row">
                    <tr key={row.key}>
                      <th scope="row" class="clock shoresh-num">{row.clock}</th>
                      <template for:each={row.cells} for:item="cell">
                        <td key={cell.key} class="cell">
                          <template lwc:if={cell.shown}>
                            <button
                              type="button"
                              class={cell.className}
                              aria-pressed={cell.pressed}
                              aria-label={cell.label}
                              title={cell.label}
                              disabled={cell.disabled}
                              data-id="period"
                              data-cell={cell.id}
                              data-choice={choice.key}
                              data-weekday={cell.weekday}
                              data-block={cell.blockId}
                              onclick={handlePeriod}
                            >
                              <template lwc:if={cell.ticked}>
                                <svg
                                  viewBox="0 0 16 16"
                                  aria-hidden="true"
                                  class="tick"
                                >
                                  <path d="m4 8.5 2.5 2.5L12 5.5"></path>
                                </svg>
                              </template>
                            </button>
                            <template lwc:if={cell.look}>
                              <c-shoresh-guess-mark
                                words-only
                                label={cell.look}
                                name={cell.lookName}
                                data-id="period-look"
                              ></c-shoresh-guess-mark>
                            </template>
                          </template>
                        </td>
                      </template>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>
          <div class="field">
            <lightning-radio-group
              class="set"
              type="button"
              data-id="applies-to"
              data-choice={choice.key}
              label="Applies to"
              options={choice.appliesOptions}
              value={choice.appliesTo}
              disabled={choice.disabled}
              onchange={handleAppliesTo}
            ></lightning-radio-group>
          </div>
          <template lwc:if={choice.showDivisions}>
            <div class="field">
              <lightning-checkbox-group
                data-id="divisions"
                data-choice={choice.key}
                label={choice.divisionsLabel}
                options={choice.divisionOptions}
                value={choice.divisionValue}
                disabled={choice.disabled}
                onchange={handleDivisions}
              ></lightning-checkbox-group>
            </div>
          </template>
          <div class="choice-foot">
            <button
              type="button"
              class="choice-delete"
              data-id="delete-linked-choice"
              data-choice={choice.key}
              aria-label={choice.deleteLabel}
              title={choice.deleteLabel}
              onclick={handleDelete}
            >
              {choice.deleteText}
            </button>
          </div>
        </div>
      </template>
      <span class="slds-assistive-text" role="status" data-id="status"
        >{status}</span
      >
      <template lwc:if={error}>
        <p class="problem slds-text-color_error" role="alert" data-id="problem">
          {error}
        </p>
      </template>
      <template lwc:if={hasNote}>
        <p class="note" data-id="note">
          <template lwc:if={sitsNowhere}>{nowhereText}</template>
          <template lwc:else>{incompleteText}</template>
        </p>
      </template>
      <button
        type="button"
        class="add-choice"
        data-id="add-linked-choice"
        disabled={addDisabled}
        onclick={handleAdd}
      >
        <svg class="plus" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 3.5v9M3.5 8h9"></path>
        </svg>
        <span>{addLabel}</span>
      </button>
    </section>
  </template>
</template>
