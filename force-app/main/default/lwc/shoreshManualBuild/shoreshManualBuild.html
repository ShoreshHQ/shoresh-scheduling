<template>
  <div class="schedules" data-id="manual-build">
    <c-shoresh-week-editor
      data-id="week-editor"
      terms={terms}
      setup={setup}
      week-name={weekName}
      program-name={programName}
      save-runs={saveRuns}
      restoring={editsWait}
      setup-dots={setupDots}
      onsaved={handleSaved}
      onstatechange={handleEditorState}
      onedited={handleEdited}
      onerrorchange={handleEditorError}
      onreload={handleEditorReload}
    >
      <!-- The week and program pickers, as on the desktop, before how to look at the week. -->
      <template lwc:if={hasSeveralPrograms}>
        <lightning-combobox
          slot="pickers"
          class="picker"
          label={programLabel}
          value={programId}
          options={programOptions}
          disabled={pickersLocked}
          onchange={handleProgram}
          data-id="program"
        ></lightning-combobox>
      </template>
      <template lwc:if={canChoose}>
        <lightning-combobox
          slot="pickers"
          class="picker"
          label={weekLabel}
          value={weekId}
          options={weekOptions}
          disabled={pickersLocked}
          onchange={handleWeek}
          data-id="week"
        ></lightning-combobox>
      </template>
      <template lwc:if={showTools}>
        <div class="tools" slot="tools" data-id="tools">
          <template lwc:if={isDaily}>
            <template lwc:if={dayReadable}>
              <button
                type="button"
                class="slds-button slds-button_neutral"
                disabled={editsWait}
                data-id="clear-day"
                onclick={handleClearDay}
              >
                Clear day
              </button>
            </template>
            <template lwc:if={canCopyDay}>
              <lightning-button-menu
                label="Copy day to…"
                alternative-text="Copy day to…"
                menu-alignment="right"
                disabled={editsWait}
                data-id="copy-day"
                onselect={handleCopyDay}
              >
                <template for:each={copyTargets} for:item="target">
                  <lightning-menu-item
                    key={target.value}
                    value={target.value}
                    label={target.label}
                  ></lightning-menu-item>
                </template>
              </lightning-button-menu>
            </template>
          </template>
          <template lwc:if={isGroup}>
            <lightning-button-menu
              label="Clear day"
              alternative-text="Clear day"
              menu-alignment="right"
              disabled={editsWait}
              data-id="clear-group-day"
              onselect={handleClearGroupDay}
            >
              <template for:each={clearDayTargets} for:item="target">
                <lightning-menu-item
                  key={target.value}
                  value={target.value}
                  label={target.label}
                ></lightning-menu-item>
              </template>
            </lightning-button-menu>
          </template>
          <button
            type="button"
            class="slds-button slds-button_neutral"
            disabled={editsWait}
            data-id="clear-week"
            onclick={handleClearWeek}
          >
            {clearWeekLabel}
          </button>
        </div>
      </template>
      <template lwc:if={draft}>
        <div class="divider" slot="tools" aria-hidden="true"></div>
        <c-shoresh-versions
          slot="tools"
          restore
          versions={versions}
          open-id={restoredId}
          terms={terms}
          busy={versionsBusy}
          onopen={handleRestore}
          onrename={handleRenameVersion}
          ondelete={handleDeleteVersion}
          onsave={handleSaveVersion}
          data-id="versions"
        ></c-shoresh-versions>
      </template>
      <template lwc:if={canPublish}>
        <div class="publish" slot="tools" data-id="publish-area">
          <template lwc:if={publishState}>
            <span class="published" data-id="published">
              {publishedWord}<lightning-formatted-date-time
                value={publishState.publishedAt}
                month="short"
                day="numeric"
                hour="numeric"
                minute="2-digit"
              ></lightning-formatted-date-time
              >{publishedBy}
              <template lwc:if={publishState.changedSince}>
                <span data-id="changed-since"> · changed since</span>
              </template>
            </span>
          </template>
          <template lwc:if={publishState}>
            <button
              type="button"
              class="slds-button slds-button_neutral"
              data-id="unpublish"
              disabled={publishDisabled}
              onclick={handleUnpublish}
            >
              Unpublish
            </button>
          </template>
          <button
            type="button"
            class="slds-button slds-button_brand"
            data-id="publish"
            disabled={publishDisabled}
            onclick={handlePublish}
          >
            Publish
          </button>
        </div>
      </template>
      <template lwc:if={showCounters}>
        <c-shoresh-week-checks
          slot="checks"
          checked={checked}
          reset-key={checksResetKey}
          onlocate={handleLocate}
        ></c-shoresh-week-checks>
      </template>
      <template lwc:if={showSetupChanged}>
        <div class="setup-changed" slot="status" data-id="setup-changed">
          <c-shoresh-dot label={setupChangedText}></c-shoresh-dot>
          <span aria-hidden="true">{setupChangedText}</span>
          <template lwc:if={canUpdateToMatch}>
            <button
              type="button"
              class="slds-button slds-button_neutral"
              disabled={editsWait}
              data-id="update-to-match"
              onclick={handleSetupMatch}
            >
              Update to match setup
            </button>
          </template>
        </div>
      </template>
      <template lwc:if={restoreRefused}>
        <p class="notice" slot="status" data-id="restore-refused">
          <span>{restoreRefusedText} ·</span>
          <button
            type="button"
            class="slds-button tool-undo"
            data-id="reload"
            onclick={handleReloadAfterRefusal}
          >
            Reload
          </button>
        </p>
      </template>
      <template lwc:if={loading}>
        <lightning-spinner
          slot="status"
          alternative-text="Loading"
          size="small"
        ></lightning-spinner>
      </template>
      <template lwc:if={error}>
        <div
          slot="status"
          class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small"
          role="alert"
          data-id="build-error"
        >
          {error}
        </div>
      </template>
      <template lwc:if={leftOut}>
        <div class="not-placed" slot="outcome" role="status" data-id="left-out">
          <c-shoresh-dot label={leftOutLabel} focusable></c-shoresh-dot>
          <ul>
            <template for:each={leftOut} for:item="line">
              <li key={line}>{line}</li>
            </template>
          </ul>
        </div>
      </template>
      <template lwc:if={notPlaced}>
        <div
          class="not-placed"
          slot="outcome"
          role="status"
          data-id="not-placed"
        >
          <c-shoresh-dot
            label="Not placed: the cell was taken"
            focusable
            data-id="not-placed-dot"
          ></c-shoresh-dot>
          <ul>
            <template for:each={notPlaced} for:item="line">
              <li key={line}>{line}</li>
            </template>
          </ul>
        </div>
      </template>
      <template lwc:if={showStart}>
        <div class="start" slot="outcome" data-id="start">
          <lightning-button
            variant="brand"
            label={startLabel}
            disabled={starting}
            onclick={handleStart}
            data-id="start-week"
          ></lightning-button>
          <template lwc:if={hasWeekSources}>
            <lightning-button-menu
              label={startFromLabel}
              alternative-text={startFromLabel}
              disabled={starting}
              onselect={handleStartFrom}
              data-id="start-from"
            >
              <template for:each={weekSourceItems} for:item="source">
                <lightning-menu-item
                  key={source.value}
                  value={source.value}
                  label={source.label}
                ></lightning-menu-item>
              </template>
            </lightning-button-menu>
          </template>
        </div>
      </template>
      <template lwc:elseif={showStillNeeded}>
        <div class="still-needed-box" slot="outcome" data-id="still-needed-box">
          <p class="still-needed" data-id="still-needed">
            <template for:each={stillNeededParts} for:item="part">
              <template lwc:if={part.link}>
                <a
                  key={part.key}
                  href="#"
                  data-screen={part.screen}
                  onclick={handleStillNeeded}
                  >{part.text}</a
                >
              </template>
              <template lwc:else>
                <span key={part.key}>{part.text}</span>
              </template>
            </template>
          </p>
          <lightning-button
            variant="brand"
            label={setUpFirstLabel}
            data-screen={setUpFirstScreen}
            onclick={handleStillNeeded}
            data-id="set-up-first"
          ></lightning-button>
        </div>
      </template>
    </c-shoresh-week-editor>
    <template lwc:if={publishAsk}>
      <c-shoresh-ask
        heading={publishAsk.heading}
        lines={publishAsk.lines}
        confirm-label={publishAsk.confirmLabel}
        onanswer={handlePublishAnswer}
        data-id="publish-ask"
      ></c-shoresh-ask>
    </template>
    <template lwc:if={setupAsk}>
      <c-shoresh-setup-match
        heading={setupHeading}
        changes={setupChanges}
        busy={setupWorking}
        notice={setupAsk.notice}
        onupdate={handleSetupUpdate}
        onclose={handleSetupClose}
        data-id="setup-match"
      ></c-shoresh-setup-match>
    </template>
    <template lwc:if={unpublishAsk}>
      <c-shoresh-ask
        heading={unpublishAsk.heading}
        lines={unpublishAsk.lines}
        confirm-label="Unpublish"
        onanswer={handleUnpublishAnswer}
        data-id="unpublish-ask"
      ></c-shoresh-ask>
    </template>
  </div>
</template>
