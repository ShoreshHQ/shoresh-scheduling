<template>
  <div class="schedules" data-id="manual-build">
    <c-shoresh-week-editor
      data-id="week-editor"
      set-up-with={setUpWith}
      take-off-with={takeOffWith}
      onopenspecial={handleOpenSpecial}
      terms={terms}
      setup={setup}
      week-name={weekName}
      program-name={programName}
      save-runs={saveRuns}
      restoring={editsWait}
      setup-dots={setupDots}
      onsaved={handleSaved}
      onstatechange={handleEditorState}
      onedited={handleEdited}
      onerrorchange={handleEditorError}
      onreload={handleEditorReload}
      edit-items={editItems}
      oneditselect={handleEditSelect}
    >
      <!-- The rail's left: the program (when there are several) and the week, as on the
           desktop, before Edit and how to look at the week. -->
      <template lwc:if={hasSeveralPrograms}>
        <c-shoresh-rail-picker
          slot="pickers"
          label={programLabel}
          value={programId}
          options={programOptions}
          disabled={pickersLocked}
          onchange={handleProgram}
          data-id="program"
        ></c-shoresh-rail-picker>
      </template>
      <template lwc:if={canChoose}>
        <c-shoresh-rail-picker
          slot="pickers"
          label={weekLabel}
          value={weekId}
          options={weekOptions}
          disabled={pickersLocked}
          arrows
          onchange={handleWeek}
          data-id="week"
        ></c-shoresh-rail-picker>
      </template>
      <!-- The rail's right: the counter, then Versions and Publish at the edge, as on Generated
           Schedule and the desktop. -->
      <template lwc:if={showCounters}>
        <c-shoresh-week-checks
          slot="checks"
          measure={measure}
          reset-key={checksResetKey}
          onlocate={handleLocate}
          onshowactivity={handleShowActivity}
          data-id="counter"
        ></c-shoresh-week-checks>
      </template>
      <template lwc:if={draft}>
        <c-shoresh-versions
          slot="end"
          restore
          versions={versions}
          open-id={restoredId}
          terms={terms}
          busy={versionsBusy}
          announce-with={announceText}
          onopen={handleRestore}
          onrename={handleRenameVersion}
          ondelete={handleDeleteVersion}
          onsave={handleSaveVersion}
          data-id="versions"
        ></c-shoresh-versions>
      </template>
      <template lwc:if={canPublish}>
        <div class="publish" slot="end" data-id="publish-area">
          <!-- Published: when, and Unpublish, in a dropdown; the corner when the week changed
               since. -->
          <template lwc:if={publishState}>
            <c-shoresh-rail-pop
              label="Published"
              mark={publishState.changedSince}
              alternative-text={publishedName}
              align="right"
              data-id="published-menu"
            >
              <p class="shoresh-pop-row published" data-id="published">
                <span
                  >{publishedWord}<lightning-formatted-date-time
                    value={publishState.publishedAt}
                    month="short"
                    day="numeric"
                    hour="numeric"
                    minute="2-digit"
                  ></lightning-formatted-date-time
                  >{publishedBy}</span
                >
                <!-- Changed since it was published: said, and read out. -->
                <template lwc:if={publishState.changedSince}>
                  <c-shoresh-dot
                    class="changed-since"
                    label="Changed since"
                    focusable
                    data-id="changed-since"
                  ></c-shoresh-dot>
                </template>
              </p>
              <div class="shoresh-pop-divider" role="presentation"></div>
              <button
                type="button"
                class="shoresh-pop-row"
                data-pop-row
                data-id="unpublish"
                disabled={publishDisabled}
                onclick={handleUnpublish}
              >
                Unpublish
              </button>
            </c-shoresh-rail-pop>
          </template>
          <button
            type="button"
            class="shoresh-item shoresh-item_primary"
            data-id="publish"
            disabled={publishDisabled}
            onclick={handlePublish}
          >
            Publish
          </button>
        </div>
      </template>
      <!-- Setup changed since the week started: the cells carry their marks and the menu's foot
           says so, with Update to match setup (ADR 0015 §9). Here only when it can't be
           compared, so that is never hidden. -->
      <template lwc:if={setupProblem}>
        <p class="notice" slot="status" data-id="setup-problem">
          {setupProblem}
        </p>
      </template>
      <template lwc:if={restoreRefused}>
        <p class="notice" slot="status" data-id="restore-refused">
          <span>{restoreRefusedText} ·</span>
          <button
            type="button"
            class="slds-button tool-undo"
            data-id="reload"
            onclick={handleReloadAfterRefusal}
          >
            Reload
          </button>
        </p>
      </template>
      <template lwc:if={loading}>
        <lightning-spinner
          slot="status"
          alternative-text="Loading"
          size="small"
        ></lightning-spinner>
      </template>
      <template lwc:if={error}>
        <div
          slot="status"
          class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small"
          role="alert"
          data-id="build-error"
        >
          {error}
        </div>
      </template>
      <template lwc:if={leftOut}>
        <div class="not-placed" slot="outcome" role="status" data-id="left-out">
          <c-shoresh-dot label={leftOutLabel} focusable></c-shoresh-dot>
          <ul>
            <template for:each={leftOut} for:item="line">
              <li key={line}>{line}</li>
            </template>
          </ul>
        </div>
      </template>
      <template lwc:if={notPlaced}>
        <div
          class="not-placed"
          slot="outcome"
          role="status"
          data-id="not-placed"
        >
          <c-shoresh-dot
            label="Not placed: the cell was taken"
            focusable
            data-id="not-placed-dot"
          ></c-shoresh-dot>
          <ul>
            <template for:each={notPlaced} for:item="line">
              <li key={line}>{line}</li>
            </template>
          </ul>
        </div>
      </template>
      <template lwc:if={showStart}>
        <div class="start" slot="outcome" data-id="start">
          <lightning-button
            variant="brand"
            label={startLabel}
            disabled={starting}
            onclick={handleStart}
            data-id="start-week"
          ></lightning-button>
          <template lwc:if={hasWeekSources}>
            <lightning-button-menu
              label={startFromLabel}
              alternative-text={startFromLabel}
              disabled={starting}
              onselect={handleStartFrom}
              data-id="start-from"
            >
              <template for:each={weekSourceItems} for:item="source">
                <lightning-menu-item
                  key={source.value}
                  value={source.value}
                  label={source.label}
                ></lightning-menu-item>
              </template>
            </lightning-button-menu>
          </template>
        </div>
      </template>
      <template lwc:elseif={showStillNeeded}>
        <div class="still-needed-box" slot="outcome" data-id="still-needed-box">
          <p class="still-needed" data-id="still-needed">
            <template for:each={stillNeededParts} for:item="part">
              <template lwc:if={part.link}>
                <a
                  key={part.key}
                  href="#"
                  data-screen={part.screen}
                  onclick={handleStillNeeded}
                  >{part.text}</a
                >
              </template>
              <template lwc:else>
                <span key={part.key}>{part.text}</span>
              </template>
            </template>
          </p>
          <lightning-button
            variant="brand"
            label={setUpFirstLabel}
            data-screen={setUpFirstScreen}
            onclick={handleStillNeeded}
            data-id="set-up-first"
          ></lightning-button>
        </div>
      </template>
    </c-shoresh-week-editor>
    <template lwc:if={publishAsk}>
      <c-shoresh-ask
        heading={publishAsk.heading}
        lines={publishAsk.lines}
        confirm-label={publishAsk.confirmLabel}
        onanswer={handlePublishAnswer}
        data-id="publish-ask"
      ></c-shoresh-ask>
    </template>
    <template lwc:if={setupAsk}>
      <c-shoresh-setup-match
        heading={setupHeading}
        changes={setupChanges}
        busy={setupWorking}
        notice={setupAsk.notice}
        announcement={setupAsk.announcement}
        said={setupAsk.said}
        updated={setupAsk.updated}
        onupdate={handleSetupUpdate}
        onclose={handleSetupClose}
        data-id="setup-match"
      ></c-shoresh-setup-match>
    </template>
    <template lwc:if={unpublishAsk}>
      <c-shoresh-ask
        heading={unpublishAsk.heading}
        lines={unpublishAsk.lines}
        confirm-label="Unpublish"
        onanswer={handleUnpublishAnswer}
        data-id="unpublish-ask"
      ></c-shoresh-ask>
    </template>
  </div>
</template>
