<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixed Activities Setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
/* Setup round 1 · FIXED ACTIVITIES (with recurring below, same table).
   Base: round13/manual-build.html (approved, decision 39). Tokens, menu, frame, rail grammar and the
   one raised style are copied unchanged; only the table is new.
   Colour (decision 40): primary family #F6F8F5..#AEB6A7, highlight #1F6651 (+ tints), text #26231B. */
:root{
  --u: clamp(3px, calc(100vw / 360), 5px);
  --s1: calc(var(--u) * 1); --s2: calc(var(--u) * 2); --s3: calc(var(--u) * 3);
  --s4: calc(var(--u) * 4); --s5: calc(var(--u) * 6); --s6: calc(var(--u) * 8);
  --word: var(--s1); --in-group: var(--s1); --group-side: var(--s2); --control-x: var(--s2);
  --control-h: var(--s6); --page-margin: var(--s3); --gutter: var(--s3); --pad: var(--s3);
  --cell-gap: var(--s2); --menu-w: calc(var(--u) * 52); --r-mod: var(--s3); --r: var(--s2);
  --row-gap: var(--s1);                 /* row to row inside a section, like items in a rail group */
  --section-gap: var(--s5);             /* section to section */

  --primary:#AEB6A7; --accent:#F6F8F5; --text:#26231B; --hl:#1F6651;
  --page:#F3F5F2; --module:#EFF1EE; --well:#EBEDE9; --well-2:#E6E9E4;
  --edge:#D8DCD4; --rule:#D8DCD4; --shade:#808D74;
  --t1:var(--text);
  --t2:color-mix(in srgb, var(--text) 78%, var(--well-2));

  --mod-edge:0 0 0 1px var(--edge);
  --raise: 0 0 0 1px color-mix(in srgb, var(--shade) 22%, transparent),
           0 1px 2px color-mix(in srgb, var(--shade) 22%, transparent);
  --well-in: inset 0 1px 2px color-mix(in srgb, var(--shade) 16%, transparent);

  /* the table: name has room; the four facts share the rest; last column holds the details chevron */
  --tcols: minmax(0, 1.5fr) repeat(4, minmax(0, 1fr)) var(--control-h);

  --sans:"Inter",-apple-system,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);color:var(--t1);font-family:var(--sans);font-size:13px;line-height:1.25;
  -webkit-font-smoothing:antialiased;font-feature-settings:"cv11" 1;width:1440px;height:900px;overflow:hidden}
.num{font-variant-numeric:tabular-nums}
svg{display:block;flex:none}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.chev{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* Salesforce header: theirs, untouched */
.sf{height:40px;background:#F3F3F3;border-bottom:1px solid #DDDBDA;display:flex;align-items:center;padding:0 12px;gap:12px;font-family:-apple-system,system-ui,sans-serif}
.sf .logo{width:44px;height:22px;border-radius:11px;background:#C9C7C5}
.sf .search{margin:0 auto;width:560px;height:28px;background:#fff;border:1px solid #C9C7C5;border-radius:4px;display:flex;align-items:center;padding:0 10px;gap:8px;color:#706E6B;font-size:13px}
.sf .icons{display:flex;gap:10px}
.sf .icons span{width:22px;height:22px;border-radius:50%;background:#DDDBDA}
.sf .icons span.av{background:#B0ADAB}

.app{height:860px;padding:var(--page-margin);display:grid;gap:var(--gutter);grid-template-columns:var(--menu-w) 1fr}
.mod{background:var(--module);border-radius:var(--r-mod);box-shadow:var(--mod-edge);min-width:0;min-height:0;position:relative}

/* MENU: unchanged from round 13 */
nav{padding:var(--pad);display:flex;flex-direction:column}
.camp{height:var(--control-h);padding:0 var(--s2);display:flex;align-items:center;justify-content:space-between}
.camp b{font-size:14px;font-weight:600;letter-spacing:-.01em}
.camp span{font-size:13px;color:var(--t2)}
.hair{height:1px;background:var(--rule);flex:none}
nav .hair{margin:var(--pad) calc(-1 * var(--pad))}
.item{display:flex;align-items:center;gap:var(--s2);height:var(--control-h);padding:0 var(--s2);border-radius:var(--r);color:var(--t2)}
.item.cur{color:var(--t1);font-weight:500}
.sec{height:var(--control-h);display:flex;align-items:flex-end;padding:0 var(--s2) var(--s2);margin-top:var(--s2);font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--t2)}
.sub .item{padding-left:34px;position:relative}
.sub .item.cur::before{content:"";position:absolute;left:15px;top:13px;width:6px;height:6px;border-radius:50%;background:var(--hl)}
.foot{margin-top:auto}
nav .foot .hair{margin-bottom:var(--pad)}
.notice{display:flex;flex-direction:column;gap:var(--s2)}
.notice .what{display:flex;align-items:center;gap:var(--s2);color:var(--t2);height:var(--s4);padding:0 var(--s2)}
.notice .what i{width:6px;height:6px;border-radius:50%;background:var(--hl)}
.notice .go{height:var(--control-h);display:flex;align-items:center;justify-content:center;color:var(--hl);font-weight:500}

/* FRAME: one outer edge, zones divided by the one hairline */
.frame{display:flex;flex-direction:column;overflow:hidden}
.zone{padding:var(--pad);min-height:0}

/* RAIL: round 11 grammar. Item 32 tall, 8 side padding; rest = 400/t2, value = 500/t1; groups end in one hairline */
.rail{display:flex;align-items:center;height:calc(var(--control-h) + 2 * var(--pad));flex:none}
.grp{display:flex;align-items:center;gap:var(--in-group)}
.vr{width:1px;height:var(--s4);background:var(--rule);margin:0 var(--group-side);flex:none}
.c{height:var(--control-h);padding:0 var(--control-x);display:flex;align-items:center;gap:var(--word);border-radius:var(--r);color:var(--t2);white-space:nowrap}
.c b{font-weight:500;color:var(--t1);font-variant-numeric:tabular-nums}
.c .ic{margin-right:var(--s1)}
.spacer{flex:1}
.saved .ic{width:14px;height:14px}

/* BODY: the table */
.body{flex:1;overflow:hidden;display:flex;flex-direction:column}
.thead,.row,.add{display:grid;grid-template-columns:var(--tcols);align-items:center;height:var(--control-h)}
.thead>*,.row>*,.add>*{padding:0 var(--control-x);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.thead{color:var(--t2)}
.section{display:flex;flex-direction:column;gap:var(--row-gap)}
.section+.section{margin-top:var(--section-gap)}
.thead+.section{margin-top:var(--s1)}
/* a division is a heading, not a column */
.sech{height:var(--control-h);display:flex;align-items:center;gap:var(--s2);padding:0 var(--control-x)}
.sech b{font-size:14px;font-weight:600;letter-spacing:-.01em}
.sech span{color:var(--t2)}
/* rows: the one raised style, as a grid cell. The rule reads quiet, the exception reads as a value */
.row{position:relative;cursor:pointer}
.row .n{font-weight:500}
.row .d{color:var(--t2)}
.row .x{color:var(--t1);font-weight:500}
.row .t{color:var(--t1)}            /* time has no rule: a plain fact, never bold */
.row .go{display:flex;align-items:center;justify-content:center;padding:0;color:var(--t2);visibility:hidden}
.row.hov{background:color-mix(in srgb, var(--accent) 50%, var(--well))}
.row.hov .go{visibility:visible;color:var(--t1)}
/* the add row is a slot (the well an empty grid cell uses), never a raised row */
.add .first{background:var(--well-2);box-shadow:var(--well-in);border-radius:var(--r);color:var(--t2);height:100%}
.add .first{display:flex;align-items:center;gap:var(--s2)}
.add .first .ic{width:14px;height:14px}
.end{display:flex;justify-content:flex-end;margin-top:auto;padding-top:var(--section-gap)}
.btn-primary{height:var(--control-h);padding:0 var(--s4);border-radius:var(--r);background:var(--hl);color:var(--accent);font-weight:500;display:flex;align-items:center;gap:var(--s2);
  box-shadow:0 1px 2px color-mix(in srgb, var(--shade) 35%, transparent)}

/* ONE raised treatment, last so it wins */
.raised{background:var(--accent);box-shadow:var(--raise);border-radius:var(--r)}
.row.hov{background:color-mix(in srgb, var(--accent) 50%, var(--well))}
</style>
</head>
<body>
<div class="sf">
  <div class="logo"></div>
  <div class="search"><svg class="ic" viewBox="0 0 16 16" style="width:14px;height:14px"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>Search...</div>
  <div class="icons"><span></span><span></span><span></span><span class="av"></span></div>
</div>

<div class="app">
  <nav class="mod">
    <div class="camp"><b>Camp Tamarack</b><span class="num">2027</span></div>
    <div class="hair"></div>
    <div class="item"><svg class="ic" viewBox="0 0 16 16"><path d="M8 14V7"/><path d="M8 9C8 6 6 4.5 3 4.5c0 3 2 4.5 5 4.5Z"/><path d="M8 7.5c0-2.5 1.7-4 4.5-4 0 2.5-1.7 4-4.5 4Z"/></svg>Roots</div>
    <div class="sec">Camp</div>
    <div class="sub">
      <div class="item">Weeks</div><div class="item">Age divisions</div><div class="item">Groups</div><div class="item">Time blocks</div><div class="item">Locations</div>
    </div>
    <div class="sec">Activities</div>
    <div class="sub">
      <div class="item">Activities</div><div class="item cur raised">Fixed activities</div><div class="item">Recurring activities</div><div class="item">Special events</div>
    </div>
    <div class="sec">Schedules</div>
    <div class="sub">
      <div class="item">Generated Schedule</div><div class="item">Manual Build</div><div class="item">Schedules</div>
    </div>
    <div class="foot">
      <div class="hair"></div>
      <div class="notice">
        <div class="what"><i></i>Setup changed</div>
        <div class="go raised">Update to match setup</div>
      </div>
    </div>
  </nav>

  <div class="frame mod">
    <div class="rail zone">
      <div class="grp" id="totals"></div>
      <div class="spacer"></div>
      <div class="grp"><div class="c saved"><svg class="ic" viewBox="0 0 16 16"><path d="m3.5 8.5 3 3 6-7"/></svg>Saved</div></div>
      <div class="vr"></div>
      <div class="grp">
        <div class="c"><svg class="ic" viewBox="0 0 16 16"><path d="M8 10.5V2.5"/><path d="M5 5.5l3-3 3 3"/><path d="M2.5 10.5v2a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-2"/></svg>Import a list</div>
        <div class="c"><svg class="ic" viewBox="0 0 16 16"><path d="M8 2.5v8"/><path d="M5 7.5l3 3 3-3"/><path d="M2.5 10.5v2a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-2"/></svg>Download this list</div>
      </div>
    </div>
    <div class="hair"></div>
    <div class="body zone" id="body"></div>
  </div>
</div>

<script>
// Synthetic Camp Tamarack 2027: 7 weeks, Mon–Fri. Defaults ("Every …") are the rule; anything else is an exception.
const SECTIONS=[
 {name:"Whole camp", rows:[
  ["Breakfast","Every bunk","8:00–8:45","Every day","Every week"],
  ["Lunch","Every bunk","11:30–12:20","Every day","Every week"],
  ["Assembly","Every bunk","2:15–2:45","Every day","Off Wk 4"],
  ["Rest hour","Every bunk","2:50–3:35","Off Fri","Every week"],
  ["Dinner","Every bunk","5:30–6:15","Every day","Every week"],
  ["Campfire","Every bunk","7:00–8:30","Fri","Off Wk 1"]]},
 {name:"Juniors", bunks:"Cedar · Birch · Maple", rows:[
  ["Swim lessons","Every bunk","9:00–9:45","Mon Wed Fri","Every week"],
  ["Bunk time","Cedar, Birch","6:15–6:45","Every day","Every week"]]},
 {name:"Seniors", bunks:"Aspen · Willow · Pine · Oak", rows:[
  ["Trip morning","Pine, Oak","9:00–11:25","Wed","Wk 2, Wk 5"],
  ["Leadership","Aspen","10:40–11:25","Tue","Off Wk 1"],
  ["Waterfront","Every bunk","1:20–2:05","Tue Thu","Every week"]]}
];
const HOVER="Rest hour";
const isRule=v=>/^Every /.test(v);
const CHEV='<svg class="chev" viewBox="0 0 12 12"><path d="M4.5 3 7.5 6l-3 3"/></svg>';
const PLUS='<svg class="ic" viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9"/></svg>';
let h=`<div class="thead"><div>Name</div><div>Who</div><div>Time</div><div>Days</div><div>Weeks</div><div></div></div>`;
SECTIONS.forEach(s=>{
  h+=`<div class="section"><div class="sech"><b>${s.name}</b>${s.bunks?`<span>${s.bunks}</span>`:''}</div>`;
  s.rows.forEach(([n,...f])=>{
    h+=`<div class="row raised${n===HOVER?' hov':''}"><div class="n">${n}</div>`+
       f.map((v,i)=>`<div class="${i===1?'num t':isRule(v)?'d':'x'}">${v}</div>`).join('')+
       `<div class="go">${CHEV}</div></div>`;
  });
  h+=`<div class="add"><div class="first">${PLUS}Add</div><div></div><div></div><div></div><div></div><div></div></div></div>`;
});
h+=`<div class="end"><div class="btn-primary">Special events<svg class="ic" viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4"/></svg></div></div>`;
document.getElementById('body').innerHTML=h;
const fixed=SECTIONS[0].rows.length, rec=SECTIONS.slice(1).reduce((t,s)=>t+s.rows.length,0);
document.getElementById('totals').innerHTML=`<div class="c"><b>${fixed}</b>fixed</div><div class="c"><b>${rec}</b>recurring</div>`;
</script>
</body>
</html>
