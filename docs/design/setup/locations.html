<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup · Locations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
/* Setup round 1 · LOCATIONS. Base: round13/manual-build.html (approved, decision 39), palette decision 40.
   Same menu, same continuous frame (rail | content, one hairline), same rail grammar, one raised style.
   Types are section headings; weeks show only the exception; one add row; next screen at the end. */
:root{
  --u: clamp(3px, calc(100vw / 360), 5px);
  --s1: calc(var(--u) * 1); --s2: calc(var(--u) * 2); --s3: calc(var(--u) * 3);
  --s4: calc(var(--u) * 4); --s5: calc(var(--u) * 6); --s6: calc(var(--u) * 8);
  --word: var(--s1); --in-group: var(--s1); --group-side: var(--s2); --control-x: var(--s2);
  --control-h: var(--s6); --page-margin: var(--s3); --gutter: var(--s3); --pad: var(--s3);
  --cell-gap: var(--s2); --row-h: calc(var(--u) * 10); --menu-w: calc(var(--u) * 52);
  --r-mod: var(--s3); --r: var(--s2);

  /* one primary family, one highlight, text (decision 40) */
  --accent:#F6F8F5; --primary:#AEB6A7; --text:#26231B; --hl:#1F6651;
  --page:#F3F5F2; --module:#EFF1EE; --well:#EBEDE9; --well-2:#E6E9E4;
  --edge:#D8DCD4; --rule:#D8DCD4; --shade:#808D74;
  --t1:var(--text);
  --t2:color-mix(in srgb, var(--text) 78%, var(--well-2));

  --mod-edge:0 0 0 1px var(--edge);
  --raise: 0 0 0 1px color-mix(in srgb, var(--shade) 22%, transparent),
           0 1px 2px color-mix(in srgb, var(--shade) 22%, transparent);
  --well-in: inset 0 1px 2px color-mix(in srgb, var(--shade) 16%, transparent);

  /* the list's columns: name | groups that fit | activities held here | weeks | open */
  --cols: calc(var(--u) * 60) calc(var(--u) * 28) calc(var(--u) * 96) 1fr var(--s4);

  --sans:"Inter",-apple-system,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);color:var(--t1);font-family:var(--sans);font-size:13px;line-height:1.25;
  -webkit-font-smoothing:antialiased;font-feature-settings:"cv11" 1;width:1440px;height:900px;overflow:hidden}
.num{font-variant-numeric:tabular-nums}
svg{display:block;flex:none}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.chev{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* Salesforce header: theirs, untouched */
.sf{height:40px;background:#F3F3F3;border-bottom:1px solid #DDDBDA;display:flex;align-items:center;padding:0 12px;gap:12px;font-family:-apple-system,system-ui,sans-serif}
.sf .logo{width:44px;height:22px;border-radius:11px;background:#C9C7C5}
.sf .search{margin:0 auto;width:560px;height:28px;background:#fff;border:1px solid #C9C7C5;border-radius:4px;display:flex;align-items:center;padding:0 10px;gap:8px;color:#706E6B;font-size:13px}
.sf .icons{display:flex;gap:10px}
.sf .icons span{width:22px;height:22px;border-radius:50%;background:#DDDBDA}
.sf .icons span.av{background:#B0ADAB}

.app{height:860px;padding:var(--page-margin);display:grid;gap:var(--gutter);grid-template-columns:var(--menu-w) 1fr}
.mod{background:var(--module);border-radius:var(--r-mod);box-shadow:var(--mod-edge);min-width:0;min-height:0;position:relative}

/* MENU (unchanged; Locations is current) */
nav{padding:var(--pad);display:flex;flex-direction:column}
.camp{height:var(--control-h);padding:0 var(--s2);display:flex;align-items:center;justify-content:space-between}
.camp b{font-size:14px;font-weight:600;letter-spacing:-.01em}
.camp span{font-size:13px;color:var(--t2)}
.hair{height:1px;background:var(--rule);flex:none}
nav .hair{margin:var(--pad) calc(-1 * var(--pad))}
.item{display:flex;align-items:center;gap:var(--s2);height:var(--control-h);padding:0 var(--s2);border-radius:var(--r);color:var(--t2)}
.item.cur{color:var(--t1);font-weight:500}
.sec{height:var(--control-h);display:flex;align-items:flex-end;padding:0 var(--s2) var(--s2);margin-top:var(--s2);font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--t2)}
.sub .item{padding-left:34px;position:relative}
.sub .item.cur::before{content:"";position:absolute;left:15px;top:13px;width:6px;height:6px;border-radius:50%;background:var(--hl)}

/* FRAME: rail | content, one hairline */
.frame{display:flex;flex-direction:column}
.zone{padding:var(--pad);min-height:0}

/* RAIL: the round 11/13 grammar */
.rail{display:flex;align-items:center;height:calc(var(--control-h) + 2 * var(--pad));flex:none}
.grp{display:flex;align-items:center;gap:var(--in-group)}
.vr{width:1px;height:var(--s4);background:var(--rule);margin:0 var(--group-side);flex:none}
.c{height:var(--control-h);padding:0 var(--control-x);display:flex;align-items:center;gap:var(--word);border-radius:var(--r);color:var(--t2);white-space:nowrap}
.c.on{color:var(--t1);font-weight:500}
.c b{font-weight:500;color:var(--t1);font-variant-numeric:tabular-nums}
.side{display:flex;align-items:center;flex:1 1 0;min-width:0}
.side.r{justify-content:flex-end}
.mid{display:flex;align-items:center;flex:none}
.saved{color:var(--t2)}
.saved svg{width:12px;height:12px}

/* CONTENT */
.list{flex:1;display:flex;flex-direction:column;overflow:hidden}
.cols{display:grid;grid-template-columns:var(--cols);align-items:center;column-gap:var(--s4);padding:0 var(--control-x)}
.head{height:var(--control-h);color:var(--t2);flex:none}
.head .r{text-align:right}
.type{height:var(--control-h);display:flex;align-items:flex-end;gap:var(--s2);padding:0 var(--control-x) var(--s2);margin-top:var(--s2);font-weight:500}
.type span{color:var(--t2);font-weight:400;font-variant-numeric:tabular-nums}
.panel{border-radius:var(--r);flex:none}
.row{height:var(--row-h);position:relative}
.row + .row{box-shadow:0 -1px 0 var(--rule)}
.row .name{display:flex;align-items:center;gap:var(--word);white-space:nowrap}
.row .fit{text-align:right;font-variant-numeric:tabular-nums}
.row .acts{color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .wk{color:var(--t2);white-space:nowrap}
.row .wk.ex{color:var(--t1);font-weight:500}
.row .open{color:var(--t2);visibility:hidden}
.row.hov{background:color-mix(in srgb, var(--accent) 50%, var(--well))}
.row.hov .open{visibility:visible}
.panel .row.hov:first-child{border-radius:var(--r) var(--r) 0 0}
.panel .row.hov:last-child{border-radius:0 0 var(--r) var(--r)}

/* same-name mark: the corner mark used on cells and the counter */
.mk{width:8px;height:8px;flex:none;border-top-right-radius:2px;background:var(--t1);clip-path:polygon(0 0,100% 0,100% 100%);transform:translateY(-3px)}

/* ADD ROW: an empty slot (the grid's well), not a raised row */
.add{height:var(--row-h);margin-top:var(--s4);border-radius:var(--r);background:var(--well-2);box-shadow:var(--well-in);flex:none}
.add .name{color:var(--t2);display:flex;align-items:center;gap:var(--s2)}
.add .name svg{width:14px;height:14px}

/* END: next screen */
.end{display:flex;justify-content:flex-end;padding-top:var(--s4);flex:none}
.btn-primary{height:var(--control-h);padding:0 var(--s4);border-radius:var(--r);background:var(--hl);color:var(--accent);font-weight:500;display:flex;align-items:center;gap:var(--s2);
  box-shadow:0 1px 2px color-mix(in srgb, var(--shade) 35%, transparent)}

/* ONE raised treatment, last so it wins */
.raised{background:var(--accent);box-shadow:var(--raise);border-radius:var(--r)}
</style>
</head>
<body>
<div class="sf">
  <div class="logo"></div>
  <div class="search"><svg class="ic" viewBox="0 0 16 16" style="width:14px;height:14px"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>Search...</div>
  <div class="icons"><span></span><span></span><span></span><span class="av"></span></div>
</div>

<div class="app">
  <nav class="mod">
    <div class="camp"><b>Camp Tamarack</b><span class="num">2027</span></div>
    <div class="hair"></div>
    <div class="item"><svg class="ic" viewBox="0 0 16 16"><path d="M8 14V7"/><path d="M8 9C8 6 6 4.5 3 4.5c0 3 2 4.5 5 4.5Z"/><path d="M8 7.5c0-2.5 1.7-4 4.5-4 0 2.5-1.7 4-4.5 4Z"/></svg>Roots</div>
    <div class="sec">Camp</div>
    <div class="sub">
      <div class="item">Weeks</div><div class="item">Age divisions</div><div class="item">Groups</div><div class="item">Time blocks</div><div class="item cur raised">Locations</div>
    </div>
    <div class="sec">Activities</div>
    <div class="sub">
      <div class="item">Activities</div><div class="item">Fixed activities</div><div class="item">Recurring activities</div><div class="item">Special events</div>
    </div>
    <div class="sec">Schedules</div>
    <div class="sub">
      <div class="item">Generated Schedule</div><div class="item">Manual Build</div><div class="item">Schedules</div>
    </div>
  </nav>

  <div class="frame mod">
    <div class="rail zone">
      <div class="side l"><div class="grp"><div class="c"><b id="count"></b>locations</div></div></div>
      <div class="mid"><div class="grp" id="show"></div></div>
      <div class="side r"><div class="grp"><div class="c saved"><svg class="chev" viewBox="0 0 12 12"><path d="M2.5 6.25 5 8.5l4.5-5"/></svg>Saved</div></div>
      <div class="vr"></div>
      <div class="grp"><div class="c">Import a list</div><div class="c">Download this list</div></div></div>
    </div>
    <div class="hair"></div>
    <div class="list zone" id="list"></div>
  </div>
</div>

<script>
// Synthetic Camp Tamarack locations, 2027 season (8 weeks). Grouped by the camp's own location types.
const DATA=[
 ["Waterfront",[
   ["Lakefront",4,["Swim","Free swim","Swim lessons"],""],
   ["Pool",3,["Swim lessons","Water polo"],""],
   ["Boathouse",2,["Boating","Canoe","Kayak"],"Closed Wk 1"]]],
 ["Fields & courts",[
   ["Upper field",3,["Soccer","Flag football","Ultimate"],""],
   ["Lower field",2,["Softball","Kickball"],""],
   ["Basketball court",2,["Basketball"],""],
   ["Basketball courts",1,[],"",true],
   ["Gaga pit",1,["Gaga"],""],
   ["Archery range",1,["Archery"],"Closed Wk 5"]]],
 ["Indoors",[
   ["Arts & crafts barn",2,["Arts & crafts","Woodshop","Tie-dye"],""],
   ["Rec hall",2,["Drama","Dance","Rainy day games"],"Closed Wk 3–4"]]]];
const HOVER="Lower field";
const total=DATA.reduce((t,[,r])=>t+r.length,0);
document.getElementById('show').innerHTML=
  `<div class="c on raised">All</div>`+DATA.map(([t,r])=>`<div class="c">${t}</div>`).join('');
document.getElementById('count').textContent=total;
const MK='<i class="mk" aria-label="Same name as another location"></i>';
const OPEN='<svg class="chev open" viewBox="0 0 12 12"><path d="m4.5 3 3 3-3 3"/></svg>';
let h=`<div class="cols head"><div>Name</div><div class="r">Groups that fit</div><div>Activities held here</div><div>Weeks</div><div></div></div>`;
DATA.forEach(([type,rows])=>{
  h+=`<div class="type">${type}<span>${rows.length}</span></div><div class="panel raised">`;
  rows.forEach(([n,fit,acts,wk,dup])=>{
    h+=`<div class="row cols${n===HOVER?' hov':''}"><div class="name">${n}${dup?MK:''}</div><div class="fit">${fit}</div>`+
       `<div class="acts">${acts.join(', ')}</div><div class="wk${wk?' ex':''}">${wk||'Every week'}</div>${OPEN}</div>`;
  });
  h+=`</div>`;
});
h+=`<div class="add cols"><div class="name"><svg class="ic" viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9"/></svg>Add a location</div></div>`;
h+=`<div class="end"><div class="btn-primary">Activities<svg class="ic" viewBox="0 0 16 16"><path d="M3.5 8h9M9 4.5 12.5 8 9 11.5"/></svg></div></div>`;
document.getElementById('list').innerHTML=h;
</script>
</body>
</html>
